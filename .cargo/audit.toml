# cargo-audit configuration
# https://rustsec.org/advisories/

[advisories]
ignore = [
    # paste is unmaintained but has no known security issues.
    # It's a transitive dependency of cel-interpreter used for CEL policy constraints.
    # TODO: Watch for cel-interpreter updates that remove paste dependency.
    "RUSTSEC-2024-0436",

    # proc-macro-error unmaintained (RUSTSEC-2024-0370) — no security impact.
    # proc-macro-error 0.4.12, transitive via iroh-blobs → bao-tree →
    # genawaiter. (The 1.0.4 copy via c2pa-rs → iref is gone.)
    "RUSTSEC-2024-0370",

    # atomic-polyfill unmaintained (RUSTSEC-2023-0089) — no security impact.
    # Transitive via iroh-blobs → postcard 1.1.3 → heapless 0.7.17. postcard pins
    # heapless ^0.7 (the atomic-polyfill era); no escape until postcard adopts
    # heapless 0.8+. Informational/unmaintained only — same class as the paste/
    # proc-macro-error ignores above.
    "RUSTSEC-2023-0089",

    # EXPIRES 2027-01-31. crypto-bigint 0.5.5 timing variability (patched only
    # in 0.7.6+). Reachable only through age 0.12.1 (latest) -> p256 0.13 for
    # p256tag recipients; nucleus-oidc-provider decrypts with
    # age::scrypt::Identity only. All nucleus P-256/P-384 code is on p256/p384
    # 0.14. Mirrors the deny.toml ignore.
    "RUSTSEC-2026-0387",

    # EXPIRES 2027-01-31. basic-toml unmaintained (RUSTSEC-2026-0374), no
    # security issue. Transitive, build-time only: age 0.12.1 -> i18n-embed-fl /
    # i18n-embed-impl (proc-macros) -> i18n-config. cargo-deny already scopes
    # unmaintained to workspace deps and does not flag it.
    "RUSTSEC-2026-0374",
]

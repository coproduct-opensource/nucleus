# Nextest configuration for Nucleus workspace
# https://nexte.st/book/configuration.html

[profile.default]
test-threads = "num-cpus"
retries = 0
failure-output = "immediate"
success-output = "never"
status-level = "pass"
slow-timeout = { period = "60s", terminate-after = 2 }
leak-timeout = "100ms"

[profile.default.junit]
path = "target/nextest/junit.xml"

[profile.ci]
retries = 1
test-threads = 4
slow-timeout = { period = "120s", terminate-after = 1 }
failure-output = "immediate-final"
success-output = "final"

[profile.ci.junit]
path = "target/nextest/ci-junit.xml"

# Test groups for controlled parallelism
[test-groups]
crypto-tests = { max-threads = 1 }
integration = { max-threads = 2 }
property-tests = { max-threads = 2 }

# Property tests (proptest) need more time
[[profile.default.overrides]]
filter = 'test(proptest) or test(property)'
test-group = 'property-tests'
slow-timeout = { period = "120s", terminate-after = 2 }

# Integration tests that use real network/filesystem
[[profile.default.overrides]]
filter = 'test(integration) or test(mtls) or test(security_gauntlet)'
test-group = 'integration'
slow-timeout = { period = "180s", terminate-after = 2 }

# Crypto/identity tests need isolation
[[profile.default.overrides]]
filter = 'package(nucleus-identity) and test(crypto)'
test-group = 'crypto-tests'

# A passing child_seccomp run can carry a weaker attribution: when this process already runs under a
# seccomp filter that denies the operation (a gate step under the trusted launcher, measured on the
# arm64 lane 2026-10-30), errno cannot say which filter denied the confined child, and the test
# reports `UNATTRIBUTED <op>` on stderr and attributes by filter count instead. `success-output =
# "never"` above would drop that line from the gate's log, so this binary's output is shown.
#
# Spelled `package(nucleus) and kind(test)`, not by binary: nextest refuses a `binary_id()` or
# `binary()` that names no test binary it knows of, and `test-libs` runs in a materialized pod whose
# scope excludes `crates/nucleus/*/*/**`, so `nucleus` has no test targets there and the whole config
# is refused ("no binary IDs matched this", exit 96, #3512 at 8134a7c50 on the arm64 lane
# 2026-10-30, reproduced in that pod's file set). `package()` and `kind()` parse there. The price is
# that `child_landlock` and `child_workspace` show their passing output too.
[[profile.default.overrides]]
filter = 'package(nucleus) and kind(test)'
success-output = "immediate"

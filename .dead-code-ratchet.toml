# `#[allow(dead_code)]` ratchet — the tolerated dead code, counted.
#
# Read by `cargo xtask law-mechanisms` (crates/xtask/src/law_mechanisms.rs),
# alongside scripts/law-mechanisms-manifest.txt. Same command because it is the
# same subject: the manifest names mechanisms that are dead ON PURPOSE and
# tracked; this counts the ones that are dead and merely TOLERATED.
#
# WHY IT EXISTS
#
# `#[allow(dead_code)]` is how dead code survives `-D warnings`, and nothing in
# the repo was counting it. The 2026-09-09 audit found ~14 machine-proved or
# law-bearing mechanisms with no production call site; the attribute is the
# mechanism by which the next one arrives quietly.
#
# THE RULES
#
#   * `total_ceiling` bounds the workspace.
#   * every crate with an allowance needs a `[[crates]]` entry. A crate with
#     none must STAY at none — otherwise debt moves between crates and the
#     total hides it. That is why per-crate entries exist and a global number
#     alone would not do; `debt_cannot_be_laundered_between_crates` pins it.
#   * a crate that reaches zero loses its entry, so the list shrinks visibly
#     rather than accumulating satisfied ceilings.
#
# Shrink-only. Raising a ceiling is a deliberate edit with a dated note here,
# the convention `.clippy-ratchet.toml` and scripts/north-star-ledger-ratchet.txt
# already use.
#
# SEEDED 2026-09-10, and the seeding is worth recording because it went wrong
# first. The instruction was to re-measure with the gate rather than trust the
# audit's hand-counted 130. The gate's first counter matched any line CONTAINING
# `#[allow(` and `dead_code`, which scored the attribute where it appears inside
# string literals — including this gate's own unit-test fixtures — and reported
# 135. The counter now requires the attribute to START the line, and agrees
# with the hand count at 130. Re-measuring was still right: it is what surfaced
# the false-positive class. The first number it produced simply was not.
#
# An earlier hand-measurement had also walked the filesystem and swept
# wt-2630/, an untracked worktree copy with a full crates/ tree, over-counting by
# 64%. The domain is `git ls-files`, always.
#
# Counts every tracked crates/**/*.rs, TESTS INCLUDED — an allowance in a test
# file is still an allowance, and exempting them would make the number look
# better by moving debt rather than paying it.

# RAISED 2026-09-11, 130 -> 132 and nucleus-node 41 -> 43, for the two
# allowances this branch adds. Both are the shape the file's own text asks for —
# a named gap rather than a hidden one — so they are listed here by site rather
# than absorbed into a round number:
#
#   * crates/nucleus-node/src/snapshot_vmm.rs — `load`, the restore half of the
#     snapshot pair. `create` is reached from POST /v1/pods/{id}/snapshot; this
#     is reached only from the round-trip test, because the launch path still
#     cold-boots and never asks the store for a base. Restore-instead-of-boot
#     needs a guest that reconnects its vsock after restore, which is a rootfs
#     release and a GUEST_RELEASE_FLOOR bump. The doc at the site says so.
#   * crates/nucleus-node/src/workload_api_vsock.rs — `material`, the host's own
#     record of what the bridge has served. It sits beside `pod_id` and
#     `socket_path`, which are already allowances here for the same reason.
#
# This is the "explain in the file why the ceiling rose" branch of the rule
# above, taken deliberately. The debt is two accessors-with-no-caller-yet, not
# two new mechanisms, and it comes down when the restore path acquires the
# caller both are waiting for.

total_ceiling = 132

[[crates]]
name = "nucleus-node"
ceiling = 43


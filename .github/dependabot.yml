version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "security-framework*"
    ignore:
      # wasmtime 46+ requires rustc 1.94.0, but our workspace MSRV floor is
      # pinned to Kani's toolchain (`cargo kani` has no --ignore-rust-version).
      # The latest Kani (0.67.0, nightly-2025-11-21) and even Kani `main`
      # (nightly-2025-12-03) are still ~rustc 1.93, so we cannot raise the
      # floor to 1.94 without breaking verification. Hold wasmtime at major 45
      # (the last 1.93-compatible line) until a Kani release supports 1.94+.
      # This recurred via #1919 and #1922; remove this entry once Kani ships a
      # >=1.94 toolchain and the workspace `rust-version` is bumped to match.
      - dependency-name: "wasmtime"
        update-types: ["version-update:semver-major"]
      # rmcp 2.0 is a breaking API change (removed the `Content` type used by
      # nucleus-tool-proxy / ctf-mcp / ctf-server); the migration is deliberate,
      # not a dependabot auto-bump. Hold at major 1 until migrated (tracked
      # separately). Recurred via #1940.
      - dependency-name: "rmcp"
        update-types: ["version-update:semver-major"]
      # sha2 is DELIBERATELY pinned to the 0.10 line in nucleus-policy-cert: the
      # cert layer compiles into the SP1 zkVM guest, whose sha2 acceleration
      # patch targets 0.10.8 — 0.11 panics the guest. Never auto-bump the major.
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major"]
      # c2pa 0.91 is a breaking release on a 0.x line, and three ways at once:
      # it requires rustc 1.96 (above the workspace floor of 1.95, which the
      # MSRV job enforces); it deprecates the data-hashed signing path
      # nucleus-envelope's c2pa_export uses (removed in 0.92); and its manifest
      # validation now refuses an export whose first action is not
      # `created`/`opened`. That is a deliberate migration, not a group bump.
      # Hold the 0.90 line until it lands, then delete this entry.
      - dependency-name: "c2pa"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "deps(rust)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"

name: Aeneas IFC (scoped extraction + noninterference)

# NO-OP TWIN of aeneas-ifc-scoped.yml, so its job can be a REQUIRED status
# check. Branch protection evaluates required contexts on the PR itself; the
# real workflow is path-filtered on pull_request, so a PR not touching its
# paths would never report the context and block forever. This twin has the
# SAME workflow name and SAME job name, with `paths-ignore` exactly mirroring
# the original's `paths`: exactly one of the twins reports the context on
# every PR. (merge_group is NOT twinned — the real workflow already runs
# unconditionally there.)

on:
  pull_request:
    paths-ignore:
      # EXACTLY the real workflow's `pull_request.paths`, no more and no less.
      # This list used to enumerate 24 specific files — a strict SUBSET of the
      # real twin's `crates/nucleus-ifc-kernel/**` + `crates/portcullis-core/lean/**`
      # — so a change to e.g. nucleus-ifc-kernel/src/lib.rs fired BOTH twins
      # under one context name. Twin lists are set-equal by construction now;
      # the invariant is checked by ci-spec (I1) once it lands.
      - "crates/nucleus-ifc-kernel/**"
      - "crates/portcullis-core/lean/**"
      - ".github/workflows/aeneas-ifc-scoped.yml"

concurrency:
  # Supersede a PR's older in-flight runs; NEVER cancel anything else.
  # cancel-in-progress is scoped to pull_request on purpose: cancelling a
  # merge_group run would abort a queue entry mid-flight, and cancelling a
  # push to main would drop the signal for a commit that already landed.
  group: aeneas-ifc-scoped-noop-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  aeneas-ifc-scoped:
    name: Scoped Aeneas (Rust → Lean 4) + parity tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No-op (paths not touched)
        run: echo "no relevant paths changed — gate vacuously green"

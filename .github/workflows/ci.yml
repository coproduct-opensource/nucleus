  clippy:
    name: Clippy
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    if: ${{ github.event.pull_request.draft != true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy
          target: wasm32-unknown-unknown
          cache: ${{ runner.environment == 'github-hosted' }}
      # Pinned prebuilt binary with a checksum, not `curl … init.sh | sh`: that
      # piped an unpinned remote script straight into a shell on every run, so
      # the bytes CI executed were whatever the installer held that day and
      # there was no point at which they could be checked. 0.13.1 is the version
      # docs.yml already pins. install-action is the same SHA-pinned action this
      # workflow uses for cargo-nextest.
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: wasm-pack@0.13.1
      - name: Build wasm SDK (vendored into verifier-service via include_bytes!)
        run: wasm-pack build sdks/verifier-js --target web --release
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # …and once WITHOUT them, crate-scoped (#2746).
      #
      # `--all-features` and `--workspace` both hide this class. Under
      # `--workspace`, feature unification means some other member turns on
      # portcullis's `cel`/`testing`, so code gated on them compiles and the
      # imports it needs are used. Alone, at its own defaults
      # (`serde`/`crypto`/`cedar`), those blocks vanish and their imports become
      # unused — four errors that CI could not see.
      #
      # It matters because crate-scoped is the command this repo asks people to
      # run: a contributor doing `cargo clippy -p portcullis --all-targets` got
      # four errors unrelated to their change, and learns to ignore clippy here.
      #
      # Scoped to portcullis rather than looped over every member: this is the
      # crate where feature-gated test blocks are dense enough for the class to
      # bite, and a per-crate loop would rebuild the world once per member.
      - name: cargo clippy (portcullis, default features)
        run: cargo clippy -p portcullis --all-targets -- -D warnings

  a2a-example:
    name: A2A example server (examples/a2a-server)
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    if: ${{ github.event.pull_request.draft != true }}
    # examples/a2a-server is its own workspace (root Cargo.toml `exclude`), so
    # the root-level fmt/clippy/test jobs never touch it. This job is NOT
    # path-filtered on purpose: the example path-depends on
    # crates/nucleus-{agent-card,verify-commerce,envelope,lineage}, so a change
    # anywhere in those crates can break the example's receipt pre-image and
    # version-negotiation invariants without touching examples/**.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      # Scope: on pull_request, the crates the diff touches closed under
      # reverse dependencies (scripts/affected-crates.sh); anything else, or a
      # workspace-wide change, is the full run. Outputs: full=true|false and
      # list=" a b c " (space-padded for contains()).
      - name: "Scope (pull_request: affected crates; otherwise full)"
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          full=true; list=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch -q origin "$BASE"
            rc=0; names=$(scripts/affected-crates.sh "origin/$BASE") || rc=$?
            if [ "$rc" = 0 ] && [ -n "$names" ]; then full=false; list=" $(printf '%s' "$names" | tr '\n' ' ') "; fi
            if [ "$rc" = 0 ] && [ -z "$names" ]; then full=false; fi
          fi
          { echo "full=$full"; echo "list=$list"; } >> "$GITHUB_OUTPUT"
          echo "scope: full=$full list=[$list]"
      # The example path-depends on nucleus-{agent-card,verify-commerce,
      # envelope,lineage}; run when one of those is affected (closed under
      # reverse dependencies) or the example itself changed. Measured 51
      # pool-minutes per 2 h unscoped.
      - name: Neither the example nor its path dependencies changed
        id: skip
        if: ${{ steps.affected.outputs.full != 'true' && !contains(steps.affected.outputs.list, ' nucleus-agent-card ') && !contains(steps.affected.outputs.list, ' nucleus-verify-commerce ') && !contains(steps.affected.outputs.list, ' nucleus-envelope ') && !contains(steps.affected.outputs.list, ' nucleus-lineage ') }}
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if git diff --name-only "origin/$BASE...HEAD" | grep -q '^examples/a2a-server/'; then
            echo "examples/a2a-server changed — running"; echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "A2A example not affected by this pull request"; echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        if: ${{ steps.skip.outcome == 'skipped' || steps.skip.outputs.run == 'true' }}
        with:
          components: rustfmt, clippy
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-workspaces: examples/a2a-server
      - name: cargo fmt + clippy + test (examples/a2a-server)
        if: ${{ steps.skip.outcome == 'skipped' || steps.skip.outputs.run == 'true' }}
        working-directory: examples/a2a-server
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features

  musl-check:
    name: musl type-check (nucleus-node, nucleus-tool-proxy)
    # The release pipeline builds static musl binaries, but every other job here
    # builds for the host target, so a musl-only breakage (a crate feature that
    # pulls a glibc-only dependency, a build script that needs a cross C
    # compiler) reached release.yml unseen. This job type-checks the two shipped
    # binaries against the musl target on every PR to close that gap.
    #
    # On the self-hosted arm64 pool the x86_64 musl C toolchain (`ring`'s build
    # script) comes from zig via cargo-zigbuild — both baked into the runner
    # image; hosted x86 runners keep musl-tools' x86_64-linux-musl-gcc.
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    if: ${{ github.event.pull_request.draft != true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      # Scope: on pull_request, the crates the diff touches closed under
      # reverse dependencies (scripts/affected-crates.sh); anything else, or a
      # workspace-wide change, is the full run. Outputs: full=true|false and
      # list=" a b c " (space-padded for contains()).
      - name: "Scope (pull_request: affected crates; otherwise full)"
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          full=true; list=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch -q origin "$BASE"
            rc=0; names=$(scripts/affected-crates.sh "origin/$BASE") || rc=$?
            if [ "$rc" = 0 ] && [ -n "$names" ]; then full=false; list=" $(printf '%s' "$names" | tr '\n' ' ') "; fi
            if [ "$rc" = 0 ] && [ -z "$names" ]; then full=false; fi
          fi
          { echo "full=$full"; echo "list=$list"; } >> "$GITHUB_OUTPUT"
          echo "scope: full=$full list=[$list]"
      # The two shipped binaries only need re-checking on the musl target when
      # something in their dependency closure changed (measured 52 pool-minutes
      # per 2 h unscoped). affected-crates is closed under reverse
      # dependencies, so a change deep in portcullis-core still runs this.
      - name: Nothing in nucleus-node / nucleus-tool-proxy's closure changed
        id: skip
        if: ${{ steps.affected.outputs.full != 'true' && !contains(steps.affected.outputs.list, ' nucleus-node ') && !contains(steps.affected.outputs.list, ' nucleus-tool-proxy ') }}
        run: echo "musl type-check not needed for this pull request"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        if: ${{ steps.skip.outcome == 'skipped' }}
        with:
          target: x86_64-unknown-linux-musl
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install musl-gcc (hosted x86 only)
        if: ${{ steps.skip.outcome == 'skipped' && runner.environment == 'github-hosted' }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Ensure musl target (cache-safe)
        if: ${{ steps.skip.outcome == 'skipped' }}
        # setup-rust-toolchain's `targets:` is skipped on a toolchain cache hit,
        # so the target can be absent despite being declared → E0463.
        run: rustup target add x86_64-unknown-linux-musl
      - name: cargo check (musl)
        if: ${{ steps.skip.outcome == 'skipped' }}
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            cargo check -p nucleus-node -p nucleus-tool-proxy --target x86_64-unknown-linux-musl
          else
            # zig as the C cross-compiler for the target's build scripts (ring);
            # a type-check never links, so cargo's own `check` is enough.
            zig version
            # cc-rs takes only the first word of CC as the program, so zig's
            # multi-word invocation needs wrapper scripts; and sccache cannot
            # front zig, so the wrapper is disabled for this step.
            mkdir -p "$HOME/.local/bin"
            # cc-rs also passes clang's --target=x86_64-unknown-linux-musl, which
            # zig rejects ("UnknownOperatingSystem"); the wrapper drops it and
            # supplies zig's own triple.
            cat > "$HOME/.local/bin/zig-cc-x86_64-musl" <<'W'
          #!/bin/bash
          args=(); for a in "$@"; do case "$a" in --target=*) ;; *) args+=("$a");; esac; done
          exec zig cc -target x86_64-linux-musl "${args[@]}"
          W
            printf '#!/bin/sh\nexec zig ar "$@"\n' > "$HOME/.local/bin/zig-ar"
            chmod 0755 "$HOME/.local/bin/zig-cc-x86_64-musl" "$HOME/.local/bin/zig-ar"
            RUSTC_WRAPPER= \
            CC_x86_64_unknown_linux_musl="$HOME/.local/bin/zig-cc-x86_64-musl" \
            AR_x86_64_unknown_linux_musl="$HOME/.local/bin/zig-ar" \
              cargo check -p nucleus-node -p nucleus-tool-proxy --target x86_64-unknown-linux-musl
          fi

  fuzz:
    name: Fuzz
    # Compile-class (builds every fuzz target from source): the build pool,
    # like Tests. On the 3 GiB gate pool it only ever passed with a warm
    # sccache; the first cold run on a fresh node (2026-09-06) was OOM-killed
    # at 10 min and the job hung as "in progress" with a dead runner.
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    needs: changed-crates
    if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: nightly
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: install cargo-fuzz
        # Pin version, but DROP --locked so cargo resolves a rustix newer
        # than the 0.36.5 cargo-fuzz bundles (0.36.5 uses rustc-internal
        # attributes that current nightly rejects). Every cargo-fuzz from
        # 0.11.x through 0.13.1 ships the same broken rustix pin in its
        # Cargo.lock, so bumping version alone is insufficient — we have
        # to let cargo do fresh resolution.
        run: cargo install cargo-fuzz --version 0.13.1
      - name: run fuzz targets
        run: |
          cd fuzz
          cargo fuzz run command_can_execute -- -max_total_time=30
          cargo fuzz run path_can_access -- -max_total_time=30
          cargo fuzz run permission_serde -- -max_total_time=30
          cargo fuzz run workload_api_command -- -max_total_time=30

  verify-strict:
    name: Ed25519 verify_strict gate (M-3)
    # GitHub-hosted on purpose: see `text-gates`. A relay on the pool costs a
    # slot and undoes the consolidation.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: text-gates

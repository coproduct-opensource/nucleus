          case "$STEP" in success|skipped) exit 0;; *) echo "::error::sandbox_trusted_base: $STEP (see 'Text gates (one pod)' → 'Every pin names a real test; the unpinned set may only shrink')"; exit 1;; esac

  failclosed-verifier-gate:

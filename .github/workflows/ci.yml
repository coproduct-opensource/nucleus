name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  changed-crates:
    name: Detect changed crates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      all: ${{ steps.detect.outputs.all }}
      crates: ${{ steps.detect.outputs.crates }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
      - name: Determine changed crates
        id: detect
        # Pass event/base data via env (never interpolate ${{ }} directly into
        # the run script — zizmor template-injection / code-injection
        # hardening, matching ck-admit.yml).
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          all=false
          changed=""

          if [ "$EVENT_NAME" = "merge_group" ] || [ "$EVENT_NAME" = "push" ]; then
            all=true
          else
            git fetch origin "$BASE" || true
            changed="$(git diff --name-only "origin/$BASE...HEAD")"
            if printf '%s\n' "$changed" | grep -qE '^Cargo\.toml$|^Cargo\.lock$|^\.github/'; then
              all=true
            fi
          fi

          crates=""
          if [ -n "$changed" ]; then
            crates="$(printf '%s\n' "$changed" | grep -oE '^crates/[^/]+' | sed 's#^crates/##' | sort -u | paste -sd' ' - || true)"
          fi

          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "crates=$crates" >> "$GITHUB_OUTPUT"

          {
            echo "### Changed-crate detection"
            echo ""
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Full run forced: \`$all\`"
            if [ -n "$crates" ]; then
              echo "- Changed crates: \`$crates\`"
            else
              echo "- Changed crates: (none)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt
          cache: true
      - name: cargo fmt
        run: cargo fmt --all -- --check

  verify-strict:
    name: Ed25519 verify_strict gate (M-3)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: Forbid non-strict dalek .verify(...) on trust paths
        run: scripts/check-verify-strict.sh

  sandbox-trusted-base-gate:
    name: Sandbox trusted-base gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: Every pin names a real test; the unpinned set may only shrink
        run: scripts/check-sandbox-trusted-base.sh

  failclosed-verifier-gate:
    name: Fail-closed verifier gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: Forbid a verifier that reports success where it cannot check
        run: scripts/check-failclosed-verifiers.sh

  mediation-gate:
    name: Mediation backstop gate (North Star)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: Forbid raw agent-path effect primitives outside the discharge-gated API
        run: scripts/check-mediation.sh

  # `discharge::test_helpers::bundle_for` mints a DischargedBundle with no
  # preflight. It is gated behind a `test-helpers` feature that only
  # [dev-dependencies] enable — and Cargo unifies features per build, so one line
  # moving to [dependencies] makes the proof mintable from production code with
  # every test still green, because tests already have the feature on.
  #
  # This needs cargo (it reads the resolved no-dev feature graph rather than
  # grepping manifests, which would miss transitive enabling), so it gets a
  # toolchain rather than riding along with the grep-only gates above.
  test-helpers-seal:
    name: test-helpers is not reachable from a shipping build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: true
      - name: The discharge seal is not reachable from any shipping build
        shell: bash
        run: scripts/check-test-helpers-not-in-production.sh

  # A `lean_lib` that no workflow builds is a theorem statement nothing
  # elaborates — it can be false, ill-typed, or carry a `sorry`, and
  # `#print axioms` cannot report it because the constant never comes into
  # existence. #2162 fixed the two such libraries that had been noticed; this
  # asks for the whole set instead of a list someone maintains by hand.
  #
  # Pure grep over lakefiles and workflows, so no toolchain and no Lean build.
  lean-lib-coverage:
    name: Every lean_lib is type-checked by something
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: No lean_lib is built by nothing
        shell: bash
        run: scripts/check-lean-libs-built.sh

  # The sink-scope restriction on declassification tokens is signed, proven and
  # documented — and NOT enforced (apply_token raises the node's label globally,
  # so a token scoped to one sink clears its node for every sink). Hardening it
  # is real surgery on the live IFC path, and it was deferred because the signed
  # -token path is DORMANT: every caller is test code, so the over-grant is
  # unreachable. This gate checks that premise, which is otherwise recorded only
  # in prose — the day a production caller lands, the deferral stops being safe
  # and CI must say so instead of the hole opening quietly.
  declassify-token-dormant:
    name: The unenforced declassify sink-scope stays unreachable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: No production caller mints or applies a declassification token
        shell: bash
        run: scripts/check-declassify-token-dormant.sh

  # Every gate above is a claim that something is checked. This checks the claim.
  #
  # It needs full history and a clean tree because it PERTURBS real files and
  # restores them, so it runs as its own job rather than sharing a checkout with
  # a job that might have written into the tree.
  gates-can-fail:
    name: Gates must fail on their own subject
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: Every gate REDs on a real violation and GREENs when restored
        shell: bash
        run: scripts/check-gates-can-fail.sh

  ingest-hash-gate:
    name: No-unwitnessed-ingest gate (InputsAuthorized)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: Forbid non-hashing agent-path ingest observes (content-address every input)
        run: scripts/check-ingest-hashed.sh

  sealed-home-gate:
    name: Sealed-home integrity gate (North Star)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: Forbid raw effect primitives outside the sealed RealEffects home
        run: scripts/check-sealed-home.sh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy
          targets: wasm32-unknown-unknown
          cache: true
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build wasm SDK (vendored into verifier-service via include_bytes!)
        run: wasm-pack build sdks/verifier-js --target web --release
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Doctests, split out of `test` because they were 82% of its wall clock.
  #
  # WHY THIS JOB IS REQUIRED, NOT OPTIONAL
  #
  # Splitting a slow check into its own job is one edit away from dropping it:
  # make it `continue-on-error`, or forget to add it to the required set, and the
  # documented examples stop being verified while the board stays green. This
  # repo has already produced that exact shape — two Lean proofs that appeared in
  # a workflow's `paths:` triggers and were compiled by no job at all (#2162).
  #
  # Doctests are the ONLY thing checking that the examples in this codebase's
  # documentation still compile, and the documentation is where most of its
  # reasoning lives. They must fail the build.
  doctests:
    name: Doctests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changed-crates
    if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          targets: wasm32-unknown-unknown
          cache: true
      # PREREQUISITE, not boilerplate. `nucleus-verifier-service` vendors the
      # wasm SDK with `include_str!`/`include_bytes!` on sdks/verifier-js/pkg/*,
      # which only `wasm-pack build` produces. Without these two steps the whole
      # workspace fails to compile and the doctest job REDs for a reason that has
      # nothing to do with doctests.
      #
      # CI found this: splitting a job means carrying its PREREQUISITES, not just
      # its command, and I moved the command alone.
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build wasm SDK (vendored into verifier-service via include_bytes!)
        run: wasm-pack build sdks/verifier-js --target web --release
      - name: cargo test --doc
        run: cargo test --all-features --doc

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changed-crates
    if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          targets: wasm32-unknown-unknown
          cache: true
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build wasm SDK (vendored into verifier-service via include_bytes!)
        run: wasm-pack build sdks/verifier-js --target web --release
      # `--lib --bins --tests` EXCLUDES doctests, which run in the `doctests` job
      # below. Measured on this workspace, warm cache:
      #
      #   --lib --bins --tests   152s
      #   --doc                  702s   <- 82% of the time
      #
      # Every doctest is a separate rustc invocation linking the whole crate
      # against 927 resolved packages, so ~113 doc code blocks cost ~8s each.
      # That is not pathological, it is what doctests cost at this size — but it
      # is not per-iteration work, and it was being paid on every run.
      #
      # SPLIT, NOT DROPPED. The doctests job below is required; see its comment
      # for why that distinction is load-bearing.
      - name: cargo test (lib, bins, tests — doctests run separately)
        run: cargo test --all-features --lib --bins --tests
      # Node tests run the WASM bindings against the cross-language golden seal
      # (settlement + commons) and the accept/reject smoke fixtures — per-PR, not
      # just on publish, so a binding-layer drift from the proven kernels is caught
      # here. Node is preinstalled on the ubuntu runner.
      - name: Node tests (golden seal + smoke) against built wasm
        working-directory: sdks/verifier-js
        run: npm test

  a2a-example:
    name: A2A example server (examples/a2a-server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # examples/a2a-server is its own workspace (root Cargo.toml `exclude`), so
    # the root-level fmt/clippy/test jobs never touch it. This job is NOT
    # path-filtered on purpose: the example path-depends on
    # crates/nucleus-{agent-card,verify-commerce,envelope,lineage}, so a change
    # anywhere in those crates can break the example's receipt pre-image and
    # version-negotiation invariants without touching examples/**.
    defaults:
      run:
        working-directory: examples/a2a-server
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy
          cache: true
          cache-workspaces: examples/a2a-server
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --all-features

  owasp-gauntlet:
    name: OWASP LLM Security Gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changed-crates
    if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: true
      - name: Run OWASP LLM Top 10 security tests
        run: cargo test -p portcullis --test owasp_llm_gauntlet --all-features

  policy-kernel-parity:
    name: Policy-kernel model↔Rust parity (K4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The model↔Rust contract, as a FIRST-CLASS named check. The K4 proof
    # `governance_monotone_iff` (proven axiom-clean in the Portcullis-Core Proven
    # Lean workflow) is a statement ABOUT the Lean model; it only transfers to the
    # shipped Rust `decide`/`governance_monotone`/`representative_requests` via the
    # `nucleus-policy-kernel` `tests/model_parity.rs` proptest, which pins the two
    # semantics declaration-for-declaration. That parity pin already runs
    # transitively under the whole-workspace `cargo test --all-features` above, but
    # this dedicated job selects the crate EXPLICITLY (`-p nucleus-policy-kernel`)
    # so the contract is a required-able status check that cannot be silently
    # dropped if the umbrella `test` job is ever path-filtered or refactored —
    # closing the enforcement loop the Lean-side gate already documents.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: true
      - name: cargo test -p nucleus-policy-kernel (parity pin)
        run: cargo test -p nucleus-policy-kernel

  musl-check:
    name: musl type-check (nucleus-node, nucleus-tool-proxy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The release pipeline builds static musl binaries, but every other job here
    # compiles against glibc — so glibc-only code (v2.0.1: __rlimit_resource_t in
    # hardening.rs) sails through PR CI and only explodes at release time. This
    # job type-checks the two shipped binaries against the musl target on every
    # PR to close that gap. musl-tools provides musl-gcc, which C-dependency
    # build scripts (e.g. ring) need to cross-compile.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          targets: x86_64-unknown-linux-musl
          cache: true
      - name: Install musl-gcc
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Ensure musl target (cache-safe)
        # setup-rust-toolchain's `targets:` is skipped on a toolchain cache hit,
        # so the target can be absent despite being declared → E0463. This
        # explicit add always runs and is a no-op when already present.
        run: rustup target add x86_64-unknown-linux-musl
      - name: cargo check (musl)
        run: cargo check -p nucleus-node -p nucleus-tool-proxy --target x86_64-unknown-linux-musl

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changed-crates
    if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: nightly
          cache: true
      - name: install cargo-fuzz
        # Pin version, but DROP --locked so cargo resolves a rustix newer
        # than the 0.36.5 cargo-fuzz bundles (0.36.5 uses rustc-internal
        # attributes that current nightly rejects). Every cargo-fuzz from
        # 0.11.x through 0.13.1 ships the same broken rustix pin in its
        # Cargo.lock, so bumping version alone is insufficient — we have
        # to let cargo do fresh resolution.
        run: cargo install cargo-fuzz --version 0.13.1
      - name: run fuzz targets
        run: |
          cd fuzz
          cargo fuzz run command_can_execute -- -max_total_time=30
          cargo fuzz run path_can_access -- -max_total_time=30
          cargo fuzz run permission_serde -- -max_total_time=30
          cargo fuzz run workload_api_command -- -max_total_time=30

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    # ready_for_review is NOT in the default set. The heavy jobs below skip
    # drafts, so a draft marked ready must trigger a run or it never gets checks.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  # Supersede a PR's older in-flight runs; NEVER cancel anything else.
  # cancel-in-progress is scoped to pull_request on purpose: cancelling a
  # merge_group run would abort a queue entry mid-flight, and cancelling a
  # push to main would drop the signal for a commit that already landed.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changed-crates:
    name: Detect changed crates
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      all: ${{ steps.detect.outputs.all }}
      crates: ${{ steps.detect.outputs.crates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Determine changed crates
        id: detect
        # Pass event/base data via env (never interpolate ${{ }} directly into
        # the run script — zizmor template-injection / code-injection
        # hardening, matching ck-admit.yml).
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          all=false
          changed=""

          if [ "$EVENT_NAME" = "merge_group" ] || [ "$EVENT_NAME" = "push" ]; then
            all=true
          else
            # A failed fetch used to be swallowed (`|| true`); the diff below
            # then failed, which failed THIS job, which reported Tests, Fuzz,
            # OWASP and Doctests as SKIPPED — and GitHub counts a skipped
            # required check as passed. Let the fetch fail loudly. This job is
            # being added to the required set so a red here blocks instead of
            # vacating.
            git fetch origin "$BASE"
            changed="$(git diff --name-only "origin/$BASE...HEAD")"
            if printf '%s\n' "$changed" | grep -qE '^Cargo\.toml$|^Cargo\.lock$|^\.github/'; then
              all=true
            fi
          fi

          crates=""
          if [ -n "$changed" ]; then
            crates="$(printf '%s\n' "$changed" | grep -oE '^crates/[^/]+' | sed 's#^crates/##' | sort -u | paste -sd' ' - || true)"
          fi

          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "crates=$crates" >> "$GITHUB_OUTPUT"

          {
            echo "### Changed-crate detection"
            echo ""
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Full run forced: \`$all\`"
            if [ -n "$crates" ]; then
              echo "- Changed crates: \`$crates\`"
            else
              echo "- Changed crates: (none)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The macOS build was exercised ONCE PER RELEASE and nowhere else:
  # release.yml was the only workflow with a `macos-` runner. Both Darwin jobs
  # in v2.2.0 failed on seven `dead_code` errors that had been there for
  # months — the Firecracker spawn path is `cfg(target_os = "linux")`, so items
  # it reaches are genuinely dead elsewhere, and setup-rust-toolchain sets
  # `RUSTFLAGS=-D warnings` by default, which promotes them.
  #
  # Building the same crates release.yml publishes, on the same OS, means a
  # macOS-only regression fails a PR instead of a release. One job: the point is
  # coverage, not a matrix.
  darwin-build:
    name: Build (macOS, release crates)
    # CI_MACOS_RUNNER names the self-hosted macOS runner registered on the
    # owner's Apple-silicon machine (k8s/ci-runner/README.md); unset, hosted.
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'macos-14' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: ${{ runner.environment == 'github-hosted' }}
      # Deliberately NOT overriding rustflags: the default `-D warnings` is the
      # condition that fails the release, so the gate must run under it too.
      - name: Build the crates release.yml publishes
        run: cargo build -p nucleus-node -p nucleus-cli -p nucleus-mcp -p nucleus-audit

  fmt:
    name: Rustfmt
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: cargo fmt
        run: cargo fmt --all -- --check

  # ── The grep-only gates, ONCE per pod ─────────────────────────────────────
  #
  # Eleven jobs that each took a pod to run ONE `scripts/check-*.sh` over the
  # checked-out tree. Measured on #2848, across its pull_request and
  # merge_group runs: 2,297 seconds of slot wait for 178 seconds of work.
  # Thirteen times more waiting than working, to run eleven greps.
  #
  # WHY THE RELAYS RUN ON GITHUB-HOSTED, WHICH IS THE WHOLE TRICK
  #
  # There is no build to share here. That makes this different from the
  # live-path and workspace consolidations, where the saving was one cargo
  # build instead of three — and it means the relay jobs decide whether this
  # change is worth anything at all. A relay does nothing but read a step
  # outcome, but if it asks for `vars.CI_RUNNER` it takes a pool slot exactly
  # like the job it replaced, and eleven of those give back everything this
  # job saves. On hosted runners they cost the pool nothing.
  #
  # (The four live-path relays below moved for the same reason. They were on
  # the pool, which is why #2635's consolidation won on build time and lost on
  # slot acquisitions.)
  #
  # WHAT MAY RIDE ALONG
  #
  # Read-only text gates only. Every script here was checked: none writes to
  # the tree. A gate that PERTURBS files cannot share a pod with gates that
  # read them — that is why `check-gates-can-fail.sh` runs last inside
  # `live-path-gates` and not here.
  #
  # Each step is `continue-on-error`, so the job is green even when a gate
  # reds; the relays below turn each outcome back into its own required
  # context. No context name changes, so `ci/required-checks.txt` and branch
  # protection are untouched.
  text-gates:
    name: Text gates (one pod)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      verify_strict: ${{ steps.verify_strict.outcome }}
      sandbox_trusted_base: ${{ steps.sandbox_trusted_base.outcome }}
      failclosed: ${{ steps.failclosed.outcome }}
      mediation: ${{ steps.mediation.outcome }}
      north_star: ${{ steps.north_star.outcome }}
      extracted_callsites: ${{ steps.extracted_callsites.outcome }}
      task_compiler: ${{ steps.task_compiler.outcome }}
      ingest_hash: ${{ steps.ingest_hash.outcome }}
      kani_divergence: ${{ steps.kani_divergence.outcome }}
      sealed_home: ${{ steps.sealed_home.outcome }}
      governor_keys: ${{ steps.governor_keys.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Forbid non-strict dalek .verify(...) on trust paths
        id: verify_strict
        continue-on-error: true
        run: scripts/check-verify-strict.sh
      - name: Every pin names a real test; the unpinned set may only shrink
        id: sandbox_trusted_base
        continue-on-error: true
        run: scripts/check-sandbox-trusted-base.sh
      - name: Forbid a verifier that reports success where it cannot check
        id: failclosed
        continue-on-error: true
        run: scripts/check-failclosed-verifiers.sh
      - name: Forbid raw agent-path effect primitives outside the discharge-gated API
        id: mediation
        continue-on-error: true
        run: scripts/check-mediation.sh
      - name: Every status row is earned, evidenced, and uncontradicted
        id: north_star
        continue-on-error: true
        run: scripts/check-north-star-ledger.sh
      - name: Every extracted predicate's enforcement is still wired
        id: extracted_callsites
        continue-on-error: true
        run: scripts/check-extracted-callsites.sh
      - name: No network crate in its dependency tables, no socket type in its sources
        id: task_compiler
        continue-on-error: true
        run: scripts/check-task-compiler-offline.sh
      - name: Forbid non-hashing agent-path ingest observes (content-address every input)
        id: ingest_hash
        continue-on-error: true
        run: scripts/check-ingest-hashed.sh
      - name: Every cfg(kani) site is listed and justified; the total only shrinks
        id: kani_divergence
        continue-on-error: true
        env:
          # The script fetches this ref itself (checkout is depth 1).
          KANI_DIVERGENCE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          # Owner override for a deliberate new divergence: the PR label.
          KANI_DIVERGENCE_ALLOW_GROWTH: ${{ contains(github.event.pull_request.labels.*.name, 'kani-divergence-growth') && '1' || '0' }}
        run: scripts/check-kani-divergence.sh
      - name: Forbid raw effect primitives outside the sealed RealEffects home
        id: sealed_home
        continue-on-error: true
        run: scripts/check-sealed-home.sh
      - name: set_trusted_keys has no caller outside kernel construction
        id: governor_keys
        continue-on-error: true
        run: scripts/check-declassify-governor-keys-sealed.sh
      - name: Outcomes
        if: always()
        run: |
          echo "- verify_strict: ${{ steps.verify_strict.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- sandbox_trusted_base: ${{ steps.sandbox_trusted_base.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- failclosed: ${{ steps.failclosed.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- mediation: ${{ steps.mediation.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- north_star: ${{ steps.north_star.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- extracted_callsites: ${{ steps.extracted_callsites.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- task_compiler: ${{ steps.task_compiler.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ingest_hash: ${{ steps.ingest_hash.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- kani_divergence: ${{ steps.kani_divergence.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- sealed_home: ${{ steps.sealed_home.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- governor_keys: ${{ steps.governor_keys.outcome }}" >> "$GITHUB_STEP_SUMMARY"

  test-helpers-seal:
    name: test-helpers is not reachable from a shipping build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: The discharge seal is not reachable from any shipping build
        shell: bash
        run: scripts/check-test-helpers-not-in-production.sh

  # A `lean_lib` that no workflow builds is a theorem statement nothing
  # elaborates — it can be false, ill-typed, or carry a `sorry`, and
  # `#print axioms` cannot report it because the constant never comes into
  # existence. #2162 fixed the two such libraries that had been noticed; this
  # asks for the whole set instead of a list someone maintains by hand.
  #
  # Pure grep over lakefiles and workflows, so no toolchain and no Lean build.
  lean-lib-coverage:
    name: Every lean_lib is type-checked by something
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No lean_lib is built by nothing
        shell: bash
        run: scripts/check-lean-libs-built.sh

  declassify-value-bound:
    name: Declassification is value-bound, single-use, and live
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: A token releases only the committed value, once, on the live graph
        shell: bash
        run: scripts/check-declassify-value-bound.sh

  ci-spec:
    name: CI configuration is sound (CI-1)
    # The GATE pool, not the build pool. This job's verdict is a function of workflow
    # YAML, ci/required-checks.txt and ci/merge-queue.toml -- `crates/ci-spec/src/lib.rs`
    # says it outright: "It reads YAML; it does not run anything." What it spends is a
    # cargo build of xtask, and that build was MEASURED at 449 MB of target directory
    # against roughly 6 GB of headroom on the gate pool's 8 GB rootfs after the ~1.78 GB
    # image -- an order of magnitude of margin, so `requires_volume`'s ENOSPC failure mode
    # (`ld terminated with signal 7`, then four ejected required checks) is not in reach.
    #
    # What it buys: the build pool is eight volume-pinned machines, the only part of the
    # fleet that costs money while idle and the only one that strands on a 412 when a zone
    # fills. Holding one of those eight for ~65 seconds to decide a YAML question is the
    # scarce resource paying for the cheap one. The gate pool floats to any zone with room.
    #
    # The trade, stated because it is real: shared-cpu-8x is slower than performance-8x, so
    # the ~65 s may grow. Compare `cargo xtask ci-timings` for this label before and after.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Every merge-queue invariant holds over the workflow model
        shell: bash
        run: scripts/check-ci-spec.sh

  # The CI assurance ledger (docs/assurance/ci-assurance.md): every claim ADR
  # 0002 makes about the pipeline names a clause of its sentence verbatim, a
  # status from a closed vocabulary, evidence that dereferences, and the gate
  # that catches regression; the population is pinned both ways. Pure grep.
  ci-assurance-ledger:
    name: The CI assurance ledger cannot outrun its wiring
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every row is verbatim, dereferenced, wired, and pinned
        shell: bash
        run: scripts/check-ci-assurance-ledger.sh
      # The second half of "a gate CI does not run enforces nothing": a gate CI RUNS,
      # that goes red, and that the merge queue merges past anyway also enforces nothing.
      # The queue gates on ci/required-checks.txt and nothing else, and six of the eight
      # non-NOT-YET claims have a falsifier outside it -- including two PROVED rows.
      # Ratcheted rather than driven to zero: whether a given check should be required is a
      # judgement about cost, and this only makes the gap visible and un-growable.
      - name: A claim's falsifier produces a required context
        shell: bash
        run: cargo run -q -p xtask -- assurance-required

  workspace-tests:
    name: Workspace build + tests (one pod)
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    needs: changed-crates
    if: ${{ (needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '') && github.event.pull_request.draft != true }}
    outputs:
      tests: ${{ steps.tests.outcome }}
      sdk: ${{ steps.sdk.outcome }}
      doctests: ${{ steps.doctests.outcome }}
      owasp: ${{ steps.owasp.outcome }}
      k4: ${{ steps.k4.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: wasm32-unknown-unknown
          cache: ${{ runner.environment == 'github-hosted' }}
      # PREREQUISITE, not boilerplate. `nucleus-verifier-service` vendors the
      # wasm SDK with `include_str!`/`include_bytes!` on sdks/verifier-js/pkg/*,
      # which only `wasm-pack build` produces. Without it the workspace does not
      # compile and every step below reds for a reason that is not its own.
      # Pinned prebuilt binary with a checksum, not `curl … init.sh | sh`: that
      # piped an unpinned remote script straight into a shell on every run, so
      # the bytes CI executed were whatever the installer held that day and
      # there was no point at which they could be checked. 0.13.1 is the version
      # docs.yml already pins. install-action is the same SHA-pinned action this
      # workflow uses for cargo-nextest.
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: wasm-pack@0.13.1
      - name: Build wasm SDK (vendored into verifier-service via include_bytes!)
        run: wasm-pack build sdks/verifier-js --target web --release
      - name: "Scope the run (pull_request: affected crates; otherwise the workspace)"
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          full=true; pk=""; list=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch -q origin "$BASE"
            rc=0; names=$(scripts/affected-crates.sh "origin/$BASE") || rc=$?
            if [ "$rc" = 0 ] && [ -n "$names" ]; then
              full=false
              pk=$(printf '%s\n' "$names" | sed 's/^/-p /' | tr '\n' ' ')
              list=" $(printf '%s' "$names" | tr '\n' ' ') "
            fi
          fi
          # sdks/verifier-py is its own workspace; it is affected when one of its
          # path dependencies is.
          py=$full
          if [ "$full" = false ]; then
            while read -r d; do
              case "$list" in *" $d "*) py=true ;; esac
            done < <(grep -oE 'path *= *"[^"]*crates/[^"/]+' sdks/verifier-py/Cargo.toml | sed 's#.*/##' | sort -u)
          fi
          { echo "full=$full"; echo "pk=$pk"; echo "list=$list"; echo "py=$py"; } >> "$GITHUB_OUTPUT"
          {
            echo "### Scope"
            echo ""
            if [ "$full" = true ]; then echo "- whole workspace (\`$EVENT_NAME\`)"; else echo "- affected crates:\`$list\`"; fi
            echo "- python SDK: \`$py\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # `--lib --bins --tests` EXCLUDES doctests (measured 82% of the wall clock
      # at this size: every doc block links the whole crate); they are the next
      # step so a doctest red is legible on its own context.
      # nextest: one process per test with cross-binary scheduling, 2–3× the
      # wall clock of `cargo test` on a workspace this size (nexte.st
      # benchmarks); baked into the self-hosted image, installed on hosted.
      # Doctests are not nextest's — they stay on `cargo test --doc` below.
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          tool: cargo-nextest
      - name: cargo nextest run (lib, bins, tests)
        id: tests
        continue-on-error: true
        env:
          PK: ${{ steps.affected.outputs.pk }}
        run: |
          read -ra PK_ARR <<< "$PK"
          # No target filters: nextest already runs every test binary (lib, bins, tests),
          # and `--lib` makes cargo refuse a scoped run that names only a bin-only crate
          # ("no library targets found in package `xtask`" failed Tests on #2655).
          cargo nextest run --all-features --no-fail-fast "${PK_ARR[@]}"
      # Node tests run the WASM bindings against the cross-language golden seal
      # and the accept/reject smoke fixtures; the Python SDK is its own
      # workspace (the root cargo test never reaches it) and runs the shared
      # conformance corpus through its bindings. Both report under `Tests`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: SDK tests (node golden seal + smoke; python conformance + clippy)
        id: sdk
        continue-on-error: true
        env:
          PY: ${{ steps.affected.outputs.py }}
        run: |
          set -euo pipefail
          (cd sdks/verifier-js && npm test)
          if [ "$PY" = true ]; then
            (cd sdks/verifier-py && cargo test && cargo clippy --all-targets -- -D warnings)
          else
            echo "python SDK: none of its path dependencies changed — skipped on this pull request"
          fi
      - name: cargo test --doc
        id: doctests
        continue-on-error: true
        env:
          PK: ${{ steps.affected.outputs.pk }}
        run: |
          read -ra PK_ARR <<< "$PK"
          # `cargo test --doc` refuses a package without a library target, and a scoped run
          # may name only bin-only crates (xtask). Keep the affected packages that have one;
          # when none does there are no doctests to run and that is a pass, not a skip.
          if [ "${#PK_ARR[@]}" -eq 0 ]; then
            cargo test --all-features --doc
          else
            libs="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(any(.targets[]; any(.kind[]; test("^(lib|rlib|dylib|proc-macro)$")))) | .name')"
            doc=()
            for ((i = 1; i < ${#PK_ARR[@]}; i += 2)); do
              if printf '%s\n' "$libs" | grep -qx -- "${PK_ARR[i]}"; then doc+=(-p "${PK_ARR[i]}"); fi
            done
            if [ "${#doc[@]}" -eq 0 ]; then
              echo "no affected crate has a library target; no doctests to run"
            else
              cargo test --all-features --doc "${doc[@]}"
            fi
          fi
      - name: OWASP LLM Top 10 gauntlet (portcullis)
        id: owasp
        if: ${{ steps.affected.outputs.full == 'true' || contains(steps.affected.outputs.list, ' portcullis ') }}
        continue-on-error: true
        run: cargo test -p portcullis --test owasp_llm_gauntlet --all-features
      # The model↔Rust contract as a first-class named check: K4
      # `governance_monotone_iff` is a statement ABOUT the Lean model and only
      # transfers to the shipped Rust via nucleus-policy-kernel's
      # tests/model_parity.rs proptest. Selected explicitly so the pin cannot be
      # silently dropped by scoping.
      - name: Policy-kernel model↔Rust parity pin (nucleus-policy-kernel)
        id: k4
        if: ${{ steps.affected.outputs.full == 'true' || contains(steps.affected.outputs.list, ' nucleus-policy-kernel ') }}
        continue-on-error: true
        run: cargo test -p nucleus-policy-kernel
      - name: Outcomes
        if: always()
        env:
          T: ${{ steps.tests.outcome }}
          S: ${{ steps.sdk.outcome }}
          D: ${{ steps.doctests.outcome }}
          O: ${{ steps.owasp.outcome }}
          K: ${{ steps.k4.outcome }}
        run: |
          echo "tests=$T sdk=$S doctests=$D owasp=$O k4=$K"
          echo "- tests: $T · sdk: $S · doctests: $D · owasp: $O · k4: $K" >> "$GITHUB_STEP_SUMMARY"

  # ── The live-path gates, ONCE per pod ─────────────────────────────────────
  #
  # Three more jobs that each built portcullis / nucleus-node on their own pod:
  # the declassify sink-scope conformance, the C2 lineage boot, and the gate of
  # gates (which perturbs and restores real files, so it runs LAST, on a tree
  # nothing else in this job has written to — cargo's outputs are gitignored).
  live-path-gates:
    name: Live-path gates (one pod)
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    if: ${{ github.event.pull_request.draft != true }}
    outputs:
      declassify: ${{ steps.declassify.outcome }}
      lineage: ${{ steps.lineage.outcome }}
      c1: ${{ steps.c1.outcome }}
      gates: ${{ steps.gates.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: A token clears its node for its signed sinks and only those
        id: declassify
        continue-on-error: true
        shell: bash
        run: scripts/check-declassify-sink-scope-enforced.sh
      # C2 — the node records pod lineage on the LIVE path: boots the real
      # nucleus-node with the KVM-free local-driver, creates two sibling pods and
      # a child through the real signed POST /v1/pods, and asserts the listing
      # serves the recorded parent_pod_id and that a pod's own scoped listing
      # excludes a non-lineage sibling.
      - name: The create API records lineage the listing serves; scoped listing excludes a sibling (C2)
        id: lineage
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo build -p nucleus-node --features local-driver -p nucleus-cli -p nucleus-tool-proxy
          export NUCLEUS_NODE_BIN=target/debug/nucleus-node
          export NUCLEUS_CLI_BIN=target/debug/nucleus
          export NUCLEUS_TOOL_PROXY_BIN=target/debug/nucleus-tool-proxy
          scripts/cross-pod-lineage-check.sh
          scripts/cross-pod-scoped-check.sh
      # C1 ("cannot learn the secrets Nucleus holds on its behalf") is proven
      # over the seven inbound channels in Lean, but the RUNTIME must withhold
      # for that to hold on the live path: the workload always runs as a
      # distinct unprivileged uid, any unclassified NUCLEUS_* key is refused at
      # admission, no per-pod secret rides the guest cmdline. Runs cargo tests
      # in tool-proxy, node and the IFC kernel — compile-class, so it lives on
      # this pod (it was 10 gate-pool minutes per PR on a 2-CPU runner).
      - name: uid distinctness, reserved-namespace, and cmdline fences hold (C1)
        id: c1
        continue-on-error: true
        shell: bash
        run: scripts/check-c1-inbound-fences.sh
      # Every gate is a claim that something is checked. This checks the claim:
      # each check-*.sh must RED on a real violation of its own subject and
      # GREEN when restored. Needs a clean tree (it perturbs and restores).
      - name: Every gate REDs on a real violation and GREENs when restored
        id: gates
        continue-on-error: true
        shell: bash
        # The script itself refuses a dirty tree (its first check), so the step is the gate
        # and nothing else: the CI-spec model reads an inline `exit 1` under
        # continue-on-error as a decision that changes no outcome (GI004).
        run: scripts/check-gates-can-fail.sh
      - name: Outcomes
        if: always()
        env:
          D: ${{ steps.declassify.outcome }}
          L: ${{ steps.lineage.outcome }}
          C: ${{ steps.c1.outcome }}
          G: ${{ steps.gates.outcome }}
        run: echo "declassify=$D lineage=$L c1=$C gates=$G"

  # ── Status contexts (branch protection names these; keep the names) ──────
  #
  # Each reports ONE step of the consolidated jobs above. A step that was
  # skipped by scoping passes (nothing it covers changed on this PR); a job
  # that was skipped as a whole passes (docs-only PR / draft — same as before);
  # a job that failed before reaching its steps fails EVERY context it carries.
  test:
    name: Tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    needs: workspace-tests
    if: always()
    steps:
      - name: Report
        env:
          JOB: ${{ needs.workspace-tests.result }}
          STEP: ${{ needs.workspace-tests.outputs.tests }}
          STEP2: ${{ needs.workspace-tests.outputs.sdk }}
        run: |
          case "$JOB" in skipped) exit 0;; success) ;; *) echo "::error::workspace-tests job: $JOB"; exit 1;; esac
          case "$STEP:$STEP2" in success:success|success:skipped|skipped:success|skipped:skipped) exit 0;; *) echo "::error::cargo test: $STEP, SDK tests: $STEP2 (see 'Workspace build + tests')"; exit 1;; esac


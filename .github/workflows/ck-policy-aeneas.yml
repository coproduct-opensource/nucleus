name: CK Policy Aeneas (extracted-core soundness)

# Tier-1 DEDUCTIVE bridge for the Constitutional Kernel monotonicity gate.
#
# This workflow (1) REGENERATES the Charon+Aeneas Lean translation of the
# self-contained core in crates/ck-policy/src/extracted.rs and fails on DRIFT vs
# the committed generated/ files; (2) `lake build`s the soundness proofs in
# crates/ck-policy/lean-aeneas/CkPolicyAeneas.lean; (3) bans
# sorry/admit/native_decide in OUR proof file and asserts (via `#print axioms`)
# that no soundness theorem depends on `sorryAx`.
#
# Mathlib posture (HONEST): the Aeneas Lean *standard library* transitively
# requires Mathlib at the pinned commit, so importing the GENERATED Funs.lean
# pulls Mathlib (unavoidable; identical to .github/workflows/aeneas.yml /
# portcullis-core). We therefore DO fetch the prebuilt Mathlib olean cache
# (`lake exe cache get`) — that caches an unavoidable transitive dependency, it
# does NOT make this an "uses Mathlib" proof. Our proof file itself uses only
# structural reasoning + Aeneas Std bind lemmas (no Mathlib lemmas, no
# native_decide). The sorry-ban + #print-axioms gates are scoped to OUR files,
# not the Aeneas stdlib (which carries its own internal `sorry`s, irrelevant
# because the axiom audit proves they are not in our theorems' dependency graph).

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/check-lean-external-state.py"
      - "scripts/lean-axiom-audit.sh"
      - "crates/ck-policy/lean-aeneas/**"
      - "crates/ck-policy/src/extracted.rs"
      - "crates/ck-policy/tests/policy_aeneas_parity.rs"
      - ".github/workflows/ck-policy-aeneas.yml"
      - "crates/ck-policy/src/lib.rs"
      - "crates/ck-types/**"
  pull_request:
    paths:
      - "scripts/check-lean-external-state.py"
      - "scripts/lean-axiom-audit.sh"
      - "crates/ck-policy/lean-aeneas/**"
      - "crates/ck-policy/src/extracted.rs"
      - "crates/ck-policy/tests/policy_aeneas_parity.rs"
      - ".github/workflows/ck-policy-aeneas.yml"
      - "crates/ck-policy/src/lib.rs"
      - "crates/ck-types/**"
  merge_group:
  # Weekly canary to catch Charon/Aeneas/Mathlib drift.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  # Supersede a PR's older in-flight runs; NEVER cancel anything else.
  # cancel-in-progress is scoped to pull_request on purpose: cancelling a
  # merge_group run would abort a queue entry mid-flight, and cancelling a
  # push to main would drop the signal for a commit that already landed.
  group: ck-policy-aeneas-real-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pin to the Aeneas release that generated the committed Lean code.
  # Update with the generated/ files when regenerating.
  AENEAS_RELEASE: nightly-2026.06.10
  # Charon (bundled in that release) needs this rustc nightly (from the tarball's
  # rust-toolchain file; components rustc-dev,llvm-tools-preview,rust-src).
  CHARON_NIGHTLY: nightly-2026-06-01
  # Scope Charon to the extracted core root (whole-dep-graph walk chokes).
  EXTRACT_ROOT: "ck_policy::extracted::passed_core"

jobs:
  ck-policy-aeneas:
    name: charon+aeneas drift + lake build (extracted-core soundness)
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      # `paths:` under `merge_group:` parses and is then IGNORED by GitHub, so
      # the scoping declared above holds on pull_request and is silently dropped
      # in the merge queue -- where speculative batches multiply it by the queue
      # depth. This restores the declared intent for merge_group only; the
      # PATTERN is DERIVED from the paths above and ci/merge-group-scope-parity.sh
      # fails if they ever disagree.
      - name: Is this change in scope?
        id: scope
        env:
          # Never interpolate ${{ }} into a run script (zizmor hardening).
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
          PATTERN: '^\.github/workflows/ck\-policy\-aeneas\.yml$|^crates/ck\-policy/lean\-aeneas/|^crates/ck\-policy/src/extracted\.rs$|^crates/ck\-policy/src/lib\.rs$|^crates/ck\-policy/tests/policy_aeneas_parity\.rs$|^crates/ck\-types/|^scripts/(check-lean-external-state\.py|lean-axiom-audit\.sh)$'
        run: |
          set -euo pipefail
          if [ "$EVENT" != "merge_group" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ]; then
            # Fail OPEN: an unknown range must run, never skip.
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE "$PATTERN"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; echo "in scope -- running."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "nothing in this merge group matches; skipping the expensive"
            echo "steps. The job still reports, so it stays required-check safe."
          fi


      # --- Rust nightly for Charon MIR extraction ---
      - name: Install Rust nightly for Charon
        if: steps.scope.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.CHARON_NIGHTLY }}
          components: rustc-dev,llvm-tools-preview,rust-src

      - name: Rust / cargo cache (Charon target dir)
        if: ${{ runner.environment == 'github-hosted' && (steps.scope.outputs.relevant == 'true') }}
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.9.1
        with:
          workspaces: crates/ck-policy
          key: charon-${{ env.CHARON_NIGHTLY }}-${{ env.AENEAS_RELEASE }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache Aeneas binary
        if: runner.environment == 'github-hosted' && (steps.scope.outputs.relevant == 'true')
        id: cache-aeneas-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: /tmp/aeneas-bin
          key: aeneas-bin-${{ runner.os }}-${{ runner.arch }}-${{ env.AENEAS_RELEASE }}

      - name: Download Aeneas pre-built binaries
        if: steps.scope.outputs.relevant == 'true' && (steps.cache-aeneas-bin.outputs.cache-hit != 'true') && runner.environment == 'github-hosted'
        run: |
          gh release download "$AENEAS_RELEASE" \
            --repo AeneasVerif/aeneas \
            --pattern "aeneas-linux-$(uname -m).tar.gz" \
            --dir /tmp
          mkdir -p /tmp/aeneas-bin
          tar xzf /tmp/aeneas-linux-"$(uname -m)".tar.gz -C /tmp/aeneas-bin
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Add Aeneas to PATH
        if: steps.scope.outputs.relevant == 'true'
        # Self-hosted: use the baked copy when the image has one, and otherwise
        # install to the machine's persistent volume.
        run: |
          set -euo pipefail
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            echo "/tmp/aeneas-bin" >> "$GITHUB_PATH"
          elif [ -x /opt/aeneas/aeneas ]; then
            echo "/opt/aeneas" >> "$GITHUB_PATH"
          else
            # Not baked, and on the Fly pool it cannot be: Charon + Aeneas do not
            # fit under Fly's 8 GB uncompressed rootfs cap, which is why the
            # image that tried took the pool down (#2719, #2721). The machine's
            # 40 GB volume has room, so this downloads once per MACHINE rather
            # than once per job, and falls back to scratch where there is no
            # volume so the lane never depends on one existing.
            dir="${AENEAS_CACHE:-/data/cache/aeneas}/$AENEAS_RELEASE"
            mkdir -p "$dir" 2>/dev/null || dir="${RUNNER_TEMP:-/tmp}/aeneas/$AENEAS_RELEASE"
            mkdir -p "$dir"
            if [ ! -x "$dir/aeneas" ]; then
              tmp="$(mktemp -d)"
              gh release download "$AENEAS_RELEASE" \
                --repo AeneasVerif/aeneas \
                --pattern "aeneas-linux-$(uname -m).tar.gz" \
                --dir "$tmp"
              tar xzf "$tmp/aeneas-linux-$(uname -m).tar.gz" -C "$dir"
              rm -rf "$tmp"
            fi
            echo "$dir" >> "$GITHUB_PATH"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify tools
        if: steps.scope.outputs.relevant == 'true'
        run: |
          which charon && charon version
          which aeneas && aeneas -version

      # --- Regenerate the Lean translation (scoped to the extracted core) ---
      - name: Charon MIR extraction (scoped)
        if: steps.scope.outputs.relevant == 'true'
        working-directory: crates/ck-policy
        run: |
          # Force a recompile so Charon emits LLBC even on a warm cargo cache
          # (known footgun: a cached crate makes charon a <1s no-op).
          touch src/extracted.rs src/lib.rs
          # IMPORTANT: the LLBC basename is load-bearing for the drift gate.
          # Aeneas derives the generated Lean module name from this filename
          # (`ck_policy.llbc` -> `import CkPolicy.Types`), so the committed
          # generated/CkPolicy/* files only diff-match byte-for-byte when the
          # basename stays `ck_policy`. Do NOT rename it without regenerating.
          charon cargo --preset aeneas --start-from "$EXTRACT_ROOT" \
            --dest-file /tmp/ck_policy.llbc

      - name: Aeneas Lean 4 translation
        if: steps.scope.outputs.relevant == 'true'
        run: |
          rm -rf /tmp/ci-generated && mkdir -p /tmp/ci-generated
          aeneas -backend lean -split-files /tmp/ck_policy.llbc -dest /tmp/ci-generated

      # --- Drift gate: regenerated must match committed ---
      - name: Verify generated Lean matches committed (drift gate)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          MISMATCH=0
          for f in Funs.lean Types.lean; do
            GEN="/tmp/ci-generated/$f"
            COMMITTED="crates/ck-policy/lean-aeneas/generated/CkPolicy/$f"
            if [ ! -f "$GEN" ]; then
              echo "ERROR: Aeneas did not emit $f"; MISMATCH=1; continue
            fi
            if ! diff -q "$COMMITTED" "$GEN" >/dev/null 2>&1; then
              echo "MISMATCH: $f (regenerated != committed)"
              diff "$COMMITTED" "$GEN" || true
              MISMATCH=1
            fi
          done
          if [ "$MISMATCH" -ne 0 ]; then
            echo ""
            echo "ERROR: committed generated Lean drifted from the Charon+Aeneas output."
            echo "Regenerate: cd crates/ck-policy && charon cargo --preset aeneas \\"
            echo "  --start-from '$EXTRACT_ROOT' --dest-file /tmp/ck_policy.llbc && \\"
            echo "  aeneas -backend lean -split-files /tmp/ck_policy.llbc \\"
            echo "  -dest crates/ck-policy/lean-aeneas/generated  (then move Funs/Types.lean into CkPolicy/)"
            exit 1
          fi
          echo "No drift — committed generated Lean matches the Charon+Aeneas output."

      # Reuse the previous run's Lake output. Lake decides freshness by content-hash
      # traces, not mtimes, so an older .lake is sound: what changed rebuilds, the
      # rest replays. Saved from main only (a merge-group or PR cache is visible to
      # that ref alone). A miss or a failed restore costs time, never a verdict.
      # Mathlib is left out: `lake exe cache get` fetches its oleans every run, and
      # its checkout plus build is ~8 GB, most of the repository's cache quota.
      - name: Restore Lake build output
        id: lake-cache
        if: steps.scope.outputs.relevant == 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "5"
        with:
          path: |
            crates/ck-policy/lean-aeneas/.lake
            !crates/ck-policy/lean-aeneas/.lake/packages/mathlib
          key: lake-v1-ck-policy-lean-aeneas-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/ck-policy/lean-aeneas/lean-toolchain', 'crates/ck-policy/lean-aeneas/lake-manifest.json', 'crates/ck-policy/lean-aeneas/lakefile.lean') }}-${{ github.job }}-${{ hashFiles('crates/ck-policy/lean-aeneas/**/*.lean', '!crates/ck-policy/lean-aeneas/.lake/**') }}
          restore-keys: |
            lake-v1-ck-policy-lean-aeneas-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/ck-policy/lean-aeneas/lean-toolchain', 'crates/ck-policy/lean-aeneas/lake-manifest.json', 'crates/ck-policy/lean-aeneas/lakefile.lean') }}-${{ github.job }}-
            lake-v1-ck-policy-lean-aeneas-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/ck-policy/lean-aeneas/lean-toolchain', 'crates/ck-policy/lean-aeneas/lake-manifest.json', 'crates/ck-policy/lean-aeneas/lakefile.lean') }}-

      # --- Build the proofs over the generated core ---
      - name: Build Lean project with cached artifacts
        if: steps.scope.outputs.relevant == 'true'
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        env:
          LEAN_NUM_THREADS: "4"
        with:
          lake-package-directory: crates/ck-policy/lean-aeneas
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
          build-args: >-
            CkPolicyAeneas

      # Only reached when the build above succeeded, so a failed build never
      # becomes the next run's starting point.
      - name: Save Lake build output
        if: ${{ steps.scope.outputs.relevant == 'true' && github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/ck-policy/lean-aeneas/.lake
            !crates/ck-policy/lean-aeneas/.lake/packages/mathlib
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}

      - name: Ban sorry / admit / native_decide in our proof file
        if: steps.scope.outputs.relevant == 'true'
        run: |
          stripped="$(sed -e '/\/-/,/-\//d' -e 's/--.*$//' \
               crates/ck-policy/lean-aeneas/CkPolicyAeneas.lean)"
          if grep -nE \
               '(:=[[:space:]]*by[[:space:]]+sorry|:=[[:space:]]*sorry|^[[:space:]]*sorry$|:=[[:space:]]*by[[:space:]]+admit|^[[:space:]]*admit$|native_decide)' \
               <<<"$stripped"; then
            echo "ERROR: CkPolicyAeneas.lean uses 'sorry'/'admit'/'native_decide' (banned)."
            exit 1
          fi
          echo "No sorry / admit / native_decide in CkPolicyAeneas.lean (comments stripped)."

      - name: Per-theorem axiom audit (every declaration under CkPolicy, CkPolicyAeneas)
        if: steps.scope.outputs.relevant == 'true'
        # Replaces the hand-listed `#print axioms` grep for `sorryAx` (#2567): the
        # audit walks EVERY declaration the compiled oleans define, allows only
        # propext / Classical.choice / Quot.sound, tolerates native_decide per
        # theorem via crates/ck-policy/lean-aeneas/.axiom-audit-exceptions, guards a positive count
        # against the sources, and ratchets top-level `axiom` declarations.
        run: scripts/lean-axiom-audit.sh crates/ck-policy/lean-aeneas CkPolicy,CkPolicyAeneas
      - name: The axiom audit goes red on axiom / admit / native_decide fixtures
        if: steps.scope.outputs.relevant == 'true'
        run: scripts/lean-axiom-audit.sh crates/ck-policy/lean-aeneas --self-test

      # --- Tier-4 parity: extracted core ↔ production check_monotonicity ---
      - name: Install stable Rust for parity test
        if: steps.scope.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - name: cargo test (extracted-core ↔ production parity)
        if: steps.scope.outputs.relevant == 'true'
        working-directory: crates/ck-policy
        env:
          CARGO_TERM_COLOR: never
        run: cargo test --test policy_aeneas_parity

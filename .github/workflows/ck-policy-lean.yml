name: CK Policy Lean Proofs

# Builds the Mathlib-free Constitutional Kernel monotonicity-gate soundness Lean
# tree that `ck-policy` is parity-pinned to (T1 conditional soundness, `meta_gap`
# anti-coup hole, `strengthened_gate_closes_it` two-step fix) and bans `sorry` /
# `admit` / `native_decide` / `sorryAx`, so the theorems cited by
# crates/ck-policy/tests/policy_lean_parity.rs cannot rot. Dedicated workflow
# (path isolation), cloned from rubric-lean.yml.

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/check-lean-external-state.py"
      - "scripts/lean-axiom-audit.sh"
      - "crates/ck-policy/lean/**"
      - ".github/workflows/ck-policy-lean.yml"
      - "crates/ck-policy/src/lib.rs"
      - "crates/ck-types/**"
      - "crates/xtask/src/lean_replay/**"
      - "crates/xtask/src/lean_action_builds.rs"
  pull_request:
    paths:
      - "scripts/check-lean-external-state.py"
      - "scripts/lean-axiom-audit.sh"
      - "crates/ck-policy/lean/**"
      - ".github/workflows/ck-policy-lean.yml"
      - "crates/ck-policy/src/lib.rs"
      - "crates/ck-types/**"
      - "crates/xtask/src/lean_replay/**"
      - "crates/xtask/src/lean_action_builds.rs"
  merge_group:
  workflow_dispatch:

concurrency:
  # Supersede a PR's older in-flight runs; NEVER cancel anything else.
  # cancel-in-progress is scoped to pull_request on purpose: cancelling a
  # merge_group run would abort a queue entry mid-flight, and cancelling a
  # push to main would drop the signal for a commit that already landed.
  group: ck-policy-lean-real-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ck-policy-lean:
    name: lake build Ck (monotonicity-gate soundness proofs)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      # WHY THIS EXISTS: `paths:` under `merge_group:` is accepted by the YAML
      # schema and then IGNORED by GitHub — path filtering is not supported for
      # merge_group events. So the scoping declared above holds on pull_request
      # and is silently dropped in the merge queue, where the queue's
      # speculative batches multiply it by the queue depth. A README-only PR
      # was running the full Lean proof suite, once per queue entry.
      #
      # This restores the declared intent for merge_group only. On every other
      # event GitHub's own `paths:` already decided, so the gate says yes and
      # changes nothing.
      - name: Is this change in scope?
        id: scope
        env:
          # Never interpolate ${{ }} into a run script (zizmor
          # template-injection hardening) — pass through env.
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
          PATTERN: '^crates/ck-policy/|^crates/ck-types/|^\.github/workflows/ck-policy-lean\.yml$|^scripts/(check-lean-external-state\.py|lean-axiom-audit\.sh)$|^crates/xtask/src/(lean_replay/|lean_action_builds\.rs$)'
        run: |
          set -euo pipefail
          if [ "$EVENT" != "merge_group" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT: GitHub's own paths: filter already applied."
            exit 0
          fi
          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ]; then
            # Fail OPEN: an unknown range must run the proofs, never skip them.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "merge_group with no base/head sha — running to be safe."
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE "$PATTERN"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "in scope — running."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no file in this merge group matches $PATTERN — skipping the"
            echo "expensive steps. This job still reports, so it remains usable"
            echo "as a required status check."
          fi


      # Reuse the previous run's Lake output. Lake decides freshness by content-hash
      # traces, not mtimes, so an older .lake is sound: what changed rebuilds, the
      # rest replays. Saved from main only (a merge-group or PR cache is visible to
      # that ref alone). A miss or a failed restore costs time, never a verdict.
      - name: Restore Lake build output
        id: lake-cache
        if: steps.scope.outputs.relevant == 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "5"
        with:
          path: |
            crates/ck-policy/lean/.lake
          key: lake-v1-ck-policy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/ck-policy/lean/lean-toolchain', 'crates/ck-policy/lean/lake-manifest.json', 'crates/ck-policy/lean/lakefile.lean') }}-${{ github.job }}-${{ hashFiles('crates/ck-policy/lean/**/*.lean', '!crates/ck-policy/lean/.lake/**') }}
          restore-keys: |
            lake-v1-ck-policy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/ck-policy/lean/lean-toolchain', 'crates/ck-policy/lean/lake-manifest.json', 'crates/ck-policy/lean/lakefile.lean') }}-${{ github.job }}-
            lake-v1-ck-policy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/ck-policy/lean/lean-toolchain', 'crates/ck-policy/lean/lake-manifest.json', 'crates/ck-policy/lean/lakefile.lean') }}-

      # Mathlib-free project: install elan directly (the repo's established
      # pattern — see rubric-lean.yml / econ-lean.yml) and run `lake build`. No
      # mathlib cache fetch needed; the whole tree builds in seconds.
      - name: Build Lean project with cached artifacts
        if: steps.scope.outputs.relevant == 'true'
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        env:
          LEAN_NUM_THREADS: "4"
        with:
          lake-package-directory: crates/ck-policy/lean
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"

      # Only reached when the build above succeeded, so a failed build never
      # becomes the next run's starting point.
      - name: Save Lake build output
        if: ${{ steps.scope.outputs.relevant == 'true' && github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/ck-policy/lean/.lake
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}

      - name: Ban sorry / admit / native_decide / sorryAx in ck-policy Lean
        if: steps.scope.outputs.relevant == 'true'
        run: |
          # Match the tactic/term forms (`:= sorry`, `:= by sorry`, a lone `sorry`,
          # a lone `admit` / `:= by admit`, `native_decide`, or the `sorryAx` axiom
          # spelled out in source) — NOT the word "sorry" in "0 sorry" doc comments.
          # Non-vacuity: this gate is a grep, and a grep over a path that no longer
          # matches exits non-zero, takes the `else` branch, and prints the success
          # line having scanned NOTHING. Establish that there is something to scan
          # before letting its silence count as a pass.
          FILES=$(find crates/ck-policy/lean/Ck -name '*.lean' | wc -l | tr -d ' ')
          if [ "$FILES" -lt 1 ]; then
            echo "::error::no .lean files under crates/ck-policy/lean/Ck — the ck-policy sorry-ban scanned nothing."
            exit 1
          fi
          echo "scanning $FILES .lean file(s) under crates/ck-policy/lean/Ck"
          if grep -rnE \
               '(:=[[:space:]]*by[[:space:]]+sorry|:=[[:space:]]*sorry|^[[:space:]]*sorry$|:=[[:space:]]*by[[:space:]]+admit|^[[:space:]]*admit$|native_decide|sorryAx)' \
               --include='*.lean' crates/ck-policy/lean/Ck; then
            echo "ERROR: ck-policy Lean uses 'sorry'/'admit' (proof holes), 'native_decide', or 'sorryAx' (banned)."
            exit 1
          fi
          echo "No sorry / admit / native_decide / sorryAx across $FILES file(s) — monotonicity-gate proofs are complete and kernel-checked."

      - name: Per-theorem axiom audit (every declaration under Ck)
        if: steps.scope.outputs.relevant == 'true'
        # Replaces the hand-listed `#print axioms` grep for `sorryAx` (#2567): the
        # audit walks EVERY declaration the compiled oleans define, allows only
        # propext / Classical.choice / Quot.sound, tolerates native_decide per
        # theorem via crates/ck-policy/lean/.axiom-audit-exceptions, guards a positive count
        # against the sources, and ratchets top-level `axiom` declarations.
        run: scripts/lean-axiom-audit.sh crates/ck-policy/lean Ck
      - name: The axiom audit goes red on axiom / admit / native_decide fixtures
        if: steps.scope.outputs.relevant == 'true'
        run: scripts/lean-axiom-audit.sh crates/ck-policy/lean --self-test
      # Second kernel pass (#2592): leanchecker reads back every proven-tier .olean
      # this job just built and replays its constants through the kernel again —
      # --fresh (Init included, nothing trusted) on a Mathlib-free tier, from imports
      # on a Mathlib one. Tier, modules and mode are derived from this workflow's
      # Lean-action build, the lakefile and the lake manifest; a run that replays
      # nothing is red, not green.
      - name: leanchecker replays the proven tier (second kernel pass)
        if: steps.scope.outputs.relevant == 'true'
        run: cargo run -q -p xtask -- lean-replay --workflow .github/workflows/ck-policy-lean.yml
      - name: The replay goes red on a forged proof term (and green on its sound twin)
        if: steps.scope.outputs.relevant == 'true'
        run: cargo run -q -p xtask -- lean-replay --self-test crates/ck-policy/lean

name: Clippy Ratchet

on:
  pull_request:
  merge_group:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check clippy ceiling
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Check clippy ratchet
        run: scripts/check-clippy-ratchet.sh --strict

  # The gate's own falsifier. `check-gates-can-fail.sh` requires every ci/*.sh
  # gate to prove it can go red; this one cannot be probed there because its
  # perturbation needs a full workspace clippy run, which that fast job does not
  # do. So the two-sided perturbation runs here, beside the gate it falsifies,
  # on every invocation.
  ratchet-falsifier:
    name: The ratchet REDs when the ceiling is below actual
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: RED on a ceiling below actual, GREEN when restored
        run: |
          set -euo pipefail
          cp .clippy-ratchet.toml /tmp/ratchet.bak

          # Perturb: a ceiling of 0 is below any real count.
          sed -i 's/^ceiling = .*/ceiling = 0/' .clippy-ratchet.toml
          # RED FOR THE RIGHT REASON, not merely red.
          #
          # This asserted only a non-zero exit -- and a script that fails for an UNRELATED reason
          # exits non-zero too, so the falsifier passed vacuously and reported "ok: red on a
          # ceiling below actual" about a measurement that had broken. Measured 2026-09-25 on
          # #3017/#3018/#3019: this arm said ok, the restore arm below then failed, and between
          # them they produced no diagnostic at all. A falsifier that cannot tell the failure it
          # is testing for from any other failure is not falsifying anything.
          out=$(scripts/check-clippy-ratchet.sh --strict 2>&1) && {
            echo "::error::the ratchet PASSED with ceiling 0 — it cannot go red, so it is not a gate"
            cp /tmp/ratchet.bak .clippy-ratchet.toml
            exit 1
          }
          case "$out" in
            *"clippy ratchet exceeded"*) ;;
            *)
              echo "::error::the ratchet went red with ceiling 0, but NOT because the count exceeded it."
              echo "That is a broken measurement wearing a passing falsifier. What it said:"
              printf '%s\n' "$out" | tail -30
              cp /tmp/ratchet.bak .clippy-ratchet.toml
              exit 1
              ;;
          esac
          echo "ok: red on a ceiling below actual, and red for that reason"

          # Restore: the real ceiling must pass, or the gate is stuck red and
          # would block every PR for a reason unrelated to the code.
          cp /tmp/ratchet.bak .clippy-ratchet.toml
          scripts/check-clippy-ratchet.sh --strict
          echo "ok: green when restored"

  # Proposes a LOWER ceiling once main measures below it. The logic is
  # `cargo xtask clippy-ratchet-down` (crates/xtask/src/clippy_ratchet_down.rs):
  # it parses .clippy-ratchet.toml as typed integers, never sets the ceiling
  # below the measured count or the target, and checks every git/gh exit
  # status. Why the push is forced and why it authenticates with an explicit
  # x-access-token remote URL (the includeIf credential trap) is commented
  # beside the code that does it.
  #
  # TO ENABLE AUTOMATIC RATCHETING the owner adds a `CLIPPY_RATCHET_TOKEN`
  # secret: a fine-grained PAT (or App token) with contents + pull-requests
  # write. `main` requires the merge queue, so the new ceiling travels as a PR,
  # and the default GITHUB_TOKEN can neither open one here ("GitHub Actions is
  # not permitted to create or approve pull requests") nor trigger
  # `pull_request` workflows on one it opened -- the PR would get no required
  # checks and auto-merge would wait forever. That is how ten
  # chore/clippy-ratchet-* branches were orphaned and this job was red on
  # every drop.
  #
  # WITHOUT the secret this job pushes and opens nothing: it reports the
  # possible drop as a ::notice:: and in the step summary, and exits 0.
  # Lowering the ceiling by hand to the reported number is a one-line PR.
  ratchet-down:
    name: Ratchet ceiling down
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.CLIPPY_RATCHET_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Ratchet down
        env:
          CLIPPY_RATCHET_TOKEN: ${{ secrets.CLIPPY_RATCHET_TOKEN }}
        run: cargo xtask clippy-ratchet-down

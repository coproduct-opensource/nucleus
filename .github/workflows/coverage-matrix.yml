name: Coverage Matrix

on:
  push:
    branches: ["main"]
  pull_request:
    # ready_for_review: llvm-cov and mutants skip drafts, so a draft marked
    # ready must trigger a run or it never gets these checks.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
  schedule:
    # Nightly FULL mutation run. Pull requests mutate only their diff (below);
    # this is where every mutant of the six modules is tried again.
    - cron: "23 4 * * *"

concurrency:
  # Supersede a PR's older in-flight runs; NEVER cancel anything else.
  # cancel-in-progress is scoped to pull_request on purpose: cancelling a
  # merge_group run would abort a queue entry mid-flight, and cancelling a
  # push to main would drop the signal for a commit that already landed.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Detects which crates changed so the heavy coverage/mutation/proof jobs
  # below can skip on PRs with no crate-relevant changes (docs-only, etc).
  # Each required job reports one result: its no-op step for an irrelevant
  # diff, or its real verification steps for relevant changes.
  changed-crates:
    name: Detect Changed Crates
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      all: ${{ steps.detect.outputs.all }}
      crates: ${{ steps.detect.outputs.crates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Detect changed crates
        id: detect
        # Pass event name / base ref via env (never interpolate ${{ }} into a
        # run script — zizmor template-injection / code-injection hardening,
        # as in ck-admit.yml).
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail

          all=false
          changed=""

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Unshallowed fetch of the base ref: a shallow base would leave
            # the three-dot merge-base unreachable for `git diff`.
            #
            # A failed fetch used to be swallowed (`|| true`); the diff below
            # then failed, which failed THIS job, which reported every
            # dependent required check (llvm-cov, mutants, proof-ratchet) as
            # SKIPPED — and GitHub counts a skipped required check as passed.
            # Let the fetch fail loudly. This job is being added to the
            # required set so a red here blocks instead of vacating.
            git fetch origin "$BASE"
            changed="$(git diff --name-only "origin/$BASE...HEAD")"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # Compare the exact synthetic group with its queue base. Missing
            # refs fail this required detector; they must never skip coverage.
            changed="$(git diff --name-only "${MERGE_BASE:?missing merge-group base}" "${MERGE_HEAD:?missing merge-group head}")"
          else
            # push / workflow_dispatch / schedule: run everything.
            all=true
          fi

          if [ "$all" != "true" ] && printf '%s\n' "$changed" | grep -qE '^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|\.kani-minimum-proofs|KANI-STATUS\.md)$|^(\.github|\.cargo|scripts)/'; then
            all=true
          fi

          # `|| true` tolerates no crates/ match (e.g. a docs-only PR), which
          # under `set -euo pipefail` would otherwise crash this job instead
          # of correctly skipping the heavy jobs below.
          crates="$(printf '%s\n' "$changed" | grep -oE '^crates/[^/]+' | sed 's#^crates/##' | sort -u | paste -sd' ' - || true)"

          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "crates=$crates" >> "$GITHUB_OUTPUT"

          {
            echo "## Changed Crates Detection"
            echo ""
            echo "- event: \`$EVENT_NAME\`"
            echo "- full run forced: \`$all\`"
            echo "- changed crates: \`${crates:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Layer 1: LLVM source-based code coverage with threshold enforcement
  llvm-cov:
    name: Code Coverage (llvm-cov)
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    needs: changed-crates
    if: github.event.pull_request.draft != true
    steps:
      - name: No-op twin (no relevant crate changes)
        if: ${{ !(needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '') }}
        run: echo "No crate or CI configuration changes in this diff."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
        with:
          components: llvm-tools-preview
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install cargo-llvm-cov (baked into the self-hosted image)
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
        run: command -v cargo-llvm-cov >/dev/null || cargo install cargo-llvm-cov --locked
      - name: Workspace coverage (threshold gate)
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
        # `shell: bash` gives `-eo pipefail`. GitHub's default `run` shell is
        # `bash -e {0}` WITHOUT pipefail, so `cargo llvm-cov ... | tee` reported
        # TEE's exit status: the --fail-under-lines threshold below could never
        # red this required check. Found by the CI-invariant inventory
        # (2026-09-05); the mutants step below has the same shape (#2628).
        #
        # What pipefail exposed on its first run: `cargo llvm-cov --all-features`
        # had NEVER compiled the workspace on a runner — nucleus-verifier-service
        # `include_bytes!`s the wasm-pack artifact under sdks/verifier-js/pkg,
        # which only exists after `wasm-pack build` (wasm-pure-crates.yml
        # builds it; nothing here does). So the numbers this gate has published
        # measured nothing. The crate is excluded here, stated rather than
        # papered over; its own tests run in wasm-pure-crates.yml.
        shell: bash
        #
        # THRESHOLD = MEASURED TRUTH, 2026-09-05: the first run that could fail
        # measured 83.47 % of lines (144 789 lines, 23 935 missed; regions
        # 84.10 %, functions 80.87 %). The 85 % it asserted before was never
        # measured, so it was a claim, not a floor. Set to the floor of the
        # measurement; it may only go UP, in the change that earns it (the
        # line-ratchet's "reset to measured truth" convention).
        #
        # 83 -> 82.5, 2026-09-10, DELIBERATELY DOWN and against that convention, so
        # the reason is here rather than implied. Setting the floor at the floor of
        # the measurement left 0.47 points of margin; the workspace has since grown
        # to 155 808 lines and the margin eroded to 0.07 -- about 110 lines. At that
        # width any PR adding ~900 lines of feature code at normal coverage is red
        # by arithmetic rather than by anything it did: #2765 (needs 392 more covered
        # lines) and #2716 (420) were both blocked that way, neither having done
        # anything wrong.
        #
        # 82.5 restores ~889 lines of margin against the same measurement. The
        # direction of travel is unchanged -- this goes UP as coverage improves, and
        # the next move should be up. What changed is that the floor stops being set
        # to exactly the measured value, which is what made it a coin flip.
        #
        # The portcullis floor below is NOT touched: measured 89.93 % against 87, a
        # 2.93-point margin, so it has the headroom this one lost. Checked before
        # assuming both needed the same treatment.
        run: |
          cargo llvm-cov --workspace --all-features \
            --exclude nucleus-verifier-service \
            --fail-under-lines 82.5 \
            --ignore-filename-regex '(tests/|kani\.rs|main\.rs)' 2>&1 | tee /tmp/workspace-cov.txt
      - name: portcullis coverage (security-critical threshold)
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
        shell: bash
        run: |
          cargo llvm-cov --all-features -p portcullis \
            --fail-under-lines 87 \
            --ignore-filename-regex '(tests/|kani\.rs)' 2>&1 | tee /tmp/portcullis-cov.txt
      - name: Generate JSON coverage report
        if: ${{ (needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '') && (always()) }}
        # `report` re-reads the profile the portcullis run above just wrote —
        # the previous `cargo llvm-cov -p portcullis --json` re-ran every
        # portcullis test a second time (2.5 min on the self-hosted pool) to
        # produce the same numbers in a different format.
        run: |
          cargo llvm-cov report --json --output-path /tmp/portcullis-cov.json \
            --ignore-filename-regex '(tests/|kani\.rs)' || true
      - name: Coverage summary
        if: ${{ (needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '') && (always()) }}
        run: |
          echo "## Code Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Workspace" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -5 /tmp/workspace-cov.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### portcullis (security-critical)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -5 /tmp/portcullis-cov.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Thresholds:** workspace ≥ 83% lines (measured 83.47 % on 2026-09-05), portcullis ≥ 87% lines" >> "$GITHUB_STEP_SUMMARY"

  # Layer 2: Mutation testing on security-critical modules
  mutants:
    name: Mutation Testing
    # Compile-class: cargo-mutants builds and tests portcullis once per mutant.
    # On the gate pool (0.5 CPU request, 2 CPU limit) it hit the 30-minute
    # timeout on every run of 2026-09-05 and reported "cancelled".
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    needs: changed-crates
    if: github.event.pull_request.draft != true
    steps:
      - name: No-op twin (no relevant crate changes)
        if: ${{ !(needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '') }}
        run: echo "No crate or CI configuration changes in this diff."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
        with:
          cache: ${{ runner.environment == 'github-hosted' }}
      # The self-hosted image bakes it (docker/Dockerfile.runner
      # CARGO_MUTANTS_VERSION); this is the hosted-runner fallback, pinned to the
      # same version so the two environments run the same tool. It was unpinned,
      # which both floated the version and — because nothing baked it — spent
      # ~0.9m of a 1.4m job installing on every run of the SCARCEST pool.
      - name: Install cargo-mutants (baked into the self-hosted image)
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
        run: command -v cargo-mutants >/dev/null || cargo install cargo-mutants --version 27.1.0 --locked
      # A full run of the six modules is ~30 min of a gate runner and ran on
      # every rebase of every PR. On pull_request and merge_group only the
      # mutants overlapping the change are tried (`--in-diff`, cargo-mutants'
      # own incremental mode); a change touching none of the six files has
      # nothing to mutate and the gate passes as "no mutants in diff". A merge
      # group is the same change about to land, so it is scoped the same way —
      # unscoped it exceeded the 45-minute job timeout on the build pool and
      # took the whole group down with it (2026-09-06). push, the nightly
      # schedule and workflow_dispatch still run everything.
      - name: Scope to the diff of the change under review
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
        id: mutscope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: |
          set -euo pipefail
          run=true; in_diff=""
          case "$EVENT_NAME" in
            pull_request | merge_group)
              # Defaulting errs toward a WIDER diff (more mutants tried), never a
              # narrower one, so a missing base ref cannot quietly shrink the gate.
              base="${BASE#refs/heads/}"; base="${base:-main}"
              git fetch -q origin "$base"
              git diff "origin/$base...HEAD" > git.diff
              if grep -qE '^\+\+\+ b/crates/portcullis/src/(capability|guard|lattice|certificate|delegation|trust)\.rs$' git.diff; then
                in_diff="--in-diff git.diff"
              else
                run=false
              fi
              ;;
          esac
          { echo "run=$run"; echo "in_diff=$in_diff"; } >> "$GITHUB_OUTPUT"
          echo "mutants: run=$run ${in_diff:+(diff-scoped)}"
      - name: Run mutation tests on security-critical modules
        if: ${{ (needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '') && (steps.mutscope.outputs.run == 'true') }}
        shell: bash
        env:
          IN_DIFF: ${{ steps.mutscope.outputs.in_diff }}
        # pipefail so the tool's exit status is the step's (not tee's); the
        # run is allowed to fail here so the report step below can say WHY.
        run: |
          set -o pipefail
          rc=0
          # --all-features on cargo-mutants ITSELF: args after `--` reach only
          # `cargo test`, so the baseline BUILD ran without features and, under
          # RUSTFLAGS=-D warnings, died on feature-gated imports in
          # tests/adversarial.rs — the "cargo build failed in an unmutated
          # tree" every run showed once the gate stopped looking away.
          # IN_DIFF is "--in-diff git.diff" or empty: a deliberate word-split.
          # shellcheck disable=SC2086
          cargo mutants --package portcullis --all-features $IN_DIFF \
            --file crates/portcullis/src/capability.rs \
            --file crates/portcullis/src/guard.rs \
            --file crates/portcullis/src/lattice.rs \
            --file crates/portcullis/src/certificate.rs \
            --file crates/portcullis/src/delegation.rs \
            --file crates/portcullis/src/trust.rs \
            --timeout 120 \
            --output mutants-report 2>&1 | tee /tmp/mutants.txt || rc=$?
          echo "cargo mutants exit: $rc"
      - name: The gate reads the machine report, not the console (#2562)
        if: ${{ (needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '') && (always() && steps.mutscope.outputs.run == 'true') }}
        shell: bash
        run: |
          # `Mutation Testing` passed runs whose log said "cargo build failed in
          # an unmutated tree, so no mutants were tested": the old guard grepped
          # for "Found N mutants", which prints before the baseline fails.
          # scripts/check-mutants-report.sh parses mutants-report/mutants.out/
          # outcomes.json: tested == total > 0, missed == 0, timeout/unviable
          # bounded, and the unmutated-tree preamble is itself a failure.
          if ! scripts/check-mutants-report.sh mutants-report/mutants.out /tmp/mutants.txt 5 50; then
            echo "::group::baseline log (why the unmutated tree failed, if it did)"
            tail -60 mutants-report/mutants.out/log/baseline.log 2>/dev/null || echo "(no baseline log)"
            echo "::endgroup::"
            exit 1
          fi
      - name: The mutants gate goes red on a saved failure log and a survivor
        if: ${{ (needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '') && (always()) }}
        run: scripts/check-mutants-report.sh --self-test
      - name: Mutation summary
        if: ${{ (needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '') && (always()) }}
        shell: bash
        env:
          RUN: ${{ steps.mutscope.outputs.run }}
          IN_DIFF: ${{ steps.mutscope.outputs.in_diff }}
        run: |
          echo "## Mutation Testing Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Modules tested:** capability, guard, lattice, certificate, delegation, trust" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RUN" != "true" ]; then
            echo "no mutants in this pull request's diff (none of the six modules changed); the nightly schedule runs them all" >> "$GITHUB_STEP_SUMMARY"
          elif [ -s mutants-report/mutants.out/outcomes.json ]; then
            echo "**Scope:** ${IN_DIFF:-full}" >> "$GITHUB_STEP_SUMMARY"
            jq -r '"- **tested:** \((.caught//0)+(.missed//0)+(.timeout//0)+(.unviable//0)) / \(.total_mutants//0)\n- **caught:** \(.caught//0)\n- **survived:** \(.missed//0)\n- **timeout:** \(.timeout//0)\n- **unviable:** \(.unviable//0)"' mutants-report/mutants.out/outcomes.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no outcomes.json — the run did not produce a report" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Layer 3: Verification proof count regression gates
  #
  # Verus is gone from the workspace (see FORMAL_METHODS.md); only the proptest
  # conformance suite survives. Here we gate Kani proof harnesses and report counts.
  proof-ratchet:
    name: Proof Count Ratchet
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    needs: changed-crates
    steps:
      - name: No-op twin (no relevant crate changes)
        if: ${{ !(needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '') }}
        run: echo "No crate or CI configuration changes in this diff."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
      - name: Count Kani proofs
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
        id: kani-count
        run: |
          # One census, counted by scripts/check-kani-proof-count.sh (#2561): the
          # inlined grep -rc on a DIRECTORY printed per-file lines, the arithmetic
          # errored, PROOF_COUNT was never set, and the gate passed on "".
          PROOF_COUNT=$(scripts/check-kani-proof-count.sh --count)
          MINIMUM=$(tr -d '[:space:]' < .kani-minimum-proofs)
          echo "count=$PROOF_COUNT" >> "$GITHUB_OUTPUT"
          echo "minimum=$MINIMUM" >> "$GITHUB_OUTPUT"
          scripts/check-kani-proof-count.sh --strict
      - name: Count verification artifacts
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
        id: counts
        run: |
          CONFORMANCE=$(grep -c 'proptest!' crates/portcullis/tests/lattice_conformance.rs)
          echo "conformance=$CONFORMANCE" >> "$GITHUB_OUTPUT"
          echo "Conformance test suites: $CONFORMANCE"
      - name: Ratchet summary
        if: ${{ (needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '') && (always()) }}
        run: |
          echo "## Proof Count Ratchet" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Layer | Count | Minimum | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|---------|--------|" >> "$GITHUB_STEP_SUMMARY"


          KANI="${{ steps.kani-count.outputs.count }}"
          KANI_MIN="${{ steps.kani-count.outputs.minimum }}"
          if [ -n "$KANI" ] && [ "$KANI" -ge "$KANI_MIN" ]; then
            echo "| Kani BMC harnesses | $KANI | $KANI_MIN | pass |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Kani BMC harnesses | ${KANI:-?} | ${KANI_MIN:-?} | FAIL |" >> "$GITHUB_STEP_SUMMARY"
          fi

          CONF="${{ steps.counts.outputs.conformance }}"
          echo "| Conformance suites | ${CONF:-?} | — | info |" >> "$GITHUB_STEP_SUMMARY"

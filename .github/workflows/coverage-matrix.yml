name: Coverage Matrix

on:
  push:
    branches: ["main"]
  pull_request:
    # ready_for_review: llvm-cov and mutants skip drafts, so a draft marked
    # ready must trigger a run or it never gets these checks.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
  schedule:
    # Nightly FULL mutation run. Pull requests mutate only their diff (below);
    # this is where every mutant of the six modules is tried again.
    - cron: "23 4 * * *"

concurrency:
  # Supersede a PR's older in-flight runs; NEVER cancel anything else.
  # cancel-in-progress is scoped to pull_request on purpose: cancelling a
  # merge_group run would abort a queue entry mid-flight, and cancelling a
  # push to main would drop the signal for a commit that already landed.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # What Mutation Testing mutates, declared once and read by the plan and every
  # shard (a flag list, word-split on purpose), so the plan and the shards cannot
  # disagree about the scope whose identities they compare.
  MUTANTS_SCOPE: >-
    --package portcullis --all-features
    --file crates/portcullis/src/capability.rs
    --file crates/portcullis/src/guard.rs
    --file crates/portcullis/src/lattice.rs
    --file crates/portcullis/src/certificate.rs
    --file crates/portcullis/src/delegation.rs
    --file crates/portcullis/src/trust.rs
  # The pinned cargo-mutants: the hosted-runner fallback installs it, and the
  # decision refuses a plan or report made by any other version. The
  # self-hosted image bakes the same version (docker/Dockerfile.runner).
  CARGO_MUTANTS_VERSION: "27.1.0"

jobs:
  # Detects which crates changed so the heavy coverage/mutation/proof jobs
  # below can skip on PRs with no crate-relevant changes (docs-only, etc).
  # Each required job reports one result: its no-op step for an irrelevant
  # diff, or its real verification steps for relevant changes.
  changed-crates:
    name: Detect Changed Crates
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      all: ${{ steps.detect.outputs.all }}
      crates: ${{ steps.detect.outputs.crates }}
      # Mutation testing mutates `portcullis` and nothing else, so it needs a
      # narrower trigger than `all`. See the step below.
      mutate: ${{ steps.detect.outputs.mutate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Detect changed crates
        id: detect
        # Pass event name / base ref via env (never interpolate ${{ }} into a
        # run script — zizmor template-injection / code-injection hardening,
        # as in ck-admit.yml).
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail

          all=false
          changed=""

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Unshallowed fetch of the base ref: a shallow base would leave
            # the three-dot merge-base unreachable for `git diff`.
            #
            # A failed fetch used to be swallowed (`|| true`); the diff below
            # then failed, which failed THIS job, which reported every
            # dependent required check (llvm-cov, mutants, proof-ratchet) as
            # SKIPPED — and GitHub counts a skipped required check as passed.
            # Let the fetch fail loudly. This job is being added to the
            # required set so a red here blocks instead of vacating.
            git fetch origin "$BASE"
            changed="$(git diff --name-only "origin/$BASE...HEAD")"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # Compare the exact synthetic group with its queue base. Missing
            # refs fail this required detector; they must never skip coverage.
            changed="$(git diff --name-only "${MERGE_BASE:?missing merge-group base}" "${MERGE_HEAD:?missing merge-group head}")"
          else
            # push / workflow_dispatch / schedule: run everything.
            all=true
          fi

          if [ "$all" != "true" ] && printf '%s\n' "$changed" | grep -qE '^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|\.kani-minimum-proofs|KANI-STATUS\.md)$|^(\.github|\.cargo|scripts)/'; then
            all=true
          fi

          # `|| true` tolerates no crates/ match (e.g. a docs-only PR), which
          # under `set -euo pipefail` would otherwise crash this job instead
          # of correctly skipping the heavy jobs below.
          crates="$(printf '%s\n' "$changed" | grep -oE '^crates/[^/]+' | sed 's#^crates/##' | sort -u | paste -sd' ' - || true)"

          # Mutation testing runs `cargo mutants --package portcullis`. It mutates
          # THAT crate and no other, so `all` is the wrong trigger for it: `all` is
          # forced by any change under .github/, .cargo/ or scripts/, and a workflow
          # file cannot change what portcullis does. Measured cost of getting this
          # wrong: commit dabbad79b (#2773) touched manifest-guards.yml, Cargo.lock,
          # manager.toml and three xtask files -- zero portcullis -- and mutation
          # testing ran for 46.2 minutes as the SOLE critical path of a 72.1-minute
          # wall.
          #
          # It runs when something that can change a portcullis mutant's outcome
          # changes: the crate itself, the workspace dependency table or toolchain it
          # compiles against, or this workflow (which owns the invocation and the
          # --file list).
          #
          # Cargo.lock is DELIBERATELY not in that list, and the first version of this
          # had it. #2773's entire lock diff was `+ "ci-fly-runner"` -- a dependency
          # added to xtask -- so including the lock left the 46 minutes exactly where
          # they were. A lock change that can move a portcullis mutant almost always
          # arrives with a Cargo.toml change, which IS here. The residue -- a bare
          # `cargo update` shifting a portcullis dependency -- is covered by the
          # nightly full run above, which retries every mutant of all six modules.
          mutate=false
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "merge_group" ]; then
            mutate=true                       # push/dispatch/schedule: no diff to narrow by
          elif printf '%s\n' "$changed" | grep -qE '^crates/portcullis/|^(Cargo\.toml|rust-toolchain\.toml)$|^\.github/workflows/coverage-matrix\.yml$'; then
            mutate=true
          fi

          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
          echo "mutate=$mutate" >> "$GITHUB_OUTPUT"

          {
            echo "## Changed Crates Detection"
            echo ""
            echo "- event: \`$EVENT_NAME\`"
            echo "- full run forced: \`$all\`"
            echo "- changed crates: \`${crates:-none}\`"
            echo "- mutation testing: \`$mutate\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Layer 1: LLVM source-based code coverage with threshold enforcement
  llvm-cov:
    name: Code Coverage (llvm-cov)
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    needs: changed-crates
    if: github.event.pull_request.draft != true
    steps:
      - name: No-op twin (no relevant crate changes)
        if: ${{ !(needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '') }}
        run: echo "No crate or CI configuration changes in this diff."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
        with:
          components: llvm-tools-preview
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install cargo-llvm-cov (baked into the self-hosted image)
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
        run: command -v cargo-llvm-cov >/dev/null || cargo install cargo-llvm-cov --locked
      - name: Workspace coverage (threshold gate)
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
        # `shell: bash` gives `-eo pipefail`. GitHub's default `run` shell is
        # `bash -e {0}` WITHOUT pipefail, so `cargo llvm-cov ... | tee` reported
        # TEE's exit status: the --fail-under-lines threshold below could never
        # red this required check. Found by the CI-invariant inventory
        # (2026-09-05); the mutants step below has the same shape (#2628).
        #
        # What pipefail exposed on its first run: `cargo llvm-cov --all-features`
        # had NEVER compiled the workspace on a runner — nucleus-verifier-service
        # `include_bytes!`s the wasm-pack artifact under sdks/verifier-js/pkg,
        # which only exists after `wasm-pack build` (wasm-pure-crates.yml
        # builds it; nothing here does). So the numbers this gate has published
        # measured nothing. The crate is excluded here, stated rather than
        # papered over; its own tests run in wasm-pure-crates.yml.
        shell: bash
        #
        # THRESHOLD = MEASURED TRUTH, 2026-09-05: the first run that could fail
        # measured 83.47 % of lines (144 789 lines, 23 935 missed; regions
        # 84.10 %, functions 80.87 %). The 85 % it asserted before was never
        # measured, so it was a claim, not a floor. Set to the floor of the
        # measurement; it may only go UP, in the change that earns it (the
        # line-ratchet's "reset to measured truth" convention).
        #
        # 83 -> 82.5, 2026-09-10, DELIBERATELY DOWN and against that convention, so
        # the reason is here rather than implied. Setting the floor at the floor of
        # the measurement left 0.47 points of margin; the workspace has since grown
        # to 155 808 lines and the margin eroded to 0.07 -- about 110 lines. At that
        # width any PR adding ~900 lines of feature code at normal coverage is red
        # by arithmetic rather than by anything it did: #2765 (needs 392 more covered
        # lines) and #2716 (420) were both blocked that way, neither having done
        # anything wrong.
        #
        # 82.5 restores ~889 lines of margin against the same measurement. The
        # direction of travel is unchanged -- this goes UP as coverage improves, and
        # the next move should be up. What changed is that the floor stops being set
        # to exactly the measured value, which is what made it a coin flip.
        #
        # The portcullis floor below is NOT touched: measured 89.93 % against 87, a
        # 2.93-point margin, so it has the headroom this one lost. Checked before
        # assuming both needed the same treatment.
        run: |
          cargo llvm-cov --workspace --all-features \
            --exclude nucleus-verifier-service \
            --fail-under-lines 82.5 \
            --ignore-filename-regex '(tests/|kani\.rs|main\.rs)' 2>&1 | tee /tmp/workspace-cov.txt
      - name: portcullis coverage (security-critical threshold)
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
        shell: bash
        run: |
          cargo llvm-cov --all-features -p portcullis \
            --fail-under-lines 87 \
            --ignore-filename-regex '(tests/|kani\.rs)' 2>&1 | tee /tmp/portcullis-cov.txt
      - name: Generate JSON coverage report
        if: ${{ (needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '') && (always()) }}
        # `report` re-reads the profile the portcullis run above just wrote —
        # the previous `cargo llvm-cov -p portcullis --json` re-ran every
        # portcullis test a second time (2.5 min on the self-hosted pool) to
        # produce the same numbers in a different format.
        run: |
          cargo llvm-cov report --json --output-path /tmp/portcullis-cov.json \
            --ignore-filename-regex '(tests/|kani\.rs)' || true
      - name: Coverage summary
        if: ${{ (needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '') && (always()) }}
        run: |
          echo "## Code Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Workspace" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -5 /tmp/workspace-cov.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### portcullis (security-critical)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -5 /tmp/portcullis-cov.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Thresholds:** workspace ≥ 83% lines (measured 83.47 % on 2026-09-05), portcullis ≥ 87% lines" >> "$GITHUB_STEP_SUMMARY"

  # Layer 2: Mutation testing on security-critical modules -- planned, sharded, decided.
  #
  # One job ran every diff-scoped mutant under a 45-minute timeout. With
  # --jobs 3 --profile mutants (#3480) #3467's 129 mutants still took 36.5 min,
  # and a full run (607 mutants: nightly, push) cannot finish in one job at all.
  # So it is three jobs, and the REQUIRED context `Mutation Testing` is the last:
  #
  #   mutants-plan   the scope, then `cargo mutants --list --json` at this commit
  #                  (the PLAN); `xtask mutants-gate plan` sizes the matrix from
  #                  the plan's length, so a small diff gets one shard.
  #   mutants-shard  one job per shard: `--shard k/N --sharding round-robin`,
  #                  which gives shard k exactly the plan's entries i % N == k.
  #                  A failed shard is re-run alone ("Re-run failed jobs").
  #   mutants        `Mutation Testing`: `xtask mutants-gate decide` requires each
  #                  shard's outcomes to be its share of the plan BY NAME, every
  #                  report finished, from this commit and the pinned version.
  #
  # Each job's build cost is measured in #3480: ~16.6 s of wall per mutant at
  # --jobs 3 on the build pool, plus ~2 min of baseline and ~2 min of setup.
  # MUTANTS_PER_SHARD=60 is ~17 min of mutants, ~21 min a shard; the cap of 8
  # shards holds a full 607-mutant run at ~76 a shard.
  mutants-plan:
    name: Mutation Testing plan
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    needs: changed-crates
    if: ${{ github.event.pull_request.draft != true && needs.changed-crates.outputs.mutate == 'true' }}
    outputs:
      run: ${{ steps.mutscope.outputs.run }}
      in_diff: ${{ steps.mutscope.outputs.in_diff }}
      shard_count: ${{ steps.sizing.outputs.shard_count }}
      shards: ${{ steps.sizing.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: ${{ runner.environment == 'github-hosted' }}
      # The self-hosted image bakes it (docker/Dockerfile.runner
      # CARGO_MUTANTS_VERSION); this is the hosted-runner fallback, pinned to the
      # same version so the two environments run the same tool. It was unpinned,
      # which both floated the version and — because nothing baked it — spent
      # ~0.9m of a 1.4m job installing on every run of the SCARCEST pool.
      - name: Install cargo-mutants (baked into the self-hosted image)
        run: command -v cargo-mutants >/dev/null || cargo install cargo-mutants --version "$CARGO_MUTANTS_VERSION" --locked
      # A full run of the six modules is ~30 min of a gate runner and ran on
      # every rebase of every PR. On pull_request and merge_group only the
      # mutants overlapping the change are tried (`--in-diff`, cargo-mutants'
      # own incremental mode); a change touching none of the six files has
      # nothing to mutate and the gate passes as "no mutants in diff". A merge
      # group is the same change about to land, so it is scoped the same way —
      # unscoped it exceeded the 45-minute job timeout on the build pool and
      # took the whole group down with it (2026-09-06). push, the nightly
      # schedule and workflow_dispatch still run everything.
      - name: Scope to the diff of the change under review
        id: mutscope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p mutants-plan
          run=true; in_diff=""
          case "$EVENT_NAME" in
            pull_request | merge_group)
              # Defaulting errs toward a WIDER diff (more mutants tried), never a
              # narrower one, so a missing base ref cannot quietly shrink the gate.
              base="${BASE#refs/heads/}"; base="${base:-main}"
              git fetch -q origin "$base"
              git diff "origin/$base...HEAD" > mutants-plan/git.diff
              if grep -qE '^\+\+\+ b/crates/portcullis/src/(capability|guard|lattice|certificate|delegation|trust)\.rs$' mutants-plan/git.diff; then
                in_diff="--in-diff mutants-plan/git.diff"
                # A filename in the diff is COARSER than cargo-mutants' own scope:
                # a change confined to `mod tests` names the file but yields no
                # mutants, so cargo-mutants exits 0 writing no outcomes.json and
                # the gate then fails a run that had nothing to do (#2884). Ask
                # the tool what it would generate and stand down when the answer
                # is nothing — the same "no mutants in diff" pass the
                # untouched-file case already gets, decided by the tool's scope
                # rather than by a filename. Only the EMPTY answer stands down; a
                # listing failure leaves the gate armed, so this cannot quietly
                # skip a run it should have made.
                # MUTANTS_SCOPE is a flag list: a deliberate word-split.
                # shellcheck disable=SC2086
                if ! cargo mutants $MUTANTS_SCOPE --in-diff mutants-plan/git.diff \
                      --list 2>/dev/null | grep -q .; then
                  run=false; in_diff=""
                  echo "mutants: the six files are named in the diff but cargo-mutants generates no mutants from it (test-only change); standing down"
                fi
              else
                run=false
              fi
              ;;
          esac
          { echo "run=$run"; echo "in_diff=$in_diff"; } >> "$GITHUB_OUTPUT"
          echo "mutants: run=$run ${in_diff:+(diff-scoped)}"
      # The plan: every mutant this run must test, by identity, at this commit,
      # by this cargo-mutants. The shards' reports are checked against it.
      - name: List the plan
        if: ${{ steps.mutscope.outputs.run == 'true' }}
        env:
          IN_DIFF: ${{ steps.mutscope.outputs.in_diff }}
        run: |
          # MUTANTS_SCOPE and IN_DIFF are flag lists: a deliberate word-split.
          # shellcheck disable=SC2086
          cargo mutants $MUTANTS_SCOPE $IN_DIFF --list --json > mutants-plan/list.json
          git rev-parse HEAD > mutants-plan/commit.txt
          cargo mutants --version > mutants-plan/version.txt
      - name: Size the shard matrix from the plan
        if: ${{ steps.mutscope.outputs.run == 'true' }}
        id: sizing
        run: cargo run -q -p xtask -- mutants-gate plan --list mutants-plan/list.json --per-shard 3 --max-shards 8 --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ steps.mutscope.outputs.run == 'true' }}
        with:
          name: mutants-plan
          path: mutants-plan/
          if-no-files-found: error
          retention-days: 14

  mutants-shard:
    name: Mutation Testing shard ${{ matrix.shard }}
    # Compile-class: cargo-mutants builds and tests portcullis once per mutant.
    # On the gate pool (0.5 CPU request, 2 CPU limit) it hit the 30-minute
    # timeout on every run of 2026-09-05 and reported "cancelled".
    #
    # MUTANTS_JOBS=3 (#3480, 2026-10-14). Measured on 33 of #3467's mutants,
    # pinned to 8 cores: build is ~64 % of a caught mutant (15.7 s build + 8.8 s
    # test), and each build is serial enough (one crate, then link) to leave
    # cores idle. Wall time, serial dev 763 s; serial --profile mutants 726 s;
    # --jobs 2: 478 s; --jobs 3: 452 s; --jobs 4: 460 s, peak memory 7.7 GiB.
    # 3 is the knee. Each job copies the tree and builds in its own target dir,
    # so memory scales with J; 32 GiB holds it.
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    needs: [changed-crates, mutants-plan]
    if: ${{ github.event.pull_request.draft != true && needs.mutants-plan.outputs.run == 'true' }}
    strategy:
      # Every shard runs to its own end: one red shard must not cancel the
      # others, or a re-run could not be confined to the shard that failed.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Install cargo-mutants (baked into the self-hosted image)
        run: command -v cargo-mutants >/dev/null || cargo install cargo-mutants --version "$CARGO_MUTANTS_VERSION" --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mutants-plan
          path: mutants-plan
      - name: Run this shard's share of the plan
        shell: bash
        env:
          IN_DIFF: ${{ needs.mutants-plan.outputs.in_diff }}
          SHARD: ${{ matrix.shard }}/${{ needs.mutants-plan.outputs.shard_count }}
          MUTANTS_JOBS: "3"
        # pipefail so the tool's exit status is the step's (not tee's); the run
        # is allowed to fail here so the decision can say WHY from the report.
        run: |
          set -o pipefail
          mkdir -p shard
          git rev-parse HEAD > shard/commit.txt
          rc=0
          # --all-features on cargo-mutants ITSELF (in MUTANTS_SCOPE): args after
          # `--` reach only `cargo test`, so the baseline BUILD ran without
          # features and, under RUSTFLAGS=-D warnings, died on feature-gated
          # imports in tests/adversarial.rs — the "cargo build failed in an
          # unmutated tree" every run showed once the gate stopped looking away.
          #
          # --jobs / --profile mutants: see MUTANTS_JOBS above and
          # [profile.mutants] in Cargo.toml. Neither changes WHICH tests a
          # mutant must fail -- same test binaries, same proptest cases.
          # shellcheck disable=SC2086
          timeout -s KILL 150 cargo mutants $MUTANTS_SCOPE $IN_DIFF \
            --shard "$SHARD" --sharding round-robin \
            --profile mutants --jobs "$MUTANTS_JOBS" \
            --timeout 120 \
            --output shard 2>&1 | tee shard/console.log || rc=$?
          echo "cargo mutants exit: $rc"
      # Uploaded whatever happened, so the decision can name what is missing.
      # overwrite: a re-run of this shard replaces its earlier attempt's report.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: mutants-shard-${{ matrix.shard }}-of-${{ needs.mutants-plan.outputs.shard_count }}
          path: |
            shard/console.log
            shard/commit.txt
            shard/mutants.out/outcomes.json
            shard/mutants.out/*.txt
          overwrite: true
          retention-days: 14

  mutants:
    name: Mutation Testing
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    needs: [changed-crates, mutants-plan, mutants-shard]
    # always(): a failed, cancelled or skipped upstream must reach the decision,
    # which reads every result from `needs` -- a skipped required check counts
    # as passed, so this job must never be the one that is skipped for it.
    if: ${{ always() && github.event.pull_request.draft != true }}
    steps:
      - name: No-op twin (no relevant crate changes)
        if: ${{ needs.changed-crates.result == 'success' && needs.changed-crates.outputs.mutate != 'true' }}
        run: echo "No crate or CI configuration changes in this diff."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ always() && !(needs.changed-crates.result == 'success' && needs.changed-crates.outputs.mutate != 'true') }}
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: ${{ always() && !(needs.changed-crates.result == 'success' && needs.changed-crates.outputs.mutate != 'true') }}
        with:
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: ${{ always() && needs.mutants-plan.outputs.run == 'true' }}
        with:
          name: mutants-plan
          path: mutants-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: ${{ always() && needs.mutants-plan.outputs.run == 'true' }}
        with:
          pattern: mutants-shard-*
          path: mutants-shards
      # `Mutation Testing` passed runs whose log said "cargo build failed in an
      # unmutated tree" (#2562), and a report reader that compared a report's
      # tested count with its OWN total passed a cancelled run (the report of an
      # interrupted run counts only what it reached). The decision is
      # crates/xtask/src/mutants_gate.rs: every shard's outcomes are exactly its
      # share of the plan, every report finished, one commit, one version.
      - name: The gate reads every shard's machine report against the plan
        if: ${{ always() && !(needs.changed-crates.result == 'success' && needs.changed-crates.outputs.mutate != 'true') }}
        env:
          NEEDS: ${{ toJSON(needs) }}
          COMMIT: ${{ github.sha }}
        run: cargo run -q -p xtask -- mutants-gate decide --needs "$NEEDS" --plan mutants-plan --shards mutants-shards --commit "$COMMIT" --expect-version "$CARGO_MUTANTS_VERSION" --max-timeout 5 --max-unviable 50 --summary "$GITHUB_STEP_SUMMARY"
      - name: The mutants gate goes red on a truncated report, a missing shard and a survivor
        if: ${{ always() && !(needs.changed-crates.result == 'success' && needs.changed-crates.outputs.mutate != 'true') }}
        run: cargo run -q -p xtask -- mutants-gate --self-test

  # Layer 3: Verification proof count regression gates
  #
  # Verus is gone from the workspace (see FORMAL_METHODS.md); only the proptest
  # conformance suite survives. Here we gate Kani proof harnesses and report counts.
  proof-ratchet:
    name: Proof Count Ratchet
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    needs: changed-crates
    steps:
      - name: No-op twin (no relevant crate changes)
        if: ${{ !(needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '') }}
        run: echo "No crate or CI configuration changes in this diff."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
      - name: Count Kani proofs
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
        id: kani-count
        run: |
          # One census, counted by scripts/check-kani-proof-count.sh (#2561): the
          # inlined grep -rc on a DIRECTORY printed per-file lines, the arithmetic
          # errored, PROOF_COUNT was never set, and the gate passed on "".
          PROOF_COUNT=$(scripts/check-kani-proof-count.sh --count)
          MINIMUM=$(tr -d '[:space:]' < .kani-minimum-proofs)
          echo "count=$PROOF_COUNT" >> "$GITHUB_OUTPUT"
          echo "minimum=$MINIMUM" >> "$GITHUB_OUTPUT"
          scripts/check-kani-proof-count.sh --strict
      - name: Count verification artifacts
        if: ${{ needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '' }}
        id: counts
        run: |
          CONFORMANCE=$(grep -c 'proptest!' crates/portcullis/tests/lattice_conformance.rs)
          echo "conformance=$CONFORMANCE" >> "$GITHUB_OUTPUT"
          echo "Conformance test suites: $CONFORMANCE"
      - name: Ratchet summary
        if: ${{ (needs.changed-crates.outputs.all == 'true' || needs.changed-crates.outputs.crates != '') && (always()) }}
        run: |
          echo "## Proof Count Ratchet" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Layer | Count | Minimum | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|---------|--------|" >> "$GITHUB_STEP_SUMMARY"


          KANI="${{ steps.kani-count.outputs.count }}"
          KANI_MIN="${{ steps.kani-count.outputs.minimum }}"
          if [ -n "$KANI" ] && [ "$KANI" -ge "$KANI_MIN" ]; then
            echo "| Kani BMC harnesses | $KANI | $KANI_MIN | pass |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Kani BMC harnesses | ${KANI:-?} | ${KANI_MIN:-?} | FAIL |" >> "$GITHUB_STEP_SUMMARY"
          fi

          CONF="${{ steps.counts.outputs.conformance }}"
          echo "| Conformance suites | ${CONF:-?} | — | info |" >> "$GITHUB_STEP_SUMMARY"

name: Econ Lean Proofs + Golden Seal

# Closes gap G3 (chariot punch-list): the mathlib-free economic Lean proofs were
# never built in CI, and the "golden-vector-pinned across languages" claim was
# prose. This job (a) builds the econ Lean tree (fails on any `sorry` / failing
# `decide`), (b) bans `sorry` / `native_decide` in the sources, and (c) asserts the
# generated Lean golden checks are in sync with the JSON single-source.

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/check-lean-external-state.py"
      - "scripts/lean-axiom-audit.sh"
      - "crates/nucleus-econ-kernels/lean/**"
      - "crates/nucleus-econ-kernels/tests/golden/**"
      - "scripts/gen-golden-lean.sh"
      - ".github/workflows/econ-lean.yml"
      - "crates/xtask/src/lean_replay/**"
      - "crates/xtask/src/lean_action_builds.rs"
  pull_request:
    paths:
      - "scripts/check-lean-external-state.py"
      - "scripts/lean-axiom-audit.sh"
      - "crates/nucleus-econ-kernels/lean/**"
      - "crates/nucleus-econ-kernels/tests/golden/**"
      - "scripts/gen-golden-lean.sh"
      - ".github/workflows/econ-lean.yml"
      - "crates/xtask/src/lean_replay/**"
      - "crates/xtask/src/lean_action_builds.rs"
  merge_group:
  workflow_dispatch:

concurrency:
  # Supersede a PR's older in-flight runs; NEVER cancel anything else.
  # cancel-in-progress is scoped to pull_request on purpose: cancelling a
  # merge_group run would abort a queue entry mid-flight, and cancelling a
  # push to main would drop the signal for a commit that already landed.
  group: econ-lean-real-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  econ-lean:
    name: lake build Nucleus (econ proofs + golden seal)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      # WHY THIS EXISTS: `paths:` under `merge_group:` is accepted by the YAML
      # schema and then IGNORED by GitHub — path filtering is not supported for
      # merge_group events. So the scoping declared above holds on pull_request
      # and is silently dropped in the merge queue, where the queue's
      # speculative batches multiply it by the queue depth. A README-only PR
      # was running the full Lean proof suite, once per queue entry.
      #
      # This restores the declared intent for merge_group only. On every other
      # event GitHub's own `paths:` already decided, so the gate says yes and
      # changes nothing.
      - name: Is this change in scope?
        id: scope
        env:
          # Never interpolate ${{ }} into a run script (zizmor
          # template-injection hardening) — pass through env.
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
          PATTERN: '^crates/nucleus-econ-kernels/|^scripts/gen-golden-lean\.sh$|^\.github/workflows/econ-lean\.yml$|^scripts/(check-lean-external-state\.py|lean-axiom-audit\.sh)$|^crates/xtask/src/(lean_replay/|lean_action_builds\.rs$)'
        run: |
          set -euo pipefail
          if [ "$EVENT" != "merge_group" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT: GitHub's own paths: filter already applied."
            exit 0
          fi
          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ]; then
            # Fail OPEN: an unknown range must run the proofs, never skip them.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "merge_group with no base/head sha — running to be safe."
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE "$PATTERN"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "in scope — running."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no file in this merge group matches $PATTERN — skipping the"
            echo "expensive steps. This job still reports, so it remains usable"
            echo "as a required status check."
          fi


      # Reuse the previous run's Lake output. Lake decides freshness by content-hash
      # traces, not mtimes, so an older .lake is sound: what changed rebuilds, the
      # rest replays. Saved from main only (a merge-group or PR cache is visible to
      # that ref alone). A miss or a failed restore costs time, never a verdict.
      - name: Restore Lake build output
        id: lake-cache
        if: steps.scope.outputs.relevant == 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "5"
        with:
          path: |
            crates/nucleus-econ-kernels/lean/.lake
          key: lake-v1-nucleus-econ-kernels-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/nucleus-econ-kernels/lean/lean-toolchain', 'crates/nucleus-econ-kernels/lean/lake-manifest.json', 'crates/nucleus-econ-kernels/lean/lakefile.lean') }}-${{ github.job }}-${{ hashFiles('crates/nucleus-econ-kernels/lean/**/*.lean', '!crates/nucleus-econ-kernels/lean/.lake/**') }}
          restore-keys: |
            lake-v1-nucleus-econ-kernels-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/nucleus-econ-kernels/lean/lean-toolchain', 'crates/nucleus-econ-kernels/lean/lake-manifest.json', 'crates/nucleus-econ-kernels/lean/lakefile.lean') }}-${{ github.job }}-
            lake-v1-nucleus-econ-kernels-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/nucleus-econ-kernels/lean/lean-toolchain', 'crates/nucleus-econ-kernels/lean/lake-manifest.json', 'crates/nucleus-econ-kernels/lean/lakefile.lean') }}-

      # Mathlib-free project: install elan directly (the repo's established
      # pattern — see aeneas.yml / aeneas-ifc-scoped.yml) and run `lake build`.
      # No mathlib cache fetch needed; the whole tree builds in seconds.
      - name: Build Lean project with cached artifacts
        if: steps.scope.outputs.relevant == 'true'
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        env:
          LEAN_NUM_THREADS: "4"
        with:
          lake-package-directory: crates/nucleus-econ-kernels/lean
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"

      # Only reached when the build above succeeded, so a failed build never
      # becomes the next run's starting point.
      - name: Save Lake build output
        if: ${{ steps.scope.outputs.relevant == 'true' && github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/nucleus-econ-kernels/lean/.lake
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}

      - name: Ban sorry / native_decide in econ Lean
        if: steps.scope.outputs.relevant == 'true'
        run: |
          # Non-vacuity: this gate is a grep, and a grep over a path that no
          # longer matches exits non-zero, takes the else branch, and prints the
          # success line having scanned NOTHING. rubric-lean and ck-policy-lean
          # carry this floor; this one was missing it (inventory, 2026-09-05).
          FILES=$(find crates/nucleus-econ-kernels/lean/Nucleus -name '*.lean' | wc -l | tr -d ' ')
          if [ "$FILES" -lt 1 ]; then
            echo "::error::no .lean files under crates/nucleus-econ-kernels/lean/Nucleus — the econ sorry-ban scanned nothing."
            exit 1
          fi
          # Match the tactic/term forms (`:= sorry`, `:= by sorry`, a lone `sorry`,
          # or `native_decide`) — NOT the word "sorry" in "0 sorry" doc comments.
          if grep -rnE \
               '(:=[[:space:]]*by[[:space:]]+sorry|:=[[:space:]]*sorry|^[[:space:]]*sorry$|native_decide)' \
               --include='*.lean' crates/nucleus-econ-kernels/lean/Nucleus; then
            echo "ERROR: econ Lean uses 'sorry' (proof hole) or 'native_decide' (banned)."
            exit 1
          fi
          echo "No sorry / native_decide — econ proofs are complete and kernel-checked."

      - name: Per-theorem axiom audit (every declaration under Nucleus)
        if: steps.scope.outputs.relevant == 'true'
        # Replaces the hand-listed `#print axioms` grep for `sorryAx` (#2567): the
        # audit walks EVERY declaration the compiled oleans define, allows only
        # propext / Classical.choice / Quot.sound, tolerates native_decide per
        # theorem via crates/nucleus-econ-kernels/lean/.axiom-audit-exceptions, guards a positive count
        # against the sources, and ratchets top-level `axiom` declarations.
        run: scripts/lean-axiom-audit.sh crates/nucleus-econ-kernels/lean Nucleus
      - name: The axiom audit goes red on axiom / admit / native_decide fixtures
        if: steps.scope.outputs.relevant == 'true'
        run: scripts/lean-axiom-audit.sh crates/nucleus-econ-kernels/lean --self-test
      # Second kernel pass (#2592): leanchecker reads back every proven-tier .olean
      # this job just built and replays its constants through the kernel again —
      # --fresh (Init included, nothing trusted) on a Mathlib-free tier, from imports
      # on a Mathlib one. Tier, modules and mode are derived from this workflow's
      # Lean-action build, the lakefile and the lake manifest; a run that replays
      # nothing is red, not green.
      - name: leanchecker replays the proven tier (second kernel pass)
        if: steps.scope.outputs.relevant == 'true'
        run: cargo run -q -p xtask -- lean-replay --workflow .github/workflows/econ-lean.yml
      - name: The replay goes red on a forged proof term (and green on its sound twin)
        if: steps.scope.outputs.relevant == 'true'
        run: cargo run -q -p xtask -- lean-replay --self-test crates/nucleus-econ-kernels/lean

      - name: Golden-vector sync (regenerate Golden.lean from JSON, assert no drift)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          bash scripts/gen-golden-lean.sh
          if ! git diff --exit-code crates/nucleus-econ-kernels/lean/Nucleus/Golden.lean; then
            echo "ERROR: Golden.lean is stale vs tests/golden/*.json."
            echo "Run: bash scripts/gen-golden-lean.sh && commit the result."
            exit 1
          fi
          echo "Golden.lean is in sync with the JSON single-source."

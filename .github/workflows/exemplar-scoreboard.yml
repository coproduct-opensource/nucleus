name: exemplar-scoreboard

# The MECHANICAL layer of the "top-1% exemplar" instrument. Computes exact,
# greppable cross-domain metrics (formal verification / Rust craft / sandboxing /
# category theory) and RATCHETS them against a committed baseline:
#   - lower-is-better metrics may not increase (no new permissive verify, no new
#     vacuous Lean, no new mediation drift, ...);
#   - higher-is-better metrics may not decrease (extraction, lints adoption);
#   - *_GUARD metrics may not drop — the anti-Goodhart pairing (you can't cut
#     `permissive_verify` by deleting the verifier: `verify_calls_GUARD` would
#     fall; you can't cut `vacuous_lean` by deleting theorems: `lean_theorems_GUARD`
#     would fall).
# Fast (grep only, no cargo/lake build). The judgment-level gaps grep can't see
# (real-vs-decorative, overclaim) are caught by the periodic adversarial workflow,
# which also RECALIBRATES these metrics — grep measures, the panel re-tunes the ruler.

# Unfiltered and reported in the merge queue: this is a REQUIRED context
# (ci/required-checks.txt). A paths filter would need a -noop twin; the run
# is a grep pass plus one small crate, so it runs everywhere instead.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  # Supersede a PR's older in-flight runs; NEVER cancel anything else.
  # cancel-in-progress is scoped to pull_request on purpose: cancelling a
  # merge_group run would abort a queue entry mid-flight, and cancelling a
  # push to main would drop the signal for a commit that already landed.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scoreboard:
    name: exemplar metrics ratchet
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: ${{ runner.environment == 'github-hosted' }}

      # The frontier: every canonical profile's real lattice replayed over the
      # in-tree corpus through the kernel's live decision path. Built first so
      # the scoreboard embeds it; its share is HIGHER-is-better and its guards
      # (corpus size, exfil refusals) may not fall.
      - name: Compute the frontier (utility under authorization)
        # stderr dropped: a debug build prints the kernel's per-decision
        # obligation diagnostic for every replayed step (thousands of lines).
        run: cargo run -q -p nucleus-flow-replay -- --frontier-corpus crates/nucleus-flow-replay/corpus/corpus.jsonl --out frontier.json 2>/dev/null

      - name: Compute scoreboard
        run: bash scripts/exemplar-scoreboard.sh scoreboard.json

      # The ratchet was the last `python3` heredoc on the gate path; it is now
      # `cargo xtask scoreboard-ratchet` (crates/xtask/src/scoreboard.rs), with
      # the same LOWER/HIGHER/_GUARD rules, unit-tested, a non-vacuity floor
      # (fewer than three shared metrics is a red, not a pass), a red on any
      # pinned metric that vanished, and SAME-CHANGE pinning: an improvement
      # not re-pinned in scripts/exemplar-baseline.json in the same change is
      # a red, not a notice — slack is what made the ratchet advisory.
      - name: Ratchet against baseline (with anti-Goodhart guards)
        run: cargo run -q -p xtask -- scoreboard-ratchet --current scoreboard.json --baseline scripts/exemplar-baseline.json
      - name: Publish the scoreboard and frontier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exemplar-scoreboard
          path: |
            scoreboard.json
            frontier.json

name: exemplar-scoreboard

# The MECHANICAL layer of the "top-1% exemplar" instrument. Computes exact,
# greppable cross-domain metrics (formal verification / Rust craft / sandboxing /
# category theory) and RATCHETS them against a committed baseline:
#   - lower-is-better metrics may not increase (no new permissive verify, no new
#     vacuous Lean, no new mediation drift, ...);
#   - higher-is-better metrics may not decrease (extraction, lints adoption);
#   - *_GUARD metrics may not drop — the anti-Goodhart pairing (you can't cut
#     `permissive_verify` by deleting the verifier: `verify_calls_GUARD` would
#     fall; you can't cut `vacuous_lean` by deleting theorems: `lean_theorems_GUARD`
#     would fall).
# Fast (a parse of the tree; no cargo/lake build of the measured crates). The
# judgment-level gaps grep can't see (real-vs-decorative, overclaim) are caught
# by the periodic adversarial workflow, which also RECALIBRATES these metrics:
# grep measures, the panel re-tunes the ruler.

on:
  push:
    branches: [main]
    paths: ['**/*.rs', '**/*.lean', '**/Cargo.toml', 'scripts/exemplar-baseline.json']
  # REQUIRED since 2026-10-02 (owner decision), so the pull_request trigger is
  # UNFILTERED and `merge_group:` is present. A required context must be
  # reported on every PR and on every queue group: a path filter here would
  # leave a docs-only PR waiting forever, and without `merge_group:` the queue
  # never sees the context. The filter was dropped rather than paired with a
  # `-noop` twin because the job is cheap (tree parsing + one small xtask build) and a
  # twin is a second copy of the path list (G: one decider per fact).
  #
  # Why it is required at all: the ratchet merged red on 2026-10-02, and the
  # required `Gates must fail on their own subject` re-runs every gate before
  # perturbing it, so one advisory red on main failed every later merge group.
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  # Supersede a PR's older in-flight runs; NEVER cancel anything else.
  # cancel-in-progress is scoped to pull_request on purpose: cancelling a
  # merge_group run would abort a queue entry mid-flight, and cancelling a
  # push to main would drop the signal for a commit that already landed.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scoreboard:
    name: exemplar metrics ratchet
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Required, so it must fit the merge queue's check budget (CI-I7).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: ${{ runner.environment == 'github-hosted' }}
      # Measure and decide in ONE command, so the two cannot run on different
      # trees. The measurement was scripts/exemplar-scoreboard.sh; it is now
      # crates/xtask/src/exemplar_scoreboard.rs, which also excludes a
      # `#[cfg(test)] mod x;` whose body is in another file (#3146). The ratchet
      # (crates/xtask/src/scoreboard.rs) keeps the LOWER/HIGHER/_GUARD rules and
      # its non-vacuity floor (fewer than three shared metrics is a red).
      - name: Measure, then ratchet against baseline (with anti-Goodhart guards)
        run: cargo run -q -p xtask -- scoreboard-ratchet --baseline scripts/exemplar-baseline.json

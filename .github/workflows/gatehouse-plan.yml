# gatehouse plan check — INFORMATIONAL (not a required context).
#
# .gatehouse/pipeline.writ is this repository's proof-carrying pipeline: every gate with its
# inputs as scope globs, a pinned environment, a hermetic capability, its command and timeout,
# and an admissibility proof (acyclic, hermetic, inside the policy ceiling, required gates
# covered, inside the queue budget) that `gate plan check` elaborates and kernel-checks.
# gatehouse is a private repository, so the check runs only when the GATEHOUSE_TOKEN secret
# exists (a fine-grained token with contents:read on coproduct-private/gatehouse); without it
# the job says so and passes, because it decides nothing yet. It becomes a gate when the
# gatehouse executor and queue take over (milestone 5 of the gatehouse plan).
name: gatehouse plan

on:
  push:
    branches: [main]
    paths:
      - ".gatehouse/**"
      - ".github/workflows/gatehouse-plan.yml"
  pull_request:
    paths:
      - ".gatehouse/**"
      - ".github/workflows/gatehouse-plan.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan-check:
    name: The pipeline elaborates and its admissibility proof checks (gatehouse, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      body: ${{ steps.body.outputs.built }}
      gate: ${{ steps.tok.outputs.present }}
    env:
      # The gatehouse commit whose `gate` checks the plan. Two things must move WITH it,
      # and `cargo xtask gatehouse-pin` now refuses the change if either does not:
      #   * .gatehouse/pipeline.writ's import digest -- this ref's prelude/ci.writ hash;
      #   * gatehouse-shadow.yml's GATEHOUSE_REF -- a shadow built from a different
      #     gatehouse than the plan check compares two things that were never the same.
      # Moved 4d42510 -> 7326bfa9 (a descendant) on 2026-09-10 to close a skew that had
      # gone unnoticed because nothing compared the two workflows.
      #
      # Moved 7326bfa9 -> 89f7acc on 2026-09-12, for the runner deadlock (gatehouse F-100)
      # that hung every shadow job for 45 minutes. That ref also changed the PRELUDE, and
      # the change was not free: `ci.Gate` gained an appended `image` field and
      # `admissible_b` gained a `pinned_b` conjunct, so all five gates in
      # .gatehouse/pipeline.writ and .gatehouse/gates/*.json had to carry a PULLABLE image
      # reference before the plan would typecheck again. Ours were a bare `sha256:<hex>`,
      # which pins the right bytes, names no repository, and no kubelet can pull — so those
      # five gates could never have run. A pin bump that only moved the ref would have
      # failed the plan check, which is the gate working.
      #
      # Moved 067869b -> 0d7a8e6 on 2026-09-30 for per-platform pins (gatehouse#206, merged as
      # a86048b; 0d7a8e6 is gatehouse main after #208, #209, #211 and #214): the plan names the
      # gate-tools image for the arm64 lane AND the x86_64 lane, `ci.toolsPinned_b` holds each lane
      # to its own, and `ci.platformMatches_b` is an EQUALITY with each gate's `platform`, so the
      # pins never widen where a gate runs. That prelude also carries gatehouse #81, which nucleus
      # had not taken: the policy stops describing a machine (see the comment above `policy` in
      # .gatehouse/pipeline.writ). An earlier draft pinned #206's pre-merge head, 502d787, whose
      # prelude let the pins widen `platformMatches_b`; the merged prelude hashes differently.
      #
      # Moved 0d7a8e6 -> efa1e1a on 2026-10-05 for scope excludes (gatehouse#261) and
      # `scope witness --check` (gatehouse#263), which the test shards need: test-libs's scope is
      # `crates/**` minus the node crates, and the kernel derives it only in that form. The prelude
      # appended a field to `ci.Gate` (`exclude`), so every gate in .gatehouse/pipeline.writ gained
      # a trailing `[] : Bytes`; the gate JSON already carried `scope.exclude`, so no gate's
      # definition hash moved. `test-shards --check --gate` now runs below.
      GATEHOUSE_REF: efa1e1a2e7ecd5e3de051c45223d8ef982d79721
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Unconditional: it reads `.gatehouse/gates/*.json` against the committed elaboration and
      # needs no gatehouse checkout, so it is the one part of this workflow that still decides
      # when the token is absent. `plan check` below proves the PLAN admissible and never opens
      # the JSON that `put_plan` actually uploads, so a disagreement between them is invisible to
      # every other gate here.
      - name: The gate definitions carry what the plan declares
        run: ./scripts/check-gate-defs-match-plan.sh
      # The test suite as two scope shards (.gatehouse/test-shards.toml). Not live yet: the plan
      # cannot declare them until it imports a gatehouse prelude whose Gate carries `exclude`, so
      # they are generated into .gatehouse/shards/ and this only keeps the generation honest.
      # `--gate` (refuse a scope the writ kernel does not derive) joins when GATEHOUSE_REF reaches
      # a gatehouse whose `scope witness` has `--check`.
      - name: The test shards are what the layout generates
        run: cargo run -q -p xtask -- test-shards --check
      - name: Is the gatehouse token available?
        id: tok
        env:
          T: ${{ secrets.GATEHOUSE_TOKEN }}
        run: |
          if [ -n "$T" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GATEHOUSE_TOKEN is not set: the plan check cannot look (informational; see the header of this workflow)"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tok.outputs.present == 'true'
        with:
          repository: coproduct-private/gatehouse
          ref: ${{ env.GATEHOUSE_REF }}
          token: ${{ secrets.GATEHOUSE_TOKEN }}
          path: gatehouse
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: steps.tok.outputs.present == 'true'
        with:
          cache: false
          # Do not lint a foreign checkout. This action defaults `rustflags: -D warnings` and
          # exports it through $GITHUB_ENV, where it applies to the gatehouse build too — and
          # `-D warnings` implies `-D missing-docs`, which stops that build dead. It also leaked
          # into the runner as an undeclared environment input, which is the very thing a shadow
          # gate exists to notice. The GitHub-side commands carry their own denial where they
          # need it (the clippy gate passes `-D warnings` on its own command line).
          rustflags: ''
      - name: The two pins agree (before spending three minutes on a build)
        if: steps.tok.outputs.present == 'true'
        # GATEHOUSE_REF and the plan's import digest are one fact written twice, and the
        # env comment above has always SAID they must match. Saying it is not checking it:
        # bumping either alone makes `gate plan check` fail with `no library for import`
        # about three minutes into the cargo build below. This decides the same thing from
        # the three declarations in milliseconds, and it also refuses a gatehouse checkout
        # that is not AT the pinned ref -- reading the mismatch from the wrong side is how
        # a working pin gets mistaken for a stale one (gatehouse FINDINGS.md F-21).
        run: cargo run -q -p xtask -- gatehouse-pin --gatehouse gatehouse

      - name: gate plan check .gatehouse/pipeline.writ
        if: steps.tok.outputs.present == 'true'
        run: |
          cargo build --locked --manifest-path gatehouse/Cargo.toml -p gate
          gatehouse/target/debug/gate plan check .gatehouse/pipeline.writ

      # The derivation check runs in its OWN job (`scope-derivation`, below), from this `gate`.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: gatebin
        if: steps.tok.outputs.present == 'true'
        with:
          name: gate-bin
          path: gatehouse/target/debug/gate
          retention-days: 1

      # The committed elaboration is only worth comparing against while it still IS the
      # elaboration. Re-running `gate plan gates` at the pinned ref and refusing any difference is
      # the half that genuinely needs the gatehouse checkout; the comparison against the gate
      # definitions needs no checkout and runs above, unconditionally.
      - name: The committed elaboration is what the plan elaborates to
        if: steps.tok.outputs.present == 'true'
        # `bash -e {0}`, which a bare `run:` gets, has no pipefail: `gate plan gates` could fail
        # and `python3` still succeed, and the diff would then compare the committed elaboration
        # against an empty document and pass. `xtask pipefail` caught exactly that here.
        shell: bash
        run: |
          gatehouse/target/debug/gate plan gates .gatehouse/pipeline.writ \
            | python3 -c 'import json,sys; json.dump(json.load(sys.stdin), sys.stdout, indent=2, sort_keys=True); print()' \
            > /tmp/plan-gates.json
          if ! diff -u .gatehouse/plan-gates.json /tmp/plan-gates.json; then
            echo "::error::.gatehouse/plan-gates.json is stale — regenerate it with 'gate plan gates .gatehouse/pipeline.writ'"
            exit 1
          fi
          echo "OK: the committed elaboration matches the plan"

      # A push to main SETS the plan gatehouse serves; until this step, an operator did it by hand.
      # Nothing did, for days: nucleus#3234 re-pinned the seeds on 2026-10-05 and gatehouse kept
      # serving the plan two seed bumps old, so every gate's test step recompiled 103 registry
      # crates against the stale seed (446 s against ~140 s). The body is built HERE, where the
      # gatehouse checkout and the `gate` that just proved the plan already are, and sent by the
      # job below, which holds the OIDC token and runs nothing from this repository.
      - name: The plan body this push serves
        id: body
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tok.outputs.present == 'true'
        run: |
          scripts/gatehouse-plan-body.py . gatehouse/target/debug/gate > "$RUNNER_TEMP/plan-body.json"
          python3 -c 'import json,sys; b=json.load(open(sys.argv[1])); print("plan", b["plan"], "gates", [g["name"] for g in b["gates"]])' "$RUNNER_TEMP/plan-body.json"
          echo "built=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.body.outputs.built == 'true'
        with:
          name: plan-body
          path: ${{ runner.temp }}/plan-body.json
          retention-days: 7

  # WHETHER EACH SHARD'S SCOPE DERIVES: a check of its own, which the plan upload does not wait on.
  #
  # A shard whose scope the kernel stops deriving still runs and still goes green, but its
  # receipts never cross a tree, so sharding costs an attempt and saves nothing. A few new files
  # can push a scope over the derivation caps, and nothing else would say so, so this must stay
  # red when it happens. It must NOT block the upload, though. Until 2026-10-07 it was a step of
  # plan-check, so when test-libs crossed MAX_ROWS (4,199,962 reduction rows against 4,194,304)
  # after #3278, plan-check failed and the upload was skipped. Production kept serving the
  # previous plan while main declared another (gatehouse F-208). A scope that does not derive
  # costs REUSE, never correctness: the receipts it produces are still verified, only at their
  # own tree. The mandate's tie-break (a weaker verdict says so on its face) is met by this job
  # going red. Holding back a plan the kernel admitted would be weaker in the direction that
  # matters, because it leaves the served plan wrong.
  scope-derivation:
    name: Shard scopes derive under the writ kernel (reuse only; does not block the plan)
    needs: plan-check
    if: needs.plan-check.outputs.gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gate-bin
          path: ${{ runner.temp }}/gate-bin
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          rustflags: ''
      - name: Both test shards' scopes derive (and the clippy groups')
        run: |
          chmod +x "$RUNNER_TEMP/gate-bin/gate"
          cargo run -q -p xtask -- test-shards --check --gate "$RUNNER_TEMP/gate-bin/gate"

  plan-upload:
    name: A push to main sets the plan gatehouse serves
    needs: plan-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan-check.outputs.body == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only credential is this run's OIDC token. gatehouse's `PUT /v1/github/oidc/plan` takes
    # it in place of a bearer and refuses anything but a `push` to refs/heads/main of a repository
    # an App installation binds, and any run older than the one that last set the plan (two
    # merges racing). A pull request's run cannot set the plan: it is not a push to main.
    permissions:
      id-token: write
    env:
      CONTROLD: https://controld.gatehouse.coproduct.one
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: plan-body
          path: ${{ runner.temp }}
      - name: PUT the plan
        # No retry on a refusal: 403/404/409/422 are answers, not weather. 409 is the right
        # outcome when a later push already set its plan, so it passes with a notice.
        run: |
          python3 - "$RUNNER_TEMP/plan-body.json" <<'PY'
          import json, os, sys, urllib.error, urllib.parse, urllib.request
          url, aud = os.environ["CONTROLD"] + "/v1/github/oidc/plan", os.environ["CONTROLD"]
          req = urllib.request.Request(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=" + urllib.parse.quote(aud, safe=""),
              headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(req, timeout=30))["value"]
          body = json.load(open(sys.argv[1]))
          body["id_token"] = token
          put = urllib.request.Request(url, data=json.dumps(body).encode(), method="PUT",
                                       headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(put, timeout=60) as r:
                  print(f"plan set: {r.read().decode()}")
          except urllib.error.HTTPError as e:
              msg = e.read().decode()
              if e.code == 409:
                  print(f"::notice::a later push already set the plan: {msg}")
                  sys.exit(0)
              print(f"::error::gatehouse refused the plan (HTTP {e.code}): {msg}")
              sys.exit(1)
          PY

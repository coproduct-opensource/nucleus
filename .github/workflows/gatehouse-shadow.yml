# gatehouse shadow mode — INFORMATIONAL (not a required context).
#
# Runs this repository's CHEAP gates (fmt, clippy, ci-spec; test-core and lean-build are defined
# in .gatehouse/gates too but an hour of tests and a Lean build are the executor's job) through
# the one-step gatehouse action (.github/actions/gatehouse): the scope materialized from HEAD,
# the declared environment, the command under its timeout, a receipt signed by a key this run
# alone holds, pushed to the hosted log and verified here against the tenant's trust and the
# proof that came back, then the same command run plainly and the agreement line. The run's
# identity is its OIDC token (no secret of ours); the binaries come from a gatehouse build in
# this job while the public release does not exist yet (`bin-dir`), which is why the private
# checkout and its token are still here. It never fails on disagreement — only when the loop
# itself errors, which includes the control plane refusing the exchange (deploy it with
# GATEHOUSE_ACTIONS_CA_KEY first; docs/ops/fly.md in gatehouse).
name: gatehouse shadow

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

jobs:
  shadow:
    # The name says what a RED means, because this check never fails on
    # disagreement — only when the loop could not run at all. Named "agrees
    # with the GitHub check", sixteen red shadows on 2026-09-11 read as sixteen
    # disagreements when every one of them meant "could not look". gatehouse's
    # verifier is three-valued (Verified / Refuted / CouldNotLook) and a GitHub
    # check has two states, so the name is the only place that distinction can
    # survive. ADR 0007 A-2: "I could not look" is never "I looked and it was
    # fine" — and it is not "I looked and it was wrong" either.
    name: "The ${{ matrix.gate }} gate, run the gatehouse way (shadow, informational; red = could not look, never disagreement)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: fmt
            github: cargo fmt --all -- --check
            components: rustfmt
            scope: |
              Cargo.toml
              Cargo.lock
              rust-toolchain.toml
              crates/**
              tests/**
              benchmarks/**
          - gate: clippy
            github: cargo clippy --all-targets --all-features -- -D warnings
            components: clippy
            scope: |
              Cargo.toml
              Cargo.lock
              rust-toolchain.toml
              crates/**
              tests/**
              benchmarks/**
          - gate: ci-spec
            github: scripts/check-ci-spec.sh
            components: rustfmt
            scope: |
              Cargo.toml
              Cargo.lock
              rust-toolchain.toml
              .github/workflows/**
              ci/**
              crates/ci-spec/**
              scripts/check-ci-spec.sh
    env:
      GATEHOUSE_REF: 7326bfa9ea3f490c20bb406941527ac0484410c5
      GATE_NAME: ${{ matrix.gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is the gatehouse token available?
        id: tok
        env:
          T: ${{ secrets.GATEHOUSE_TOKEN }}
        run: |
          if [ -n "$T" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GATEHOUSE_TOKEN is not set: shadow mode cannot look (informational; see the header of this workflow)"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tok.outputs.present == 'true'
        with:
          repository: coproduct-private/gatehouse
          ref: ${{ env.GATEHOUSE_REF }}
          token: ${{ secrets.GATEHOUSE_TOKEN }}
          path: gatehouse
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        if: steps.tok.outputs.present == 'true'
        with:
          components: ${{ matrix.components }}
          cache: false
          # Do not lint a foreign checkout. This action defaults `rustflags: -D warnings` and
          # exports it through $GITHUB_ENV, where it applies to the gatehouse build too — and
          # `-D warnings` implies `-D missing-docs`, which stops that build dead. It also leaked
          # into the runner as an undeclared environment input, which is the very thing a shadow
          # gate exists to notice. The GitHub-side commands carry their own denial where they
          # need it (the clippy gate passes `-D warnings` on its own command line).
          rustflags: ''
      - name: Build gate and gatehouse-runner
        if: steps.tok.outputs.present == 'true'
        run: cargo build --locked --manifest-path gatehouse/Cargo.toml -p gate -p gatehouse-runner
      - name: The gate, the gatehouse way, verified against the hosted log
        if: steps.tok.outputs.present == 'true'
        id: gh
        uses: ./.github/actions/gatehouse
        with:
          run: ${{ matrix.github }}
          name: ${{ matrix.gate }}
          scope: ${{ matrix.scope }}
          # STRICTLY BELOW the job's 45 minutes, and that is the whole point.
          # It was 2700 — the same 2,700 seconds as `timeout-minutes: 45` — so
          # the runner's own deadline could never fire first: a hung gate could
          # only ever end as a cancelled job, with no receipt, no log and
          # nothing saying why. Measured 2026-09-11, when a deadlock in the
          # runner (gatehouse F-100) did exactly that on sixteen open pull
          # requests. A gate's own timeout must fire before its job is killed,
          # or the gate cannot report its own failure.
          #
          # Fitting the declaration is necessary and was NOT sufficient, and I claimed it would
          # be. Run 34637222980 carried this 1200 and the gate step still ran 44m35s and was
          # still killed by the job's cap with no verdict: `duration_ms=2675520` against
          # `2676029` for the original 2700 run — half a second apart. The runner does not
          # enforce its own timeout, so no value declared HERE makes it report. That is why
          # the budget is also enforced by the caller in `.github/actions/gatehouse` — the
          # declaration says what the bound is, the action is what makes it bite.
          #
          # 2100 -> 1200 for arithmetic the declarations already contain: `compare` defaults
          # true, so the command runs a second time for the agreement line, and the job must
          # hold 2 x timeout + setup rather than one. At 2100 that is 4260s inside a 2700s
          # job, which fails exactly the way 2700 did, one run later. 1200 x2 + 60 = 2460s
          # fits. `cargo xtask gate-budget` decides this and reds on 2100.
          #
          # If the agreement line is worth more than the second run's deadline, the other
          # answer is `compare: false` for this entry and 2100 stands — a judgement about what
          # shadow mode is for, and it belongs to whoever set 2100.
          timeout: "1200"
          bin-dir: gatehouse/target/debug
          control-url: ${{ vars.GATEHOUSE_CONTROL_URL || 'https://gatehouse-controld.fly.dev' }}
      - name: The agreement line
        if: steps.tok.outputs.present == 'true'
        env:
          GATE_NAME: ${{ matrix.gate }}
          VERDICT: ${{ steps.gh.outputs.verdict }}
          VERIFIED: ${{ steps.gh.outputs.verified }}
          AGREE: ${{ steps.gh.outputs.agree }}
          INDEX: ${{ steps.gh.outputs.receipt_index }}
          TENANT: ${{ steps.gh.outputs.tenant }}
        run: |
          LINE="shadow: gate=$GATE_NAME gatehouse=$VERDICT verified=$VERIFIED agree=$AGREE receipt=$INDEX tenant=$TENANT"
          echo "$LINE"
          echo "$LINE" >> "$GITHUB_STEP_SUMMARY"

name: IFC Kernel Lean Proofs
# Elaborates crates/nucleus-ifc-kernel/lean (the DerivationClass join-semilattice
# laws and no-silent-cleansing in Ifc/Lattice.lean) and audits every declaration's
# axioms. Before #2564 no workflow built this package: the lean_lib coverage gate
# counted `@[default_target]` as "built" although nothing ever ran a bare
# `lake build` there, so its 19 theorems were never elaborated in CI.
#
# Twin: ifc-lean-noop.yml reports the same job name for PRs that do not touch
# these paths, so the job can be a required status check.

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/check-lean-external-state.py"
      - "scripts/lean-axiom-audit.sh"
      - "crates/nucleus-ifc-kernel/lean/**"
      - ".github/workflows/ifc-lean.yml"
      - "scripts/lean-axiom-audit.sh"
      - "crates/xtask/src/lean_replay/**"
      - "crates/xtask/src/lean_action_builds.rs"
  pull_request:
    paths:
      - "scripts/check-lean-external-state.py"
      - "scripts/lean-axiom-audit.sh"
      - "crates/nucleus-ifc-kernel/lean/**"
      - ".github/workflows/ifc-lean.yml"
      - "scripts/lean-axiom-audit.sh"
      - "crates/xtask/src/lean_replay/**"
      - "crates/xtask/src/lean_action_builds.rs"
  merge_group:
  workflow_dispatch:

concurrency:
  group: ifc-lean-real-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ifc-lean:
    name: lake build Ifc (DerivationClass lattice + no-silent-cleansing)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # GitHub ignores `paths:` for merge_group events, so the scope is
      # re-implemented here as a regex over the group's diff (ci/merge-group-
      # scope-parity.sh asserts the two agree).
      - name: Is this change in scope?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
          PATTERN: '^crates/nucleus-ifc-kernel/lean/|^\.github/workflows/ifc-lean\.yml$|^scripts/lean-axiom-audit\.sh$|^scripts/(check-lean-external-state\.py|lean-axiom-audit\.sh)$|^crates/xtask/src/(lean_replay/|lean_action_builds\.rs$)'
        run: |
          set -euo pipefail
          if [ "$EVENT" != "merge_group" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT: GitHub's own paths: filter already applied."
            exit 0
          fi
          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "merge_group with no base/head sha — running to be safe."
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE "$PATTERN"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "in scope — running."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no file in this merge group matches $PATTERN — skipping the"
            echo "expensive steps. This job still reports, so it remains usable"
            echo "as a required status check."
          fi

      # Reuse the previous run's Lake output. Lake decides freshness by content-hash
      # traces, not mtimes, so an older .lake is sound: what changed rebuilds, the
      # rest replays. Saved from main only (a merge-group or PR cache is visible to
      # that ref alone). A miss or a failed restore costs time, never a verdict.
      - name: Restore Lake build output
        id: lake-cache
        if: steps.scope.outputs.relevant == 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "5"
        with:
          path: |
            crates/nucleus-ifc-kernel/lean/.lake
          key: lake-v1-nucleus-ifc-kernel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/nucleus-ifc-kernel/lean/lean-toolchain', 'crates/nucleus-ifc-kernel/lean/lake-manifest.json', 'crates/nucleus-ifc-kernel/lean/lakefile.lean') }}-${{ github.job }}-${{ hashFiles('crates/nucleus-ifc-kernel/lean/**/*.lean', '!crates/nucleus-ifc-kernel/lean/.lake/**') }}
          restore-keys: |
            lake-v1-nucleus-ifc-kernel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/nucleus-ifc-kernel/lean/lean-toolchain', 'crates/nucleus-ifc-kernel/lean/lake-manifest.json', 'crates/nucleus-ifc-kernel/lean/lakefile.lean') }}-${{ github.job }}-
            lake-v1-nucleus-ifc-kernel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/nucleus-ifc-kernel/lean/lean-toolchain', 'crates/nucleus-ifc-kernel/lean/lake-manifest.json', 'crates/nucleus-ifc-kernel/lean/lakefile.lean') }}-

      - name: Build Lean project with cached artifacts
        if: steps.scope.outputs.relevant == 'true'
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        env:
          LEAN_NUM_THREADS: "4"
        with:
          lake-package-directory: crates/nucleus-ifc-kernel/lean
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"

      # Only reached when the build above succeeded, so a failed build never
      # becomes the next run's starting point.
      - name: Save Lake build output
        if: ${{ steps.scope.outputs.relevant == 'true' && github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/nucleus-ifc-kernel/lean/.lake
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}

      - name: Per-theorem axiom audit (every declaration under Ifc)
        if: steps.scope.outputs.relevant == 'true'
        run: scripts/lean-axiom-audit.sh crates/nucleus-ifc-kernel/lean Ifc

      - name: The axiom audit goes red on axiom / admit / native_decide fixtures
        if: steps.scope.outputs.relevant == 'true'
        run: scripts/lean-axiom-audit.sh crates/nucleus-ifc-kernel/lean --self-test
      # Second kernel pass (#2592): leanchecker reads back every proven-tier .olean
      # this job just built and replays its constants through the kernel again —
      # --fresh (Init included, nothing trusted) on a Mathlib-free tier, from imports
      # on a Mathlib one. Tier, modules and mode are derived from this workflow's
      # Lean-action build, the lakefile and the lake manifest; a run that replays
      # nothing is red, not green.
      - name: leanchecker replays the proven tier (second kernel pass)
        if: steps.scope.outputs.relevant == 'true'
        run: cargo run -q -p xtask -- lean-replay --workflow .github/workflows/ifc-lean.yml
      - name: The replay goes red on a forged proof term (and green on its sound twin)
        if: steps.scope.outputs.relevant == 'true'
        run: cargo run -q -p xtask -- lean-replay --self-test crates/nucleus-ifc-kernel/lean

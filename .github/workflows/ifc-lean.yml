name: IFC Kernel Lean Proofs
# Elaborates crates/nucleus-ifc-kernel/lean (the DerivationClass join-semilattice
# laws and no-silent-cleansing in Ifc/Lattice.lean) and audits every declaration's
# axioms. Before #2564 no workflow built this package: the lean_lib coverage gate
# counted `@[default_target]` as "built" although nothing ever ran a bare
# `lake build` there, so its 19 theorems were never elaborated in CI.
#
# Twin: ifc-lean-noop.yml reports the same job name for PRs that do not touch
# these paths, so the job can be a required status check.

on:
  push:
    branches: ["main"]
    paths:
      - "crates/nucleus-ifc-kernel/lean/**"
      - ".github/workflows/ifc-lean.yml"
      - "scripts/lean-axiom-audit.sh"
  pull_request:
    paths:
      - "crates/nucleus-ifc-kernel/lean/**"
      - ".github/workflows/ifc-lean.yml"
      - "scripts/lean-axiom-audit.sh"
  merge_group:
  workflow_dispatch:

concurrency:
  group: ifc-lean-real-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ifc-lean:
    name: lake build Ifc (DerivationClass lattice + no-silent-cleansing)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # GitHub ignores `paths:` for merge_group events, so the scope is
      # re-implemented here as a regex over the group's diff (ci/merge-group-
      # scope-parity.sh asserts the two agree).
      - name: Is this change in scope?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
          PATTERN: '^crates/nucleus-ifc-kernel/lean/|^\.github/workflows/ifc-lean\.yml$|^scripts/lean-axiom-audit\.sh$'
        run: |
          set -euo pipefail
          if [ "$EVENT" != "merge_group" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT: GitHub's own paths: filter already applied."
            exit 0
          fi
          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "merge_group with no base/head sha — running to be safe."
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE "$PATTERN"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "in scope — running."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no file in this merge group matches $PATTERN — skipping the"
            echo "expensive steps. This job still reports, so it remains usable"
            echo "as a required status check."
          fi

      - name: Build Lean project with cached artifacts
        if: steps.scope.outputs.relevant == 'true'
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        env:
          LEAN_NUM_THREADS: "4"
        with:
          lake-package-directory: crates/nucleus-ifc-kernel/lean
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "${{ runner.environment == 'github-hosted' }}"

      - name: Per-theorem axiom audit (every declaration under Ifc)
        if: steps.scope.outputs.relevant == 'true'
        run: scripts/lean-axiom-audit.sh crates/nucleus-ifc-kernel/lean Ifc

      - name: The axiom audit goes red on axiom / admit / native_decide fixtures
        if: steps.scope.outputs.relevant == 'true'
        run: scripts/lean-axiom-audit.sh crates/nucleus-ifc-kernel/lean --self-test

name: Kani BMC

on:
  push:
    branches: ["main"]
    paths:
      - "crates/portcullis/src/**"
      - "crates/ck-*/src/**"
      - "crates/nucleus-ifc-kernel/src/**"
      - "crates/portcullis-core/**"
      - "crates/nucleus-econ-kernels/**"
      - "scripts/kani-bounded.sh"
      - ".kani-minimum-proofs"
      - ".github/workflows/kani-nightly.yml"
  pull_request:
    paths:
      - "crates/portcullis/src/**"
      - "crates/ck-*/src/**"
      - "crates/nucleus-ifc-kernel/src/**"
      - "crates/portcullis-core/**"
      - "crates/nucleus-econ-kernels/**"
      - "scripts/kani-bounded.sh"
      - ".kani-minimum-proofs"
      - ".github/workflows/kani-nightly.yml"
  # Bare, unfiltered: the merge queue's own re-validation of the fast-tier
  # jobs (#2430 — required status checks). Not path-filtered like push/
  # pull_request above; kani-nightly-noop.yml is pull_request-only (its own
  # comment explains why merge_group needs no twin).
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  # Supersede a PR's older in-flight runs; NEVER cancel anything else.
  # cancel-in-progress is scoped to pull_request on purpose: cancelling a
  # merge_group run would abort a queue entry mid-flight, and cancelling a
  # push to main would drop the signal for a commit that already landed.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Hosted x86 on purpose for now (#2622): kani-github-action's install step
# fails on the arm64 pods. Do NOT set RUSTC_WRAPPER here, even to "": kani-driver
# execs the wrapper verbatim and an empty one is "No such file or directory".

jobs:
  # Fast tier: 9 lightweight harnesses — runs on every PR and push
  # The 3 normalize_* harnesses use build_ordered_permissions() which creates
  # a massive symbolic state space (24 symbolic capabilities + obligations).
  # They require 15+ minutes each and are verified in the nightly full tier.
  kani-fast:
    name: Kani
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.9.1
        # Hosted only: the self-hosted scale set has persistent registry and
        # sccache mounts, and this action's restore of a hosted x86 cache blob
        # was observed hanging runner jobs for 15+ minutes.
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          cache-on-failure: true
      - name: Cache Kani toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.kani
          # Key on the PINNED Kani version, NOT the workflow file: hashing the
          # whole file re-downloaded the ~1 GB toolchain on every unrelated edit.
          # Bump this suffix together with the `kani-version` input below when
          # upgrading Kani.
          key: kani-toolchain-${{ runner.os }}-kani-0.67.0
      # E1/E2 (proof_budget_ledger_*) are in this list as of #2778's follow-up.
      # They were only ever in the nightly `kani-full` tier, which is
      # schedule/dispatch-only AND is documented at that job as dying at exit
      # 143 before it ever reaches its timeout -- so `sum of live child
      # allocations + consumed <= max` was not actually verified anywhere a PR
      # could see it, while FORMAL_METHODS.md:205 claimed it ran "Every PR".
      # Their cost belongs in this tier: symbolic `u8` amounts over a 4-slot
      # ledger at unwind(8), the same profile as the seven harnesses beside
      # them, not the 15-minute normalize_* shape the header warns about.
      - name: Run Kani (fast harnesses)
        id: verify
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          # Pin the verifier version for reproducible proofs (default is
          # "latest", which silently changes what Kani checks) and to make the
          # toolchain cache key above stable. Bump both together.
          kani-version: "0.67.0"
          args: >-
            -p portcullis
            --solver cadical
            --harness proof_request_ceiling_leq_verified
            --harness proof_capability_distributive
            --harness proof_exposureset_monoid_identity
            --harness proof_exposureset_uninhabitable_iff_count_three
            --harness proof_operation_exposure_completeness
            --harness proof_clinejection_blocked
            --harness proof_ifc_flow_gate_rejects_iff_forbidden
            --harness proof_budget_ledger_conserves
            --harness proof_budget_ledger_release_conserves
      - name: Proof count regression gate
        run: |
          # One census, counted by scripts/check-kani-proof-count.sh (#2561): the
          # inlined grep -rc on a DIRECTORY printed per-file lines, the arithmetic
          # errored, PROOF_COUNT was never set, and the gate passed on "".
          scripts/check-kani-proof-count.sh --strict
      - name: Summary
        if: always()
        env:
          KANI_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          # Report the verifier step, even after failure or cancellation. A
          # source census is not evidence that any harness actually verified.
          {
            echo "## Kani BMC Results (portcullis fast tier)"
            echo ""
            echo "- **Verification step outcome:** ${KANI_OUTCOME:-not run}"
            echo "- **Per-harness results:** see the Run Kani step log."
            echo "- **Solver:** CaDiCaL"
          } >> "$GITHUB_STEP_SUMMARY"

  # Constitutional Kernel (fast): 5 bitmask / lattice proofs. These touch no
  # BTreeSet<String> and never call Kernel::admit, which is why they finish in
  # minutes. The other 12 harnesses are sharded into the nightly matrix below and,
  # as of 2026-08-31, none of them verifies — the dividing line is BTreeSet<String>,
  # not Kernel::admit. See KANI-STATUS.md.
  # The six anti-prompt-injection harnesses in nucleus-ifc-kernel/src/flow.rs
  # (no secret exfiltration, authority confinement, no integrity laundering,
  # propagation monotone ×2, trusted-user allowed) — the claims flow_graph.rs
  # and kernel/ifc.rs are live on. Every other Kani job runs `-p portcullis` or
  # `-p ck-kernel`; until #2563 nothing ran these. All six verify in ~5 s.
  kani-ifc:
    name: "Kani (IFC kernel: anti-prompt-injection flow harnesses)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.9.1
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          cache-on-failure: true
      - name: Cache Kani toolchain
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.kani
          key: kani-toolchain-${{ runner.os }}-kani-0.67.0
      - name: Run Kani (flow.rs harnesses, per-harness timeout)
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"
          # --harness-timeout is unstable in 0.67 (needs -Z unstable-options):
          # a harness that stops terminating fails the job instead of hanging
          # it to the job timeout.
          args: >-
            -p nucleus-ifc-kernel
            --solver cadical
            -Z unstable-options
            --harness-timeout 120s
            --harness proof_no_secret_exfil
            --harness proof_authority_confinement
            --harness proof_no_integrity_laundering
            --harness proof_propagation_monotone
            --harness proof_propagation_monotone_leq
            --harness proof_trusted_user_allowed
      - name: All six flow.rs harnesses are still declared
        # The harness list above is explicit; if a harness is renamed or
        # deleted, Kani would silently verify fewer. Pin the count.
        run: |
          n=$(grep -c '#\[kani::proof\]' crates/nucleus-ifc-kernel/src/flow.rs)
          [ "$n" -eq 6 ] || { echo "::error::flow.rs declares $n kani harnesses, this job lists 6 — update the --harness list"; exit 1; }

  kani-constitutional:
    name: Kani (constitutional kernel)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.9.1
        # Hosted only: the self-hosted scale set has persistent registry and
        # sccache mounts, and this action's restore of a hosted x86 cache blob
        # was observed hanging runner jobs for 15+ minutes.
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          cache-on-failure: true
      - name: Cache Kani toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.kani
          # Key on the PINNED Kani version, NOT the workflow file: hashing the
          # whole file re-downloaded the ~1 GB toolchain on every unrelated edit.
          # Bump this suffix together with the `kani-version` input below when
          # upgrading Kani.
          key: kani-toolchain-${{ runner.os }}-kani-0.67.0
      - name: Run Kani (constitutional kernel — fast tier)
        id: verify
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          # Pin the verifier version for reproducible proofs (default is
          # "latest", which silently changes what Kani checks) and to make the
          # toolchain cache key above stable. Bump both together.
          kani-version: "0.67.0"
          args: >-
            -p ck-kernel
            --solver cadical
            --harness proof_budget_escalation_detected
            --harness proof_capability_escalation_detected_bitmask
            --harness proof_io_confinement_detected_bitmask
            --harness proof_combined_monotonicity_complete
            --harness proof_capability_subset_transitive
      - name: Summary
        if: always()
        env:
          KANI_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          # Report the verifier step, even after failure or cancellation. A
          # source census is not evidence that any harness actually verified.
          {
            echo "## Kani BMC Results (ck-kernel fast tier)"
            echo ""
            echo "- **Verification step outcome:** ${KANI_OUTCOME:-not run}"
            echo "- **Per-harness results:** see the Run Kani step log."
            echo "- **Solver:** CaDiCaL"
          } >> "$GITHUB_STEP_SUMMARY"

  # Constitutional Kernel (full): every harness, ONE JOB EACH.
  #
  # Was a single job running `-p ck-kernel` (all 17 harnesses) under one 60-minute
  # budget. That job had never once succeeded: it spent the whole budget inside the
  # FIRST harness it picked up and the other 16 were never attempted, so a nightly
  # gate reported red with no indication of which proof was at fault.
  #
  # Sharding gives each harness its own runner and its own budget, and
  # `fail-fast: false` stops one slow proof from masking the rest. The matrix is
  # written out rather than generated so that adding a harness to kani.rs is a
  # deliberate edit here too — the proof-count gate below catches the omission.
  kani-constitutional-full:
    name: "CK full: ${{ matrix.harness }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        harness:
          # Bitmask / lattice tier — no BTreeSet<String>, verified in minutes.
          - proof_budget_escalation_detected
          - proof_capability_escalation_detected_bitmask
          - proof_io_confinement_detected_bitmask
          - proof_combined_monotonicity_complete
          - proof_capability_subset_transitive
          # The refinement bridge. Builds BTreeSet<String> and has never verified,
          # so the bitmask results above do not yet formally transfer to the
          # production types. See KANI-STATUS.md.
          - proof_refinement_bitmask_agrees_with_btreeset
          # Admission-path tier — these drive Kernel::admit over BTreeSet<String>
          # policies. None of them has ever completed in CI; see KANI-STATUS.md.
          - proof_capability_escalation_always_rejected
          - proof_governance_weakening_always_rejected
          - proof_rejected_never_in_lineage
          - proof_budget_escalation_always_rejected
          - proof_constitutional_self_merge_impossible
          - proof_identical_policy_config_patch_admitted
          - proof_io_outbound_domains_widening_rejected
          - proof_io_local_file_roots_widening_rejected
          - proof_io_env_vars_widening_rejected
          - proof_io_tool_namespaces_widening_rejected
          - proof_io_repo_write_targets_widening_rejected
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.9.1
        # Hosted only: the self-hosted scale set has persistent registry and
        # sccache mounts, and this action's restore of a hosted x86 cache blob
        # was observed hanging runner jobs for 15+ minutes.
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          cache-on-failure: true
      - name: Cache Kani toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.kani
          # Key on the PINNED Kani version, NOT the workflow file: hashing the
          # whole file re-downloaded the ~1 GB toolchain on every unrelated edit.
          # Bump this suffix together with the `kani-version` input below when
          # upgrading Kani.
          key: kani-toolchain-${{ runner.os }}-kani-0.67.0
      - name: Run Kani (${{ matrix.harness }})
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          # Pin the verifier version for reproducible proofs (default is
          # "latest", which silently changes what Kani checks) and to make the
          # toolchain cache key above stable. Bump both together.
          kani-version: "0.67.0"
          args: "-p ck-kernel --solver cadical --harness ${{ matrix.harness }}"

  # Roll the shards up into one required-status-friendly result and record which
  # harnesses actually verified, so the nightly summary reports what was proved
  # rather than what was attempted.
  kani-constitutional-full-summary:
    timeout-minutes: 5
    name: Kani (constitutional kernel full)
    runs-on: ubuntu-24.04
    needs: kani-constitutional-full
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report
        env:
          RESULT: ${{ needs.kani-constitutional-full.result }}
        run: |
          TOTAL=$(grep -c '#\[kani::proof\]' crates/ck-kernel/src/kani.rs)
          {
            echo "## Kani BMC — Constitutional Kernel (full, sharded)"
            echo ""
            echo "- **Harnesses in ck-kernel:** $TOTAL, one CI job each"
            echo "- **Matrix result:** $RESULT"
            echo ""
            echo "Per-harness results are in the job list above. A red shard names"
            echo "exactly one proof; see KANI-STATUS.md for the known-unverified set."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" != "success" ]; then
            echo "::warning::One or more ck-kernel harnesses did not verify — see the per-harness jobs"
          fi

  kani-full:
    name: Kani (full)
    runs-on: ubuntu-24.04
    # Was 60. The job has never reached it: it dies after 3-10 minutes with
    # exit 143 and "runner has received a shutdown signal", which is the
    # signature of cbmc exhausting the runner's 16 GB rather than a timeout.
    # Locally, one admission-path harness reaches 3.2 GB within three minutes.
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.9.1
        # Hosted only: the self-hosted scale set has persistent registry and
        # sccache mounts, and this action's restore of a hosted x86 cache blob
        # was observed hanging runner jobs for 15+ minutes.
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          cache-on-failure: true
      - name: Cache Kani toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.kani
          # Key on the PINNED Kani version, NOT the workflow file: hashing the
          # whole file re-downloaded the ~1 GB toolchain on every unrelated edit.
          # Bump this suffix together with the `kani-version` input below when
          # upgrading Kani.
          key: kani-toolchain-${{ runner.os }}-kani-0.67.0
      - name: Run Kani (all harnesses)
        id: verify
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          # Pin the verifier version for reproducible proofs (default is
          # "latest", which silently changes what Kani checks) and to make the
          # toolchain cache key above stable. Bump both together.
          kani-version: "0.67.0"
          args: "-p portcullis --solver cadical"
      - name: Proof count regression gate
        run: |
          # One census, counted by scripts/check-kani-proof-count.sh (#2561): the
          # inlined grep -rc on a DIRECTORY printed per-file lines, the arithmetic
          # errored, PROOF_COUNT was never set, and the gate passed on "".
          scripts/check-kani-proof-count.sh --strict
      - name: Summary
        if: always()
        env:
          KANI_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          # Report the verifier step, even after failure or cancellation. A
          # source census is not evidence that any harness actually verified.
          {
            echo "## Kani BMC Results (portcullis full tier)"
            echo ""
            echo "- **Verification step outcome:** ${KANI_OUTCOME:-not run}"
            echo "- **Per-harness results:** see the Run Kani step log."
            echo "- **Solver:** CaDiCaL"
          } >> "$GITHUB_STEP_SUMMARY"

  kani-core-fast:
    name: Kani (portcullis-core fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.kani
          key: kani-toolchain-${{ runner.os }}-kani-0.67.0
      - name: Verify named harnesses within memory and time budgets
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"
          command: bash scripts/kani-bounded.sh
          args: >-
            -p portcullis-core --solver cadical
            -Z unstable-options --harness-timeout 120s
            --harness proof_ifc_join_commutative
            --harness proof_ifc_join_associative
            --harness proof_ifc_join_idempotent
            --harness proof_ifc_meet_commutative
            --harness proof_ifc_meet_idempotent

  kani-core-full:
    name: "Core full: ${{ matrix.harness }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        harness:
          - proof_declassification_only_weakens_restrictions
          - proof_delegation_chain_monotone
          - proof_narrow_idempotent
          - proof_narrow_monotone
          - proof_ai_derived_never_verified_ready_without_witness
          - proof_verified_lane_implies_witness_or_deterministic
          - proof_verified_write_requires_witness
          - proof_derivation_join_monotone
          - proof_derivation_no_silent_cleansing
          - proof_ifc_absorption_join_meet
          - proof_ifc_absorption_meet_join
          - proof_ifc_bottom_join_identity
          - proof_ifc_join_associative
          - proof_ifc_join_commutative
          - proof_ifc_join_idempotent
          - proof_ifc_leq_consistent_with_join
          - proof_ifc_meet_associative
          - proof_ifc_meet_commutative
          - proof_ifc_meet_idempotent
          - proof_ifc_top_meet_identity
          - proof_directive_from_transitive_rejected
          - proof_empty_capabilities_rejected
          - proof_remote_unlabeled_rejected
          - proof_safe_local_admitted
          - proof_trusted_from_remote_rejected
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.kani
          key: kani-toolchain-${{ runner.os }}-kani-0.67.0
      - name: Verify named harnesses within memory and time budgets
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"
          command: bash scripts/kani-bounded.sh
          args: >-
            -p portcullis-core --features envelope --solver cadical
            -Z unstable-options --harness-timeout 600s
            --harness ${{ matrix.harness }}

  kani-econ-full:
    name: Kani (welfare sum overflow)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.kani
          key: kani-toolchain-${{ runner.os }}-kani-0.67.0
      - name: Verify named harnesses within memory and time budgets
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"
          command: bash scripts/kani-bounded.sh
          args: >-
            -p nucleus-econ-kernels --solver cadical
            -Z unstable-options --harness-timeout 600s
            --harness welfare_sum_bounded

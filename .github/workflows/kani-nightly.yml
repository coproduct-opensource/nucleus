name: Kani BMC

on:
  push:
    branches: ["main"]
    paths:
      - "crates/portcullis/src/**"
      - "crates/ck-*/src/**"
      - ".kani-minimum-proofs"
      - ".github/workflows/kani-nightly.yml"
  pull_request:
    paths:
      - "crates/portcullis/src/**"
      - "crates/ck-*/src/**"
      - ".kani-minimum-proofs"
      - ".github/workflows/kani-nightly.yml"
  # Bare, unfiltered: the merge queue's own re-validation of the fast-tier
  # jobs (#2430 — required status checks). Not path-filtered like push/
  # pull_request above; kani-nightly-noop.yml is pull_request-only (its own
  # comment explains why merge_group needs no twin).
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  # Supersede a PR's older in-flight runs; NEVER cancel anything else.
  # cancel-in-progress is scoped to pull_request on purpose: cancelling a
  # merge_group run would abort a queue entry mid-flight, and cancelling a
  # push to main would drop the signal for a commit that already landed.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Kani drives its own rustc; sccache in front of it broke the build on the scale set (#2493).
  RUSTC_WRAPPER: ""

jobs:
  # Fast tier: 5 lightweight harnesses — runs on every PR and push
  # The 3 normalize_* harnesses use build_ordered_permissions() which creates
  # a massive symbolic state space (24 symbolic capabilities + obligations).
  # They require 15+ minutes each and are verified in the nightly full tier.
  kani-fast:
    name: Kani
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.9.1
        # Hosted only: the self-hosted scale set has persistent registry and
        # sccache mounts, and this action's restore of a hosted x86 cache blob
        # was observed hanging runner jobs for 15+ minutes.
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          cache-on-failure: true
      - name: Cache Kani toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.kani
          # Key on the PINNED Kani version, NOT the workflow file: hashing the
          # whole file re-downloaded the ~1 GB toolchain on every unrelated edit.
          # Bump this suffix together with the `kani-version` input below when
          # upgrading Kani.
          key: kani-toolchain-${{ runner.os }}-kani-0.67.0
      - name: Run Kani (fast harnesses)
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          # Pin the verifier version for reproducible proofs (default is
          # "latest", which silently changes what Kani checks) and to make the
          # toolchain cache key above stable. Bump both together.
          kani-version: "0.67.0"
          args: >-
            -p portcullis
            --solver cadical
            --harness proof_capability_distributive
            --harness proof_exposureset_monoid_identity
            --harness proof_exposureset_uninhabitable_iff_count_three
            --harness proof_operation_exposure_completeness
            --harness proof_clinejection_blocked
      - name: Proof count regression gate
        run: |
          PORTCULLIS=$(grep -c '#\[kani::proof\]' crates/portcullis/src/kani.rs)
          CK_KERNEL=$(grep -c '#\[kani::proof\]' crates/ck-kernel/src/kani.rs)
          CORE=$(grep -rc '#\[kani::proof\]' crates/portcullis-core/src/ || echo 0)
          PROOF_COUNT=$((PORTCULLIS + CK_KERNEL + CORE))
          MINIMUM=$(cat .kani-minimum-proofs | tr -d '[:space:]')
          echo "Kani proof harnesses: $PROOF_COUNT (portcullis: $PORTCULLIS, ck-kernel: $CK_KERNEL, minimum: $MINIMUM)"
          if [ "$PROOF_COUNT" -lt "$MINIMUM" ]; then
            echo "::error::Kani proof count regression: $PROOF_COUNT < $MINIMUM (portcullis: $PORTCULLIS, ck-kernel: $CK_KERNEL)"
            exit 1
          fi
      - name: Summary
        if: always()
        run: |
          PORTCULLIS=$(grep -c '#\[kani::proof\]' crates/portcullis/src/kani.rs)
          CK_KERNEL=$(grep -c '#\[kani::proof\]' crates/ck-kernel/src/kani.rs)
          CORE=$(grep -rc '#\[kani::proof\]' crates/portcullis-core/src/ || echo 0)
          PROOF_COUNT=$((PORTCULLIS + CK_KERNEL + CORE))
          MINIMUM=$(cat .kani-minimum-proofs | tr -d '[:space:]')
          echo "## Kani BMC Results (fast tier)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Harnesses verified:** 5 / $PROOF_COUNT (fast tier)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Solver:** CaDiCaL" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Minimum required:** $MINIMUM" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Full suite:** nightly + workflow_dispatch" >> "$GITHUB_STEP_SUMMARY"

  # Constitutional Kernel (fast): 5 bitmask / lattice proofs. These touch no
  # BTreeSet<String> and never call Kernel::admit, which is why they finish in
  # minutes. The other 12 harnesses are sharded into the nightly matrix below and,
  # as of 2026-08-31, none of them verifies — the dividing line is BTreeSet<String>,
  # not Kernel::admit. See KANI-STATUS.md.
  kani-constitutional:
    name: Kani (constitutional kernel)
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.9.1
        # Hosted only: the self-hosted scale set has persistent registry and
        # sccache mounts, and this action's restore of a hosted x86 cache blob
        # was observed hanging runner jobs for 15+ minutes.
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          cache-on-failure: true
      - name: Cache Kani toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.kani
          # Key on the PINNED Kani version, NOT the workflow file: hashing the
          # whole file re-downloaded the ~1 GB toolchain on every unrelated edit.
          # Bump this suffix together with the `kani-version` input below when
          # upgrading Kani.
          key: kani-toolchain-${{ runner.os }}-kani-0.67.0
      - name: Run Kani (constitutional kernel — fast tier)
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          # Pin the verifier version for reproducible proofs (default is
          # "latest", which silently changes what Kani checks) and to make the
          # toolchain cache key above stable. Bump both together.
          kani-version: "0.67.0"
          args: >-
            -p ck-kernel
            --solver cadical
            --harness proof_budget_escalation_detected
            --harness proof_capability_escalation_detected_bitmask
            --harness proof_io_confinement_detected_bitmask
            --harness proof_combined_monotonicity_complete
            --harness proof_capability_subset_transitive
      - name: Summary
        if: always()
        run: |
          TOTAL=$(grep -c '#\[kani::proof\]' crates/ck-kernel/src/kani.rs)
          echo "## Kani BMC — Constitutional Kernel (fast tier)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Harnesses verified:** 5 / $TOTAL (fast tier — pure bitmask)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Proved:** budget escalation, capability non-escalation, I/O confinement, combined monotonicity, lattice transitivity" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Nightly:** 11 admission-path harnesses, one job each (see KANI-STATUS.md)" >> "$GITHUB_STEP_SUMMARY"

  # Constitutional Kernel (full): every harness, ONE JOB EACH.
  #
  # Was a single job running `-p ck-kernel` (all 17 harnesses) under one 60-minute
  # budget. That job had never once succeeded: it spent the whole budget inside the
  # FIRST harness it picked up and the other 16 were never attempted, so a nightly
  # gate reported red with no indication of which proof was at fault.
  #
  # Sharding gives each harness its own runner and its own budget, and
  # `fail-fast: false` stops one slow proof from masking the rest. The matrix is
  # written out rather than generated so that adding a harness to kani.rs is a
  # deliberate edit here too — the proof-count gate below catches the omission.
  kani-constitutional-full:
    name: "CK full: ${{ matrix.harness }}"
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        harness:
          # Bitmask / lattice tier — no BTreeSet<String>, verified in minutes.
          - proof_budget_escalation_detected
          - proof_capability_escalation_detected_bitmask
          - proof_io_confinement_detected_bitmask
          - proof_combined_monotonicity_complete
          - proof_capability_subset_transitive
          # The refinement bridge. Builds BTreeSet<String> and has never verified,
          # so the bitmask results above do not yet formally transfer to the
          # production types. See KANI-STATUS.md.
          - proof_refinement_bitmask_agrees_with_btreeset
          # Admission-path tier — these drive Kernel::admit over BTreeSet<String>
          # policies. None of them has ever completed in CI; see KANI-STATUS.md.
          - proof_capability_escalation_always_rejected
          - proof_governance_weakening_always_rejected
          - proof_rejected_never_in_lineage
          - proof_budget_escalation_always_rejected
          - proof_constitutional_self_merge_impossible
          - proof_identical_policy_config_patch_admitted
          - proof_io_outbound_domains_widening_rejected
          - proof_io_local_file_roots_widening_rejected
          - proof_io_env_vars_widening_rejected
          - proof_io_tool_namespaces_widening_rejected
          - proof_io_repo_write_targets_widening_rejected
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.9.1
        # Hosted only: the self-hosted scale set has persistent registry and
        # sccache mounts, and this action's restore of a hosted x86 cache blob
        # was observed hanging runner jobs for 15+ minutes.
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          cache-on-failure: true
      - name: Cache Kani toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.kani
          # Key on the PINNED Kani version, NOT the workflow file: hashing the
          # whole file re-downloaded the ~1 GB toolchain on every unrelated edit.
          # Bump this suffix together with the `kani-version` input below when
          # upgrading Kani.
          key: kani-toolchain-${{ runner.os }}-kani-0.67.0
      - name: Run Kani (${{ matrix.harness }})
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          # Pin the verifier version for reproducible proofs (default is
          # "latest", which silently changes what Kani checks) and to make the
          # toolchain cache key above stable. Bump both together.
          kani-version: "0.67.0"
          args: "-p ck-kernel --solver cadical --harness ${{ matrix.harness }}"

  # Roll the shards up into one required-status-friendly result and record which
  # harnesses actually verified, so the nightly summary reports what was proved
  # rather than what was attempted.
  kani-constitutional-full-summary:
    name: Kani (constitutional kernel full)
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: kani-constitutional-full
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report
        env:
          RESULT: ${{ needs.kani-constitutional-full.result }}
        run: |
          TOTAL=$(grep -c '#\[kani::proof\]' crates/ck-kernel/src/kani.rs)
          {
            echo "## Kani BMC — Constitutional Kernel (full, sharded)"
            echo ""
            echo "- **Harnesses in ck-kernel:** $TOTAL, one CI job each"
            echo "- **Matrix result:** $RESULT"
            echo ""
            echo "Per-harness results are in the job list above. A red shard names"
            echo "exactly one proof; see KANI-STATUS.md for the known-unverified set."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" != "success" ]; then
            echo "::warning::One or more ck-kernel harnesses did not verify — see the per-harness jobs"
          fi

  kani-full:
    name: Kani (full)
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    # Was 60. The job has never reached it: it dies after 3-10 minutes with
    # exit 143 and "runner has received a shutdown signal", which is the
    # signature of cbmc exhausting the runner's 16 GB rather than a timeout.
    # Locally, one admission-path harness reaches 3.2 GB within three minutes.
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.9.1
        # Hosted only: the self-hosted scale set has persistent registry and
        # sccache mounts, and this action's restore of a hosted x86 cache blob
        # was observed hanging runner jobs for 15+ minutes.
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          cache-on-failure: true
      - name: Cache Kani toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.kani
          # Key on the PINNED Kani version, NOT the workflow file: hashing the
          # whole file re-downloaded the ~1 GB toolchain on every unrelated edit.
          # Bump this suffix together with the `kani-version` input below when
          # upgrading Kani.
          key: kani-toolchain-${{ runner.os }}-kani-0.67.0
      - name: Run Kani (all harnesses)
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          # Pin the verifier version for reproducible proofs (default is
          # "latest", which silently changes what Kani checks) and to make the
          # toolchain cache key above stable. Bump both together.
          kani-version: "0.67.0"
          args: "-p portcullis --solver cadical"
      - name: Proof count regression gate
        run: |
          PORTCULLIS=$(grep -c '#\[kani::proof\]' crates/portcullis/src/kani.rs)
          CK_KERNEL=$(grep -c '#\[kani::proof\]' crates/ck-kernel/src/kani.rs)
          CORE=$(grep -rc '#\[kani::proof\]' crates/portcullis-core/src/ || echo 0)
          PROOF_COUNT=$((PORTCULLIS + CK_KERNEL + CORE))
          MINIMUM=$(cat .kani-minimum-proofs | tr -d '[:space:]')
          echo "Kani proof harnesses: $PROOF_COUNT (portcullis: $PORTCULLIS, ck-kernel: $CK_KERNEL, minimum: $MINIMUM)"
          if [ "$PROOF_COUNT" -lt "$MINIMUM" ]; then
            echo "::error::Kani proof count regression: $PROOF_COUNT < $MINIMUM (portcullis: $PORTCULLIS, ck-kernel: $CK_KERNEL)"
            exit 1
          fi
      - name: Summary
        if: always()
        run: |
          PORTCULLIS=$(grep -c '#\[kani::proof\]' crates/portcullis/src/kani.rs)
          CK_KERNEL=$(grep -c '#\[kani::proof\]' crates/ck-kernel/src/kani.rs)
          CORE=$(grep -rc '#\[kani::proof\]' crates/portcullis-core/src/ || echo 0)
          PROOF_COUNT=$((PORTCULLIS + CK_KERNEL + CORE))
          MINIMUM=$(cat .kani-minimum-proofs | tr -d '[:space:]')
          echo "## Kani BMC Results (full suite)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Harnesses verified:** $PROOF_COUNT / $PROOF_COUNT (all)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Solver:** CaDiCaL" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Minimum required:** $MINIMUM" >> "$GITHUB_STEP_SUMMARY"

name: Manifest Guards

# Fast, repo-wide guards that gate every PR independently of the heavy Test
# Suite (fmt / clippy / build / test / fuzz). Two proof obligations:
#
#   1. cargo-metadata smoke — the WHOLE workspace parses: no duplicate
#      [dependencies] tables, no malformed manifests, no broken path deps.
#      Asserts exit 0 AND empty stderr (Cargo prints manifest warnings there).
#      Unlike oidc-gates.yml (which is path-scoped to the OIDC crates), this
#      runs on every PR so a manifest regression anywhere is caught.
#
#   2. vendor neutrality — public nucleus source stays free of vendor-specific
#      identifiers (claude / anthropic / openai / ...). Delegates to
#      ci/no-vendor-strings.sh so the allowlist logic (`# vendor-allow:`) has a
#      single source of truth. Scoped to the same crates oidc-gates enforces;
#      a future change can widen SCAN_PATHS once a tree-wide allowlist baseline
#      is curated (a naive tree-wide scan floods on boundary-describing docs).

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:

concurrency:
  # Supersede a PR's older in-flight runs; NEVER cancel anything else.
  # cancel-in-progress is scoped to pull_request on purpose: cancelling a
  # merge_group run would abort a queue entry mid-flight, and cancelling a
  # push to main would drop the signal for a commit that already landed.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  manifest-guards:
    name: Manifest Guards
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Cargo metadata smoke (whole workspace parses, empty stderr)
        run: |
          set -euo pipefail
          if ! cargo metadata --format-version 1 --no-deps >/dev/null 2>meta.err; then
            echo "::error::cargo metadata failed — manifest corruption, duplicate table, or bad path dep"
            cat meta.err >&2
            exit 1
          fi
          if [ -s meta.err ]; then
            echo "::error::cargo metadata emitted warnings/errors on stderr"
            cat meta.err >&2
            exit 1
          fi
          echo "cargo metadata OK (empty stderr)"

      - name: Vendor neutrality (no claude/anthropic/openai in source)
        run: bash ci/no-vendor-strings.sh

      # Move B deleted nucleus-node's HMAC auth tier in favor of mandatory
      # mTLS. A categorical denylist, matching the house pattern
      # `snapshot::PER_POD_SECRET_KEYS` uses for retired per-pod secrets: the
      # retired symbols must not silently reappear.
      - name: No retired HMAC auth symbols (Move B)
        run: scripts/check-no-hmac-auth.sh

      # release.yml built 3 of the 7 guest binaries the rootfs needs, so the
      # rootfs job failed on the first missing one. It only surfaces when a
      # release is cut, which is why it survived from July to v2.2.0.
      - name: Release builds every rootfs input
        run: bash ci/release-builds-rootfs-inputs.sh
      # The Dockerfiles pinned rust:1.88 while the workspace needs 1.95, so
      # `cargo chef cook` refused to build. docker.yml runs on `v*` tags only,
      # so the images are built when a release is cut and never between.
      - name: Docker Rust base >= workspace MSRV
        run: bash ci/docker-rust-matches-msrv.sh

      # `.gitignore` said `/target/` — anchored to the root, so every nested
      # target/ escaped it, and tools/nucleus-mediation-lint/target was
      # committed: 2664 files, 1269 MB, 98% of the HEAD tree. The same mistake
      # was then repeated in another tools/ crate within the hour. A rule that
      # lives only in .gitignore is a rule that gets re-broken.
      - name: No tracked build artifacts
        run: bash ci/no-tracked-build-artifacts.sh
      # NOTHING in this repo checked workflow SYNTAX. zizmor audits workflow
      # SECURITY and is a different question. A duplicated `if:` key parses
      # under a permissive YAML reader (last key wins) and is rejected outright
      # by GitHub Actions, which reports it as a run named after the file with
      # no jobs — after the runners have already been consumed. That is how a
      # broken gate reached CI and burned ~27 queued runs before failing.
      - name: Workflow syntax (actionlint)
        run: |
          set -euo pipefail
          ver=1.7.12
          # Match the runner's architecture: the self-hosted scale set is arm64.
          case "$(uname -m)" in aarch64|arm64) arch=arm64 ;; *) arch=amd64 ;; esac
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_${arch}.tar.gz" \
            | tar xz actionlint
          # Syntax and expression errors only. Shellcheck style inside `run:`
          # blocks is a separate, noisier question and is not gated here.
          ./actionlint -shellcheck= -pyflakes= .github/workflows/*.yml

      # The merge_group scope gates re-implement each workflow's `paths:` as a
      # regex, because GitHub ignores `paths:` for merge_group events. Two
      # copies of one fact drift, so this fails if they disagree.
      - name: merge_group scope gates match their declared paths
        run: bash ci/merge-group-scope-parity.sh
      # Exactly one place decides what SPIFFE ID a certificate carries. Six
      # independent copies of that parse existed, each returning the FIRST
      # `spiffe://` SAN, which the X.509-SVID standard requires be rejected.
      - name: One X.509-SVID validator
        run: bash ci/one-svid-validator.sh
      # `wait_for_proxy_health` moved modules and its boot.stage attribute stayed
      # behind, silently reattaching to `serve_grpc` — so the largest span in a
      # pod launch had no instrumentation and 92% of the boot trace was
      # `unaccounted` (#2374). Rust binds attributes to the next item regardless
      # of the blank line between them, so nothing failed.
      - name: boot.stage spans annotate the item they measure
        run: bash ci/boot-stage-spans-are-attached.sh
      # `ip netns exec <ns> <argv>` runs argv IN the namespace and inserts no
      # program name. Ten call sites passed bare ip SUBCOMMANDS, so the exec hit
      # coreutils `link(1)` and every pod with a `network` block failed to launch
      # (#2380). CI never saw it: a spec with no `network` block skips that path
      # entirely, and none of the specs CI boots has one.
      - name: run_netns argv names a program
        run: bash ci/netns-argv-names-a-program.sh
      # br_netfilter was present by accident on hosts running Docker/containerd.
      # These templates disable containerd deliberately, which removed the thing
      # that had been loading it, and every pod with a `network` block began
      # failing mid-launch on a bare `sysctl: cannot stat` (#2382).
      - name: br_netfilter is a declared dependency
        run: bash ci/br-netfilter-is-declared.sh
      # The `-noop` twins carry the SAME workflow name so a required status
      # context is reported on every PR. That makes `${{ github.workflow }}`
      # identical for both files, and every one of the ten pairs built its
      # concurrency group from it — so the twins cancelled each other, and a
      # cancelled check-run turns the PR's rollup FAILURE with nothing broken.
      - name: twin workflows have distinct concurrency groups
        run: bash ci/twin-workflows-have-distinct-concurrency.sh

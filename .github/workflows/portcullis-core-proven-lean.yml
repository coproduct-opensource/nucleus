name: Portcullis-Core Proven Lean

# Regression gate for the PROVEN tier of crates/portcullis-core/lean.
#
# WHY THIS EXISTS, beyond the per-file aeneas*.yml gates: those build only ~11
# named libraries. ~13 other kernel-checked, sorry-free libraries (the IFC
# semilattice, categorical, Galois, attenuation, constructive-security, WASI,
# Belnap/labeled-type/repair algebra) had NO gate, so a real proof could
# silently acquire a `sorry` and regress unnoticed. This gate:
#
#   1. `lake build`s the full PROVEN target list (catches type-level breakage),
#   2. scans the WHOLE tree (comment-aware) for proof-hole `sorry`/`admit` and
#      fails if any appears in a file NOT listed as research-tier in
#      crates/portcullis-core/lean/CONJECTURES.md — so a proven lib cannot rot,
#      and a research hole cannot escape quarantine, and
#   3. runs a `#print axioms` audit on the enforcement core to catch any
#      `sorryAx` that a textual grep would miss via the proof dependency graph,
#   4. audits the axioms of every declaration in every first-party module the
#      build compiles, imports included (`cargo xtask lean-axiom-audit`, #3302).
#      A library listed below whose import closure reaches a `sorryAx` is red
#      and named — the list is checked against its closures, so a research
#      file cannot ride into the proven build behind an `import`.
#
# Native evaluation is admitted only by the per-theorem exception list.
# FlowGraphProofs uses kernel-checked decide; owned compiler overrides are
# rejected before any build or axiom audit.

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/check-lean-external-state.py"
      - "scripts/lean-axiom-audit.sh"
      - "crates/portcullis-core/lean/**"
      - ".github/workflows/portcullis-core-proven-lean.yml"
      - "crates/xtask/src/lean_replay/**"
      - "crates/xtask/src/lean_axiom_audit/**"
      - "crates/xtask/src/lean_tier.rs"
      - "crates/xtask/src/lean_action_builds.rs"
  pull_request:
    paths:
      - "scripts/check-lean-external-state.py"
      - "scripts/lean-axiom-audit.sh"
      - "crates/portcullis-core/lean/**"
      - ".github/workflows/portcullis-core-proven-lean.yml"
      - "crates/xtask/src/lean_replay/**"
      - "crates/xtask/src/lean_axiom_audit/**"
      - "crates/xtask/src/lean_tier.rs"
      - "crates/xtask/src/lean_action_builds.rs"
  merge_group:
  workflow_dispatch:

concurrency:
  # Supersede a PR's older in-flight runs; NEVER cancel anything else.
  # cancel-in-progress is scoped to pull_request on purpose: cancelling a
  # merge_group run would abort a queue entry mid-flight, and cancelling a
  # push to main would drop the signal for a commit that already landed.
  group: portcullis-core-proven-lean-real-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  portcullis-core-proven-lean:
    name: lake build + sorry-ban (proven tier)
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      # WHY THIS EXISTS: `paths:` under `merge_group:` is accepted by the YAML
      # schema and then IGNORED by GitHub — path filtering is not supported for
      # merge_group events. So the scoping declared above holds on pull_request
      # and is silently dropped in the merge queue, where the queue's
      # speculative batches multiply it by the queue depth. A README-only PR
      # was running the full Lean proof suite, once per queue entry.
      #
      # This restores the declared intent for merge_group only. On every other
      # event GitHub's own `paths:` already decided, so the gate says yes and
      # changes nothing.
      - name: Is this change in scope?
        id: scope
        env:
          # Never interpolate ${{ }} into a run script (zizmor
          # template-injection hardening) — pass through env.
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
          PATTERN: '^crates/portcullis-core/lean/|^\.github/workflows/portcullis-core-proven-lean\.yml$|^scripts/(check-lean-external-state\.py|lean-axiom-audit\.sh)$|^crates/xtask/src/(lean_replay/|lean_axiom_audit/|lean_tier\.rs$|lean_action_builds\.rs$)'
        run: |
          set -euo pipefail
          if [ "$EVENT" != "merge_group" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT: GitHub's own paths: filter already applied."
            exit 0
          fi
          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ]; then
            # Fail OPEN: an unknown range must run the proofs, never skip them.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "merge_group with no base/head sha — running to be safe."
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE "$PATTERN"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "in scope — running."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no file in this merge group matches $PATTERN — skipping the"
            echo "expensive steps. This job still reports, so it remains usable"
            echo "as a required status check."
          fi


      # Reuse the previous run's Lake output. Lake decides freshness by content-hash
      # traces, not mtimes, so an older .lake is sound: what changed rebuilds, the
      # rest replays. Saved from main only (a merge-group or PR cache is visible to
      # that ref alone). A miss or a failed restore costs time, never a verdict.
      # Mathlib is left out: `lake exe cache get` fetches its oleans every run, and
      # its checkout plus build is ~8 GB, most of the repository's cache quota.
      - name: Restore Lake build output
        id: lake-cache
        if: steps.scope.outputs.relevant == 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "5"
        with:
          path: |
            crates/portcullis-core/lean/.lake
            !crates/portcullis-core/lean/.lake/packages/mathlib
          key: lake-v1-portcullis-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/portcullis-core/lean/lean-toolchain', 'crates/portcullis-core/lean/lake-manifest.json', 'crates/portcullis-core/lean/lakefile.lean') }}-${{ github.job }}-${{ hashFiles('crates/portcullis-core/lean/**/*.lean', '!crates/portcullis-core/lean/.lake/**') }}
          restore-keys: |
            lake-v1-portcullis-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/portcullis-core/lean/lean-toolchain', 'crates/portcullis-core/lean/lake-manifest.json', 'crates/portcullis-core/lean/lakefile.lean') }}-${{ github.job }}-
            lake-v1-portcullis-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/portcullis-core/lean/lean-toolchain', 'crates/portcullis-core/lean/lake-manifest.json', 'crates/portcullis-core/lean/lakefile.lean') }}-

      - name: Build Lean project with cached artifacts
        if: steps.scope.outputs.relevant == 'true'
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        env:
          LEAN_NUM_THREADS: "4"
        with:
          lake-package-directory: crates/portcullis-core/lean
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
          build-args: >-
            PortcullisCoreBridge
            PortcullisCoreIFC
            IntegrityNoninterferenceExtracted
            ExposureProofs
            FlowProofs
            FlowGraphProofs
            DecidePureProofs
            DeclassifyProofs
            DeclassifySinkScopeExtracted
            CompartmentProofs
            DelegationProofs
            DerivationProofs
            SessionCeilingProofs
            GuestDeviceSurfaceProofs
            GovernanceCompletenessSpike
            GkatSyntaxProofs
            GkatGuardedStringProofs
            GkatInexpressibleProofs
            GkatUniquenessFrontierProofs
            GkatExistenceFrontierProofs
            GkatUAIndependenceProofs
            GkatObservationProofs
            GkatPullbackWitnessProofs
            GkatDerivativeProofs
            GkatWellNestedProofs
            GkatBisimulationProofs
            GkatCompletenessProofs
            GkatDerivativeFiniteProofs
            GkatDecisionProofs
            GkatBehaviorProofs
            GkatInexpressibilityProofs
            GkatCoequationProofs
            GkatFaithfulnessProofs
            GkatKleeneProofs
            GkatChainEliminationProofs
            ExposureLoopFixpointProofs
            GkatGuardedLoopBridge
            GkatWhileStep
            GkatOrderedProofs
            SnapshotCloneSafetyProofs
            DerivationCascadeAdmissible
            ReceiptChainProofs
            IFCSemilatticeProofs
            DelegationCategoryProofs
            GaloisConnectionProofs
            AttenuationProofs
            PortcullisCoreAttenuation
            AttenuationChainExtracted
            PortcullisCoreCertChain
            CertChainMonotoneExtracted
            SemanticIFC
            MonoidalPermissionProofs
            ConstructiveSecurity
            WasiWorldFunctor
            WasiIfcBoundary
            BelnapDecisionProofs
            RepairAlgebraProofs
            PortcullisCoreCapQuantale
            CapabilityResiduatedQuantaleProofs
            PortcullisCoreIdentity
            IdentityMaterialNoninterferenceExtracted
            PortcullisCoreChannel
            ChannelAdmissionExtracted
            SnapshotChannelBindingProofs
            AssuranceCoverage
            UniversalDetection
            PodMachineSpike
            PodCrossView
            PodCrossViewIdentity
            IdentityOracleMirror
            ConfidentialityOracleMirror
            IntegrityOracleMirror
            ChannelOracleMirror

      # Only reached when the build above succeeded, so a failed build never
      # becomes the next run's starting point.
      - name: Save Lake build output
        if: ${{ steps.scope.outputs.relevant == 'true' && github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/portcullis-core/lean/.lake
            !crates/portcullis-core/lean/.lake/packages/mathlib
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}

      - name: Proof-hole scan (no sorry/admit outside the research manifest)
        if: steps.scope.outputs.relevant == 'true'
        working-directory: crates/portcullis-core/lean
        run: |
          # Comment-aware sorry/admit counter: strips /- -/ block comments and
          # -- line comments, then counts `sorry`/`admit` used as a term token.
          # Matches the local-verification logic in CONJECTURES.md.
          cat > /tmp/count_holes.awk <<'AWK'
          BEGIN{depth=0}
          {
            line=$0; out=""; i=1; L=length(line)
            while(i<=L){
              two=substr(line,i,2)
              if(depth>0){
                if(two=="-/"){depth--; i+=2; continue}
                if(two=="/-"){depth++; i+=2; continue}
                i++; continue
              } else {
                if(two=="/-"){depth++; i+=2; continue}
                if(two=="--"){break}
                out=out substr(line,i,1); i++
              }
            }
            total+=gsub(/(^|[^A-Za-z0-9._'])(sorry|admit)([^A-Za-z0-9_']|$)/,"&",out)
          }
          END{print total+0}
          AWK

          # Research-tier allowlist == the exact file list between the
          # GATE-ALLOWLIST markers in CONJECTURES.md. Parsing keeps the manifest
          # the single source of truth; if it drifts from reality, this gate fails.
          ALLOW="$(awk '/GATE-ALLOWLIST:BEGIN/{f=1; next} /GATE-ALLOWLIST:END/{f=0} f' CONJECTURES.md \
                   | grep -vE '^```' | grep -oE '[A-Za-z]+' | sort -u)"
          if [ -z "$ALLOW" ]; then
            echo "::error::could not parse GATE-ALLOWLIST from CONJECTURES.md"; exit 1
          fi
          echo "Research-tier allowlist (may contain sorry):"
          echo "$ALLOW" | sed 's/^/  /'

          fail=0
          while IFS= read -r f; do
            base="$(basename "$f" .lean)"
            n="$(awk -f /tmp/count_holes.awk "$f")"
            if [ "$n" != "0" ]; then
              if echo "$ALLOW" | grep -qx "$base"; then
                echo "  research-tier (allowed): $f has $n hole(s)"
              else
                echo "::error file=$f::PROVEN-tier file has $n proof hole(s) (sorry/admit) — not allowed. Discharge it, or move it to the research tier in CONJECTURES.md."
                fail=1
              fi
            fi
          done < <(find . -name '*.lean' -not -path './.lake/*')

          if [ "$fail" != "0" ]; then
            echo "FAIL: a proven-tier Lean file regressed into a proof hole."
            exit 1
          fi
          echo "OK: every proof hole is confined to the research tier declared in CONJECTURES.md."

      - name: Per-theorem axiom audit (every declaration under every proven-tier root)
        if: steps.scope.outputs.relevant == 'true'
        # Replaces the three hand-written PrintAxioms files (#2567), whose theorem
        # list was maintained by hand — a theorem nobody added was never audited.
        # The roots are read from THIS workflow's explicit Lean-action build inputs, so the
        # audited set and the built set cannot drift. One environment per root,
        # so the pairwise-incompatible Aeneas extractions (PortcullisCoreIFC /
        # CapQuantale / Channel) never share an import. Policy, fixtures and the
        # per-theorem native_decide exceptions: scripts/lean-axiom-audit.sh and
        # crates/portcullis-core/lean/.axiom-audit-exceptions.
        run: |
          builds=$(cargo run -q -p xtask -- lean-action-builds --workflow .github/workflows/portcullis-core-proven-lean.yml)
          roots=$(printf '%s\n' "$builds" | awk '$1 == "named" {print $2}' | paste -sd, -)
          n=$(echo "$roots" | tr ',' '\n' | wc -l | tr -d ' ')
          [ "$n" -ge 40 ] || { echo "::error::only $n roots parsed from the build list — the audit would be partial"; exit 1; }
          echo "auditing $n roots"
          scripts/lean-axiom-audit.sh crates/portcullis-core/lean "$roots"
      - name: The axiom audit goes red on axiom / admit / native_decide fixtures
        if: steps.scope.outputs.relevant == 'true'
        run: scripts/lean-axiom-audit.sh crates/portcullis-core/lean --self-test
      # Second kernel pass (#2592): leanchecker reads back every proven-tier .olean
      # this job just built and replays its constants through the kernel again —
      # --fresh (Init included, nothing trusted) on a Mathlib-free tier, from imports
      # on a Mathlib one. Tier, modules and mode are derived from this workflow's
      # Lean-action build, the lakefile and the lake manifest; a run that replays
      # nothing is red, not green.
      - name: leanchecker replays the proven tier (second kernel pass)
        if: steps.scope.outputs.relevant == 'true'
        run: cargo run -q -p xtask -- lean-replay --workflow .github/workflows/portcullis-core-proven-lean.yml
      - name: The replay goes red on a forged proof term (and green on its sound twin)
        if: steps.scope.outputs.relevant == 'true'
        run: cargo run -q -p xtask -- lean-replay --self-test crates/portcullis-core/lean
      # Closure axiom audit (#3302, part of #2555). The per-library audit above
      # reports each built library's OWN declarations; this one reports every
      # declaration of every first-party module the build compiles, imports
      # included. A built library whose closure reaches a `sorryAx` (or any axiom
      # outside {propext, Classical.choice, Quot.sound} that .axiom-audit-exceptions
      # does not name) is red and named: it is not proven, whatever list holds it.
      # Tier and modules are derived from this workflow's Lean-action build and the
      # lakefile; a run that audits nothing is red, not green.
      - name: Closure axiom audit (every declaration the proven build compiles)
        if: steps.scope.outputs.relevant == 'true'
        run: cargo run -q -p xtask -- lean-axiom-audit --workflow .github/workflows/portcullis-core-proven-lean.yml
      - name: The closure axiom audit goes red on a sorry fixture (and green on clean theorems)
        if: steps.scope.outputs.relevant == 'true'
        run: cargo run -q -p xtask -- lean-axiom-audit --self-test crates/portcullis-core/lean

name: Portcullis-Core Proven Lean

# Regression gate for the PROVEN tier of crates/portcullis-core/lean.
#
# WHY THIS EXISTS, beyond the per-file aeneas*.yml gates: those build only ~11
# named libraries. ~13 other kernel-checked, sorry-free libraries (the IFC
# semilattice, categorical, Galois, attenuation, constructive-security, WASI,
# Belnap/labeled-type/repair algebra) had NO gate, so a real proof could
# silently acquire a `sorry` and regress unnoticed. This gate:
#
#   1. `lake build`s the full PROVEN target list (catches type-level breakage),
#   2. scans the WHOLE tree (comment-aware) for proof-hole `sorry`/`admit` and
#      fails if any appears in a file NOT listed as research-tier in
#      crates/portcullis-core/lean/CONJECTURES.md — so a proven lib cannot rot,
#      and a research hole cannot escape quarantine, and
#   3. runs a `#print axioms` audit on the enforcement core to catch any
#      `sorryAx` that a textual grep would miss via the proof dependency graph.
#
# `native_decide` is NOT banned here (unlike the Mathlib-free ck-policy/rubric/
# econ trees): it is load-bearing in FlowGraphProofs.lean. It is instead
# DISCLOSED — the #print axioms step surfaces `Lean.ofReduceBool` (native-
# compiler TCB) so the trust boundary is visible, not hidden.

on:
  push:
    branches: ["main"]
    paths:
      - "crates/portcullis-core/lean/**"
      - ".github/workflows/portcullis-core-proven-lean.yml"
  pull_request:
    paths:
      - "crates/portcullis-core/lean/**"
      - ".github/workflows/portcullis-core-proven-lean.yml"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portcullis-core-proven-lean:
    name: lake build + sorry-ban (proven tier)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install elan (Lean toolchain)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Cache-poisoning ignored: formal-proof build only, no published artifacts.
      - name: Cache Lake / Mathlib build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            crates/portcullis-core/lean/.lake
            ~/.elan
            ~/.cache/mathlib
          key: lean-aeneas-${{ runner.os }}-${{ hashFiles('crates/portcullis-core/lean/lean-toolchain', 'crates/portcullis-core/lean/lakefile.lean', 'crates/portcullis-core/lean/lake-manifest.json') }}
          restore-keys: |
            lean-aeneas-${{ runner.os }}-

      # Prebuilt Mathlib oleans from Azure: ~5 min vs ~1 h cold compile.
      - name: Fetch Mathlib cache (prebuilt oleans)
        working-directory: crates/portcullis-core/lean
        run: lake exe cache get || true

      - name: lake build (proven tier — type-check all kernel-checked libs)
        working-directory: crates/portcullis-core/lean
        run: |
          lake build \
            PortcullisCoreBridge \
            PortcullisCoreIFC \
            IntegrityNoninterferenceExtracted \
            ExposureProofs \
            FlowProofs \
            FlowGraphProofs \
            DecidePureProofs \
            DeclassifyProofs \
            DeclassifySinkScopeExtracted \
            CompartmentProofs \
            DelegationProofs \
            DerivationProofs \
            SessionCeilingProofs \
            GkatSyntaxProofs \
            GkatGuardedStringProofs \
            GkatInexpressibleProofs \
            GkatUniquenessFrontierProofs \
            GkatExistenceFrontierProofs \
            GkatDerivativeProofs \
            GkatBisimulationProofs \
            GkatCompletenessProofs \
            GkatDerivativeFiniteProofs \
            GkatDecisionProofs \
            GkatBehaviorProofs \
            GkatInexpressibilityProofs \
            GkatCoequationProofs \
            GkatFaithfulnessProofs \
            GkatKleeneProofs \
            ExposureLoopFixpointProofs \
            GkatGuardedLoopBridge \
            GkatWhileStep \
            SnapshotCloneSafetyProofs \
            DerivationCascadeAdmissible \
            ReceiptChainProofs \
            IFCSemilatticeProofs \
            DelegationCategoryProofs \
            GaloisConnectionProofs \
            AttenuationProofs \
            SemanticIFC \
            MonoidalPermissionProofs \
            ConstructiveSecurity \
            WasiWorldFunctor \
            WasiIfcBoundary \
            BelnapDecisionProofs \
            RepairAlgebraProofs \
            MatrixBridge \
            PortcullisCoreCapQuantale \
            CapabilityResiduatedQuantaleProofs \
            PortcullisCoreIdentity \
            IdentityMaterialNoninterferenceExtracted \
            PortcullisCoreChannel \
            ChannelAdmissionExtracted \
            SnapshotChannelBindingProofs \
            AssuranceCoverage \
            UniversalDetection \
            PodMachineSpike \
            PodCrossView \
            IdentityOracleMirror \
            ConfidentialityOracleMirror \
            IntegrityOracleMirror \
            ChannelOracleMirror
          # CapabilityResiduatedQuantaleProofs: the residuation adjunction
          # (a⊗b≤c ⟺ b≤a⊸c) for capability, proven over the Aeneas-extracted
          # capability_quantale slice — the enriching value V of the
          # Enriched-Reflection model. sorry-free; #print-axioms below.
          # MatrixBridge: the gaussRankBool ↔ Matrix.rank bridge — fully discharged
          # (sorry-free; #print-axioms = propext/Classical.choice/Quot.sound) as of
          # 2026-06-28; promoted research → proven, removed from the GATE-ALLOWLIST.
          # NOTE: CategoryProofs and LabeledTypeProofs are intentionally EXCLUDED
          # — they do not currently compile (Mathlib order-refactor drift /
          # unbound auto-implicits). Tracked as Tier 3 (STALE) in CONJECTURES.md.
          # Re-add them here once repaired so they cannot regress again.

      - name: Proof-hole scan (no sorry/admit outside the research manifest)
        working-directory: crates/portcullis-core/lean
        run: |
          # Comment-aware sorry/admit counter: strips /- -/ block comments and
          # -- line comments, then counts `sorry`/`admit` used as a term token.
          # Matches the local-verification logic in CONJECTURES.md.
          cat > /tmp/count_holes.awk <<'AWK'
          BEGIN{depth=0}
          {
            line=$0; out=""; i=1; L=length(line)
            while(i<=L){
              two=substr(line,i,2)
              if(depth>0){
                if(two=="-/"){depth--; i+=2; continue}
                if(two=="/-"){depth++; i+=2; continue}
                i++; continue
              } else {
                if(two=="/-"){depth++; i+=2; continue}
                if(two=="--"){break}
                out=out substr(line,i,1); i++
              }
            }
            total+=gsub(/(^|[^A-Za-z0-9._'])(sorry|admit)([^A-Za-z0-9_']|$)/,"&",out)
          }
          END{print total+0}
          AWK

          # Research-tier allowlist == the exact file list between the
          # GATE-ALLOWLIST markers in CONJECTURES.md. Parsing keeps the manifest
          # the single source of truth; if it drifts from reality, this gate fails.
          ALLOW="$(awk '/GATE-ALLOWLIST:BEGIN/{f=1; next} /GATE-ALLOWLIST:END/{f=0} f' CONJECTURES.md \
                   | grep -vE '^```' | grep -oE '[A-Za-z]+' | sort -u)"
          if [ -z "$ALLOW" ]; then
            echo "::error::could not parse GATE-ALLOWLIST from CONJECTURES.md"; exit 1
          fi
          echo "Research-tier allowlist (may contain sorry):"
          echo "$ALLOW" | sed 's/^/  /'

          fail=0
          while IFS= read -r f; do
            base="$(basename "$f" .lean)"
            n="$(awk -f /tmp/count_holes.awk "$f")"
            if [ "$n" != "0" ]; then
              if echo "$ALLOW" | grep -qx "$base"; then
                echo "  research-tier (allowed): $f has $n hole(s)"
              else
                echo "::error file=$f::PROVEN-tier file has $n proof hole(s) (sorry/admit) — not allowed. Discharge it, or move it to the research tier in CONJECTURES.md."
                fail=1
              fi
            fi
          done < <(find . -name '*.lean' -not -path './.lake/*')

          if [ "$fail" != "0" ]; then
            echo "FAIL: a proven-tier Lean file regressed into a proof hole."
            exit 1
          fi
          echo "OK: every proof hole is confined to the research tier declared in CONJECTURES.md."

      - name: Assert enforcement core is sorryAx-free (#print axioms)
        working-directory: crates/portcullis-core/lean
        run: |
          # The kernel reports which axioms each theorem actually depends on.
          # A hole anywhere in the dependency graph surfaces as `sorryAx` even
          # if the textual scan missed it. `Lean.ofReduceBool` (native_decide)
          # is expected/disclosed and is NOT a failure.
          cat > PrintAxioms.lean <<'EOF'
          import FlowProofs
          import DeclassifyProofs
          import SessionCeilingProofs
          import ReceiptChainProofs
          import DecidePureProofs
          import CompartmentProofs
          import DelegationProofs
          import ExposureProofs
          import IntegrityNoninterferenceExtracted
          import CapabilityResiduatedQuantaleProofs
          import AssuranceCoverage
          import UniversalDetection
          import ExposureLoopFixpointProofs
          import GkatGuardedLoopBridge
          import GkatWhileStep
          import GkatSyntaxProofs
          import GkatGuardedStringProofs
          import GkatInexpressibleProofs
          import GkatUniquenessFrontierProofs
          import GkatExistenceFrontierProofs
          import GkatDerivativeProofs
          import GkatBisimulationProofs
          import GkatCompletenessProofs
          import GkatDerivativeFiniteProofs
          import GkatDecisionProofs
          import GkatBehaviorProofs
          import GkatInexpressibilityProofs
          import GkatCoequationProofs
          import GkatFaithfulnessProofs
          import GkatKleeneProofs
          import SnapshotCloneSafetyProofs
          import DerivationCascadeAdmissible
          import SnapshotChannelBindingProofs
          #print axioms FlowProofs.authority_confinement_left
          #print axioms GkatSyntax.salomaa_solutions_agree
          #print axioms GkatGS.sound
          #print axioms GkatGS.left_distrib_fails
          #print axioms GkatGS.left_distrib_not_gkat_theorem
          #print axioms GkatInexpr.InLoop_exits_on_not_b
          #print axioms GkatInexpr.single_b_loop_strictly_weaker
          #print axioms GkatUniqFrontier.two_state_semantic_uniqueness
          #print axioms GkatUniqFrontier.productivity_is_necessary
          #print axioms GkatExistFrontier.two_state_existence_pure_return
          #print axioms GkatDeriv.den_cons
          #print axioms GkatDeriv.decDen
          #print axioms GkatBisim.bisim_sound
          #print axioms GkatComplete.bisim_upto_iff
          #print axioms GkatDeriv.derivs_closed
          #print axioms GkatDeriv.den_run
          #print axioms GkatDeriv.nonempty_iff_run_halts
          #print axioms GkatBehavior.langDeriv_den
          #print axioms GkatDeriv.loop_deriv_halts_on_not_b
          #print axioms GkatDeriv.loop_no_complementary
          #print axioms GkatDeriv.complementary_accBounded_false
          #print axioms GkatDeriv.Reaches.trans
          #print axioms GkatDeriv.loopActive_step
          #print axioms GkatDeriv.reaches_mem_derivs
          #print axioms GkatDeriv.no_selfcycle_act
          #print axioms GkatDeriv.selfCyclic_loopActive
          #print axioms GkatDeriv.cycle_common_bound
          #print axioms GkatDeriv.no_mutreach_complementary
          #print axioms GkatDeriv.list_pigeonhole
          #print axioms GkatDeriv.fig3_inexpressible
          #print axioms GkatCoequation.W_den_test
          #print axioms GkatCoequation.W_den_act
          #print axioms GkatCoequation.W_den_seq
          #print axioms GkatCoequation.W_derivs_seq
          #print axioms GkatCoequation.W_derivs_ite
          #print axioms GkatCoequation.W_derivs_wh
          #print axioms GkatCoequation.den_mem_W
          #print axioms GkatCoequation.W_not_subset_den
          #print axioms GkatCoequation.localDet_den
          #print axioms GkatCoequation.deterministic_den
          #print axioms GkatCoequation.halt_not_bexp_not_den
          #print axioms GkatFaithful.left_distrib_not_ba_theorem
          #print axioms GkatFaithful.two_state_uniqueness_nonvacuous
          #print axioms GkatFaithful.loop_is_union_of_iterations
          #print axioms GkatKleene.firstMatch_transG
          #print axioms GkatKleene.autLang_derivAut
          #print axioms GkatKleene.WF_derivAut
          #print axioms GkatKleene.Nested_derivAut
          #print axioms GkatKleene.fig3_not_nested
          #print axioms GkatKleene.autLang_eq_of_gbisim
          #print axioms GkatKleene.den_foldr_ite
          #print axioms GkatKleene.loopAut_solves
          #print axioms GkatKleene.sem_solves_autLang
          #print axioms GkatKleene.solves_autLang
          #print axioms GkatKleene.semSolves_derivAut
          #print axioms GkatKleene.buildSol_solves
          #print axioms GkatKleene.acyclic_expressible
          #print axioms GkatKleene.selfLoop_solves
          #print axioms GkatKleene.loopExitAut_solves
          #print axioms GkatKleene.loopExitAut_expressible
          #print axioms GkatKleene.wnSol_solves
          #print axioms GkatKleene.wn_expressible
          #print axioms GkatKleene.AutMutReach.trans
          #print axioms GkatKleene.AutBelow.trans
          #print axioms GkatKleene.AutBelow.congr_left
          #print axioms GkatKleene.reachCount_lt_of_below
          #print axioms GkatKleene.reachCount_eq_of_mutReach
          #print axioms GkatKleene.reachCount_step_le
          #print axioms GkatKleene.reachCount_lt_of_step_not_mutReach
          #print axioms GkatKleene.autBelow_wf
          #print axioms GkatKleene.firstMatch_eq_of_mem_det
          #print axioms GkatKleene.acyclic_flat_expressible
          #print axioms GkatKleene.flat_selfloop_expressible
          #print axioms GkatKleene.wnSolE_solves
          #print axioms GkatKleene.loopChain_solves
          #print axioms GkatKleene.loop2Aut_semsolves
          #print axioms GkatKleene.loop2Aut_expressible
          #print axioms GkatKleene.loopAut_expressible
          #print axioms IntegrityNoninterferenceExtracted.web_tainted_never_git_pushes
          #print axioms CapabilityResiduatedQuantaleProofs.residuation_adjunction
          #print axioms Nucleus.Assurance.suite_not_full
          #print axioms PortcullisCore.UniversalDetection.universal_detection_impossibility
          #print axioms ExposureLoop.loop_admissible
          #print axioms ExposureLoop.ceilingFold_eq_lfp
          #print axioms GkatBridge.guarded_loop_is_lfp
          #print axioms GkatWhile.whileStep_ratchets
          #print axioms GkatWhile.solution_unique
          #print axioms SnapshotCloneSafety.unsafe_persists_under_superset
          #print axioms DerivationCascade.user_cascade_ratchets
          #print axioms SnapshotChannelBinding.mappable_keys_never_reach_workload_via_cmdline
          EOF
          AXIOMS="$(lake env lean PrintAxioms.lean 2>&1 || true)"
          echo "$AXIOMS"
          rm -f PrintAxioms.lean
          if echo "$AXIOMS" | grep -q 'sorryAx'; then
            echo "::error::an enforcement-core theorem depends on sorryAx (an unproven hole)."
            exit 1
          fi
          if echo "$AXIOMS" | grep -q 'ofReduceBool'; then
            echo "NOTE: native_decide (Lean.ofReduceBool) is in the TCB of the audited theorems — disclosed, see CONJECTURES.md."
          fi
          echo "OK: audited enforcement-core theorems are sorryAx-free."

# Boot a real nucleus pod, and check the artifact pins still resolve.
#
# WHY THIS EXISTS
#
# Before this workflow, `firecracker` appeared in exactly one file under
# .github/workflows — release.yml, which BUILDS a rootfs and never boots one.
# Nothing in CI started a microVM, so nothing in CI could notice that:
#
#   * both published Lima templates pinned a kernel URL returning HTTP 404;
#   * `nucleus setup` installed neither nucleus-node nor a rootfs;
#   * the systemd unit it wrote named three environment variables the node does
#     not read, and none of the three secrets the node requires;
#   * `nucleus doctor` printed "All checks passed" in the same minute
#     `nucleus start` exited 1.
#
# Every one of those was found by a human running the quickstart by hand on
# 2026-07-29. This workflow is what would have caught them.
#
# WHAT IS AND IS NOT COVERED — READ BEFORE TRUSTING A GREEN TICK
#
# The boot job runs on **x86_64**, because GitHub's hosted arm64 runners do not
# support nested virtualisation and so have no /dev/kvm; there is no arm64
# runner tier that does. So this gates the *nucleus* half of the quickstart —
# guest-init, identity, the task token, and enforcement — on every change, and
# it does NOT gate the Apple-Silicon-specific half: Lima, the vz driver, nested
# virtualisation, and the aarch64 rootfs.
#
# Those are verified by a human running `nucleus verify --tier2` on an Apple
# Silicon Mac before a release. This file says so rather than letting a green
# tick imply coverage that does not exist.

name: quickstart-boot

on:
  pull_request:
    paths:
      - "crates/nucleus-cli/**"
      - "crates/nucleus-node/**"
      - "crates/nucleus-spec/**"
      - "crates/nucleus-guest-init/**"
      - "crates/nucleus-tool-proxy/**"
      - "scripts/firecracker/**"
      - "scripts/lima/**"
      - ".github/workflows/quickstart-boot.yml"
  push:
    branches: [main]
  schedule:
    # The pins point at other people's servers. A weekly run catches an artifact
    # moving or disappearing before a user does.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  pins-resolve:
    name: pinned artifacts still resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
      - name: Print the pin manifest
        id: pins
        run: |
          cargo run -q -p nucleus-cli -- verify --pins > pins.json
          cat pins.json

      - name: Kernels must resolve and match their baked digest
        run: |
          set -euo pipefail
          fail=0
          # Kernels are the only pins with a digest compiled into the binary, so
          # they are the only ones that can be checked without trusting the
          # server that serves them. Treated as hard failures for that reason.
          jq -r 'map(select(.kind == "kernel")) | .[] | "\(.arch)\t\(.url)\t\(.sha256)"' pins.json |
          while IFS=$'\t' read -r arch url want; do
            echo "::group::kernel $arch"
            if ! curl -fsSL -o kernel.bin "$url"; then
              echo "::error::pinned kernel for $arch does not resolve: $url"
              fail=1; echo "::endgroup::"; continue
            fi
            got=$(sha256sum kernel.bin | cut -d' ' -f1)
            if [ "$got" != "$want" ]; then
              echo "::error::kernel digest mismatch for $arch: want $want got $got"
              fail=1
            else
              echo "ok: $arch $got"
            fi
            rm -f kernel.bin
            echo "::endgroup::"
          done
          exit $fail

      - name: Release assets — missing is an error, unpublished is a notice
        run: |
          set -euo pipefail
          version=$(jq -r 'map(select(.release)) | .[0].release' pins.json)
          # Distinguish the two states deliberately. "The pinned release has not
          # been cut yet" is a known, tracked condition and must not be reported
          # as rot; "the release exists but an asset is gone" is exactly the rot
          # this job is for.
          if ! curl -fsSL -o release.json \
              "https://api.github.com/repos/coproduct-opensource/nucleus/releases/tags/v${version}"; then
            echo "::notice::pinned guest release v${version} is not published yet; \
          the clean-machine quickstart cannot install release artifacts until it is. \
          Build locally with: nucleus setup --artifacts local"
            exit 0
          fi
          fail=0
          for name in $(jq -r 'map(select(.release)) | .[] | .url | split("/") | last' pins.json | sort -u); do
            if jq -e --arg n "$name" '.assets[] | select(.name == $n)' release.json >/dev/null; then
              echo "ok: $name"
            else
              echo "::error::release v${version} is missing asset $name"
              fail=1
            fi
          done
          exit $fail

  boot-a-real-pod:
    name: a real nucleus pod boots and is enforced (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: This runner must actually have KVM
        run: |
          # Asserted, not assumed. Without /dev/kvm Firecracker does not start,
          # and every later step would fail for a reason that looks like nucleus.
          test -e /dev/kvm || { echo "::error::no /dev/kvm on this runner"; exit 1; }
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Build the guest and host binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools e2fsprogs
          cargo build --release --target x86_64-unknown-linux-musl \
            -p nucleus-cli -p nucleus-node -p nucleus-guest-init \
            -p nucleus-tool-proxy -p nucleus-net-probe

      - name: Build the guest rootfs
        run: |
          # The CA bundle this installs is load-bearing: without it the
          # tool-proxy's drand client fails and, as PID 1, takes the guest
          # kernel with it (#2110).
          ARCH=x86_64 ./scripts/firecracker/build-rootfs.sh
          test -s build/firecracker/x86_64/rootfs.ext4

      - name: Install this build as the Tier 2 host
        run: |
          sudo cp target/x86_64-unknown-linux-musl/release/nucleus /usr/local/bin/nucleus
          # --artifacts local: gate THIS commit, not the last release. Using
          # release artifacts here would test a build nobody is proposing.
          nucleus setup --skip-verify --artifacts local

      - name: Boot a real pod and assert what the guest did
        run: |
          # The whole point. Asserts, in order: the pod is created; a permitted
          # command runs INSIDE the microVM; a forbidden command is DENIED; and
          # the guest fetched its SVID and its task token over vsock.
          nucleus verify --tier2 --here

      - name: Show the guest log on failure
        if: failure()
        run: |
          sudo find /var/lib/nucleus/state -name firecracker.log -exec tail -50 {} \; || true
          sudo journalctl -u nucleus-node --no-pager -n 50 || true

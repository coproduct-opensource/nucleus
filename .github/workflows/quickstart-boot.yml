# Boot a real nucleus pod, and check the artifact pins still resolve.
#
# WHY THIS EXISTS
#
# Before this workflow, `firecracker` appeared in exactly one file under
# .github/workflows — release.yml, which BUILDS a rootfs and never boots one.
# Nothing in CI started a microVM, so nothing in CI could notice that:
#
#   * both published Lima templates pinned a kernel URL returning HTTP 404;
#   * `nucleus setup` installed neither nucleus-node nor a rootfs;
#   * the systemd unit it wrote named three environment variables the node does
#     not read, and none of the three secrets the node requires;
#   * `nucleus doctor` printed "All checks passed" in the same minute
#     `nucleus start` exited 1.
#
# Every one of those was found by a human running the quickstart by hand on
# 2026-07-29. This workflow is what would have caught them.
#
# WHAT IS AND IS NOT COVERED — READ BEFORE TRUSTING A GREEN TICK
#
# The boot job runs on **x86_64**, because GitHub's hosted arm64 runners do not
# support nested virtualisation and so have no /dev/kvm; there is no arm64
# runner tier that does. So this gates the *nucleus* half of the quickstart —
# guest-init, identity, the task token, and enforcement — on every change, and
# it does NOT gate the Apple-Silicon-specific half: Lima, the vz driver, nested
# virtualisation, and the aarch64 rootfs.
#
# Those are verified by a human running `nucleus verify --tier2` on an Apple
# Silicon Mac before a release. This file says so rather than letting a green
# tick imply coverage that does not exist.

name: quickstart-boot

on:
  pull_request:
    paths:
      - "crates/nucleus-cli/**"
      - "crates/nucleus-node/**"
      - "crates/nucleus-spec/**"
      - "crates/nucleus-guest-init/**"
      - "crates/nucleus-tool-proxy/**"
      # The empirical FM-5 checker whose PASS/FAIL sentinel this gate reads —
      # a PR weakening only the probe or its spec must re-trigger the boot gate.
      - "crates/nucleus-workload-probe/**"
      # The C6 phase-2 egress backstop probe and its host-side falsifier — a PR
      # weakening only the probe must re-trigger the boot gate and the falsifier.
      - "crates/nucleus-egress-probe/**"
      - "scripts/check-egress-probe.sh"
      - "examples/openclaw-demo/probe-pod.yaml"
      - "scripts/firecracker/**"
      - "scripts/lima/**"
      - ".github/workflows/quickstart-boot.yml"
  push:
    branches: [main]
  schedule:
    # The pins point at other people's servers. A weekly run catches an artifact
    # moving or disappearing before a user does.
    - cron: "17 6 * * 1"
  # So the aarch64 job can be exercised on demand instead of only on the weekly
  # cron — a gate nobody can trigger is a gate nobody validates.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  egress-probe-falsifier:
    # The C6 phase-2 host-side falsifier. It needs no KVM and no booted microVM —
    # only netns + iptables + sudo, which an ubuntu runner has — so it runs on
    # every triggering PR even though the boot job below is x86_64-KVM-gated and
    # not required. It reconstructs the exact net::apply_default_deny fence in a
    # namespace and asserts the probe PASSes with the fence present, FAILs when
    # it is removed (reds-on-regression), and FAILs when loopback is also blocked
    # (the anti-vacuity guard). This is the always-on guard against the probe
    # silently rotting while the boot gate is unenforced.
    name: egress probe tracks the default-deny fence (netns falsifier)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - name: Build the egress probe
        run: cargo build --release -p nucleus-egress-probe
      - name: Falsify — the probe must track the fence in all three states
        run: |
          # iptables is present on ubuntu-24.04; the script uses sudo for netns.
          EGRESS_PROBE_BIN=target/release/nucleus-egress-probe \
            scripts/check-egress-probe.sh

  pins-resolve:
    name: pinned artifacts still resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - name: Print the pin manifest
        id: pins
        run: |
          cargo run -q -p nucleus-cli -- verify --pins > pins.json
          cat pins.json

      - name: Kernels must resolve and match their baked digest
        run: |
          set -euo pipefail
          fail=0
          # Read from a redirect, NOT `... | while read`: a pipeline runs the loop
          # in a SUBSHELL, so `fail=1` set inside it is lost and the final
          # `exit $fail` always sees 0. That is a gate that cannot go red — the
          # exact defect this workflow exists to catch, and the first version of
          # this step had it.
          jq -r 'map(select(.kind == "kernel")) | .[] | "\(.arch)\t\(.url)\t\(.sha256)"' \
            pins.json > kernels.tsv
          # Non-vacuity: an empty list would satisfy every check below.
          test -s kernels.tsv || { echo "::error::no kernel pins found"; exit 1; }
          while IFS=$'\t' read -r arch url want; do
            echo "::group::kernel $arch"
            if ! curl -fsSL -o kernel.bin "$url"; then
              echo "::error::pinned kernel for $arch does not resolve: $url"
              fail=1
            else
              got=$(sha256sum kernel.bin | cut -d' ' -f1)
              if [ "$got" != "$want" ]; then
                echo "::error::kernel digest mismatch for $arch: want $want got $got"
                fail=1
              else
                echo "ok: $arch $got"
              fi
              rm -f kernel.bin
            fi
            echo "::endgroup::"
          done < kernels.tsv
          exit $fail

      - name: Release assets — missing is an error, unpublished is a notice
        run: |
          set -euo pipefail
          version=$(jq -r 'map(select(.release)) | .[0].release' pins.json)
          # Two states, deliberately distinguished. "The pinned release has not
          # been cut yet" is known and tracked, and must not be reported as rot;
          # "the release exists but an asset is gone" is exactly the rot this job
          # is for.
          if ! curl -fsSL -o release.json \
              "https://api.github.com/repos/coproduct-opensource/nucleus/releases/tags/v${version}"; then
            echo "::notice::pinned guest release v${version} is not published yet; the clean-machine quickstart cannot install release artifacts until it is. Build locally with: nucleus setup --artifacts local"
            exit 0
          fi
          fail=0
          jq -r 'map(select(.release)) | .[] | .url | split("/") | last' pins.json | sort -u > wanted.txt
          test -s wanted.txt || { echo "::error::no release-asset pins found"; exit 1; }
          while read -r name; do
            if jq -e --arg n "$name" '.assets[] | select(.name == $n)' release.json >/dev/null; then
              echo "ok: $name"
            else
              echo "::error::release v${version} is missing asset $name"
              fail=1
            fi
          done < wanted.txt
          exit $fail

  # Weekly aarch64 coverage, on hardware that can actually boot a microVM.
  #
  # WHY THIS IS SEPARATE, WEEKLY, AND OFF BY DEFAULT
  #
  # The x86_64 job below gates the nucleus half of the quickstart on every change.
  # What it cannot cover is anything aarch64-SPECIFIC: the arm64 kernel digest and
  # the arm64 rootfs build. No GitHub-hosted runner can — arm64 runners have no
  # /dev/kvm, macOS runners cannot nest (Virtualization.framework), and EC2's
  # nested-virt-on-VMs launch is Intel-only. arm64 + KVM means bare metal.
  #
  # So this runs on a self-hosted ephemeral arm64 metal runner, WEEKLY rather than
  # per-PR: the arm-specific risk is narrow, and a per-PR metal instance is ~20
  # minutes of billed time per run for coverage that changes rarely.
  #
  # It is INERT until `vars.ARM64_METAL_RUNNER` is set to the runner label. With
  # the variable unset the job is skipped, so this file does not fail for anyone
  # who has not provisioned one.
  #
  # WHAT IT STILL DOES NOT COVER — and no amount of money would
  #
  # The Apple Silicon layer: Lima, the `vz` driver, and macOS nested
  # virtualisation. That exists only on Apple hardware and no hosted Apple runner
  # exposes nesting, so `nucleus verify --tier2` on an Apple Silicon Mac remains a
  # human pre-release step. This job narrows the gap; it does not close it.
  boot-a-real-pod-aarch64:
    name: a real nucleus pod boots and is enforced (aarch64, weekly)
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.ARM64_METAL_RUNNER != '' }}
    runs-on: ${{ vars.ARM64_METAL_RUNNER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl

      # Asserted, because the architecture IS the point of this job. A silently
      # x86 runner would duplicate the job below and report aarch64 coverage that
      # never happened.
      - name: This runner must be arm64 with KVM and vsock
        run: |
          test "$(uname -m)" = "aarch64" || {
            echo "::error::expected an aarch64 runner, got $(uname -m)"; exit 1; }
          test -e /dev/kvm || { echo "::error::no /dev/kvm on this runner"; exit 1; }
          sudo modprobe vhost_vsock || true
          test -e /dev/vhost-vsock || { echo "::error::no /dev/vhost-vsock"; exit 1; }
          sudo chmod 666 /dev/kvm

      - name: Build the guest and host binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools e2fsprogs
          rustup target add aarch64-unknown-linux-musl
          rustup target list --installed | grep -q aarch64-unknown-linux-musl
          cargo build --release --target aarch64-unknown-linux-musl \
            -p nucleus-cli -p nucleus-node -p nucleus-guest-init \
            -p nucleus-tool-proxy -p nucleus-net-probe

      - name: Build the guest rootfs
        run: |
          ARCH=aarch64 bash ./scripts/firecracker/build-rootfs.sh
          test -s build/firecracker/aarch64/rootfs.ext4

      - name: Install this build as the Tier 2 host
        run: |
          sudo cp target/aarch64-unknown-linux-musl/release/nucleus /usr/local/bin/nucleus
          nucleus setup --skip-verify --artifacts local

      - name: Boot a real pod and assert what the guest did
        run: nucleus verify --tier2 --here

      - name: Show the guest log on failure
        if: failure()
        run: |
          sudo find /var/lib/nucleus/state -name firecracker.log -exec tail -50 {} \; || true
          sudo journalctl -u nucleus-node --no-pager -n 50 || true

  boot-a-real-pod:
    name: a real nucleus pod boots and is enforced (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          # `toolchain` is REQUIRED when the action is pinned by SHA: the tag name
          # is what would otherwise supply it, and a SHA carries no tag.
          #
          # The `targets:` input is deliberately NOT used here. It installs the
          # target for the toolchain the ACTION selects, but `rust-toolchain.toml`
          # pins the channel cargo actually uses (1.96.1) — so the target landed
          # on `stable` and the build ran on 1.96.1 without it, failing with
          # "can't find crate for `std`". Added explicitly below instead, against
          # whichever toolchain the pin resolves to.
          toolchain: stable

      - name: This runner must actually have KVM
        run: |
          # Asserted, not assumed. Without /dev/kvm Firecracker does not start,
          # and every later step would fail for a reason that looks like nucleus.
          test -e /dev/kvm || { echo "::error::no /dev/kvm on this runner"; exit 1; }
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          # Firecracker's vsock device needs vhost-vsock, and the guest fetches
          # its SVID and task token over that channel. Asserted, not assumed:
          # without it the pod fails at device setup, far from anything that
          # names vsock.
          sudo modprobe vhost_vsock
          test -e /dev/vhost-vsock || { echo "::error::no /dev/vhost-vsock"; exit 1; }
          ls -l /dev/vhost-vsock

      - name: Build the guest and host binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools e2fsprogs
          # Against the toolchain `rust-toolchain.toml` selects, not the one the
          # setup action installed. Asserted, because a missing target fails deep
          # in a dependency build with a message about `std` rather than about
          # the target.
          rustup target add x86_64-unknown-linux-musl
          rustup target list --installed | grep -q x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl \
            -p nucleus-cli -p nucleus-node -p nucleus-guest-init \
            -p nucleus-tool-proxy -p nucleus-net-probe -p nucleus-workload-probe \
            -p nucleus-egress-probe -p nucleus-adversary-probe

      - name: Build the guest rootfs
        run: |
          # The CA bundle this installs is load-bearing: without it the
          # tool-proxy's drand client fails and, as PID 1, takes the guest
          # kernel with it (#2110).
          # `bash <script>`, not `./<script>`: the file is mode 100644 in git, so
          # executing it directly fails with "Permission denied" (exit 126).
          # release.yml chmods it first; invoking the interpreter avoids mutating
          # the tree to work around a file mode.
          #
          # POD_SPEC points the baked /etc/nucleus/pod.yaml at the probe pod: its
          # `workload` is `nucleus-workload-probe`, which asserts the FM-5 posture
          # on the REAL guest child and prints a PASS/FAIL sentinel the verify
          # step reads back from firecracker.log. This makes the boot job a
          # blocking gate on the posture holding empirically, not just in Lean.
          POD_SPEC="$PWD/examples/openclaw-demo/probe-pod.yaml" \
            ARCH=x86_64 bash ./scripts/firecracker/build-rootfs.sh
          test -s build/firecracker/x86_64/rootfs.ext4

      - name: Install this build as the Tier 2 host
        run: |
          sudo cp target/x86_64-unknown-linux-musl/release/nucleus /usr/local/bin/nucleus
          # --artifacts local: gate THIS commit, not the last release. Using
          # release artifacts here would test a build nobody is proposing.
          nucleus setup --skip-verify --artifacts local

      - name: Plant a canary in the NODE's environment
        shell: bash
        run: |
          # The node's environment holds every HMAC secret the runtime has, and
          # the guest is the thing the sandbox contains. This plants a value
          # there so `verify --tier2` can assert it does NOT surface in the
          # guest — an assertion that is meaningless without a real secret to
          # look for, which is why the check REFUSES rather than skips when
          # NUCLEUS_E2E_CANARY is unset.
          #
          # /etc/nucleus/node.env already exists at mode 0600 and is
          # EnvironmentFile'd into the systemd unit — see provision::node_env_body.
          CANARY="nucleus-e2e-canary-$(openssl rand -hex 12)"
          echo "NUCLEUS_E2E_CANARY=$CANARY" | sudo tee -a /etc/nucleus/node.env >/dev/null
          sudo systemctl restart nucleus-node || sudo nucleus start || true
          # Exported for the verifier, NOT written anywhere the guest can read.
          echo "NUCLEUS_E2E_CANARY=$CANARY" >> "$GITHUB_ENV"

      - name: Boot a real pod and assert what the guest did
        shell: bash
        run: |
          # The whole point. Asserts, in order: the pod is created; a permitted
          # command runs INSIDE the microVM; a forbidden command is DENIED; the
          # guest fetched its SVID and its task token over vsock; and no secret
          # from the node's environment surfaced inside the guest.
          nucleus verify --tier2 --here

      - name: The in-guest posture probe actually ran (presence, not just verdict)
        run: |
          # verify's probe needle is conditional on the sentinel appearing, so it
          # cannot fail vacuously — but a probe that failed to EXEC (missing from
          # the rootfs, wrong path, unable to run under its uid) emits no sentinel
          # at all, and the conditional needle would then say nothing. Assert the
          # PASS sentinel is PRESENT in SOME pod's log, closing that gap: the probe
          # ran as the real workload and reported the posture holds. grep -r across
          # every pod's log, not one arbitrary `head -1` — `nucleus verify` boots
          # several pods and only the probe-workload pod carries the sentinel.
          state=/var/lib/nucleus/state
          sudo find "$state" -name firecracker.log | head -1 | grep -q . || {
            echo "::error::no firecracker.log found"; exit 1; }
          sudo grep -rq "NUCLEUS_WORKLOAD_PROBE: PASS" "$state" || {
            echo "::error::in-guest workload probe did not report PASS (did it run?)"
            echo "--- workload markers across all pod logs (empty ⇒ the drain never ran) ---"
            sudo grep -rhaE '\[workload\]|NUCLEUS_WORKLOAD_PROBE|PROXY-CHAN-PROBE' "$state" | head -40 || true
            echo "--- last 60 lines of each guest log ---"
            sudo find "$state" -name firecracker.log -exec sh -c 'echo "== $1 =="; tail -60 "$1"' _ {} \; || true
            exit 1
          }
          ! sudo grep -rq "NUCLEUS_WORKLOAD_PROBE: FAIL" "$state" || {
            echo "::error::in-guest workload probe reported FAIL"
            sudo grep -rhaE '\[workload\]|NUCLEUS_WORKLOAD_PROBE: FAIL' "$state" | head -40 || true
            exit 1
          }
          echo "in-guest workload probe: PASS present, FAIL absent"

      - name: The in-guest egress backstop actually held (C6 phase 2, presence + verdict)
        run: |
          # The egress probe runs as the same booted workload (network.allow: []),
          # so the pod is under net::apply_default_deny. It asserts, from inside
          # the live guest, that a non-allowlisted TCP connect FAILS
          # (ENETUNREACH) while a socketpair round-trip (the anti-vacuity positive
          # control) succeeds — i.e. the netns default-deny is applied on boot,
          # converting C6 channels 5/10 from *documented* to *runtime-observed*.
          # (DNS fail-closed, channel 6, is gated separately by
          # the_dns_proxy_has_no_upstream_and_cannot_forward.) Same fail-closed shape
          # as the workload probe: PASS must be PRESENT (a probe that never ran
          # emits nothing and must not read as conformant), FAIL must be ABSENT.
          state=/var/lib/nucleus/state
          sudo grep -rq "NUCLEUS_EGRESS_PROBE: PASS" "$state" || {
            echo "::error::in-guest egress probe did not report PASS (did it run? is the fence applied?)"
            echo "--- egress markers across all pod logs (empty ⇒ the probe never ran) ---"
            sudo grep -rhaE 'NUCLEUS_EGRESS_PROBE|NUCLEUS_EGRESS_CHECK' "$state" | head -40 || true
            echo "--- last 60 lines of each guest log ---"
            sudo find "$state" -name firecracker.log -exec sh -c 'echo "== $1 =="; tail -60 "$1"' _ {} \; || true
            exit 1
          }
          ! sudo grep -rq "NUCLEUS_EGRESS_PROBE: FAIL" "$state" || {
            echo "::error::in-guest egress probe reported FAIL — the netns default-deny was NOT applied on the live guest"
            sudo grep -rhaE 'NUCLEUS_EGRESS_PROBE: FAIL|NUCLEUS_EGRESS_CHECK' "$state" | head -40 || true
            exit 1
          }
          echo "in-guest egress backstop: PASS present, FAIL absent"

      - name: The in-guest adversary was contained (active attacker, presence + verdict)
        run: |
          # nucleus-adversary-probe runs as the same booted workload — an ACTIVE
          # attacker that tries to steal a mediator secret from PID 1, tamper the
          # read-only rootfs, and exfiltrate. It emits NUCLEUS_ADVERSARY: CONTAINED
          # only if a live positive control AND every stage attempted AND every
          # attack was blocked. Same fail-closed + anti-vacuity shape as the other
          # probes, plus the mid-crash guard: assert CONTAINED present, BREACH
          # absent, the positive control live, and every expected stage line
          # present (a probe that died after stage 1 is missing later stages and
          # must not read as contained).
          state=/var/lib/nucleus/state
          sudo grep -rq "NUCLEUS_ADVERSARY: CONTAINED" "$state" || {
            echo "::error::in-guest adversary probe did not report CONTAINED (did it run? was it contained?)"
            echo "--- adversary markers across all pod logs (empty ⇒ the probe never ran) ---"
            sudo grep -rhaE 'NUCLEUS_ADVERSARY' "$state" | head -40 || true
            echo "--- last 60 lines of each guest log ---"
            sudo find "$state" -name firecracker.log -exec sh -c 'echo "== $1 =="; tail -60 "$1"' _ {} \; || true
            exit 1
          }
          if sudo grep -rqE "NUCLEUS_ADVERSARY: BREACH" "$state"; then
            echo "::error::in-guest adversary BREACHED the sandbox — an attack succeeded on the live guest"
            sudo grep -rhaE 'NUCLEUS_ADVERSARY' "$state" | head -40 || true
            exit 1
          fi
          sudo grep -rq "NUCLEUS_ADVERSARY_CONTROL: live" "$state" || {
            echo "::error::adversary positive control was not live — a dead attacker cannot certify containment"
            exit 1
          }
          # Every stage must have run: a crash after stage 1 would be missing later
          # stage lines, and CONTAINED-with-missing-stages is the mid-crash hole.
          for stage in pid1-secret-theft rootfs-tamper exfil; do
            sudo grep -rq "NUCLEUS_ADVERSARY_STAGE $stage: attempted=yes" "$state" || {
              echo "::error::adversary stage '$stage' did not run (attempted=yes line absent) — the campaign was incomplete"
              exit 1
            }
          done
          echo "in-guest adversary: CONTAINED present, BREACH absent, control live, all stages attempted"

      - name: A signed MediationReceipt was emitted on the live path (presence + shape)
        run: |
          # The end-to-end tooth for the receipt arc: `verify --tier2` runs a
          # PERMITTED command (allow) and a FORBIDDEN command (deny) through the
          # guest tool-proxy. With Article 12 record-keeping on (exec_proxy passes
          # --art12-log) and a mediator signing key delivered to the guest over
          # vsock (FETCH_MEDIATION_KEY), each of those verdicts is signed into a
          # MediationReceipt, and the proxy mirrors the seq|hash|verdict to the
          # guest console (NUCLEUS-MEDIATION-RECEIPT) — the one telemetry the host
          # can read back. If the key delivery, the art12 wiring, or the signer
          # regressed, NO marker appears here and this step reds. That is the
          # point: the receipt must exist on a REAL booted pod, not only in a
          # unit test.
          state=/var/lib/nucleus/state
          markers=$(sudo grep -rhaE 'NUCLEUS-MEDIATION-RECEIPT [0-9]+\|[0-9a-f]+\|' "$state" || true)
          if [ -z "$markers" ]; then
            echo "::error::no signed MediationReceipt was emitted on the live path (receipt wiring regressed: key delivery, --art12-log, or the signer)"
            echo "--- any receipt markers across all pod logs (empty ⇒ none emitted) ---"
            sudo grep -rhaE 'NUCLEUS-MEDIATION-RECEIPT' "$state" | head -40 || true
            echo "--- last 60 lines of each guest log ---"
            sudo find "$state" -name firecracker.log -exec sh -c 'echo "== $1 =="; tail -60 "$1"' _ {} \; || true
            exit 1
          fi
          count=$(printf '%s\n' "$markers" | grep -c .)
          echo "signed MediationReceipt emitted on the live path: $count well-formed marker(s)"
          printf '%s\n' "$markers" | head -8

      - name: A relying party verifies the pod's receipts against a node-anchored key
        run: |
          # The marker step above proves receipts were EMITTED. This one is the
          # host-side relying-party check: recover the FULL signed receipts from
          # the guest console (a Firecracker host cannot read the guest's /run
          # receipt file, so the proxy mirrors each full receipt as
          # NUCLEUS-MEDIATION-RECEIPT-JSON) and verify every signature with the
          # OFFLINE verifier — the same `nucleus-audit verify-mediation-receipts`
          # a third party would run.
          #
          # The key those signatures verify under is not taken on the guest's
          # word: the guest self-publishes its mediator pubkey
          # (NUCLEUS-MEDIATION-PUBKEY), and this step accepts it only after finding
          # the SAME pubkey in a host-side file the NODE wrote when it minted the
          # key (<pod_dir>/mediator-pubkey.hex, which the guest cannot reach). So
          # the receipts verify under a node-anchored key, not a self-asserted one.
          # (Trust of that key's SVID attestation is the further cross-check
          # verify_attested_receipt performs; it is not claimed here.)
          set -uo pipefail
          state=/var/lib/nucleus/state
          cargo build --release -p nucleus-audit
          audit="$PWD/target/release/nucleus-audit"

          # The set of pubkeys the NODE minted, from its host-side anchor files.
          # `find -exec cat {} +` handles the empty case without hanging on stdin
          # (a bare `cat $(find …)` with no matches reads stdin and stalls the job);
          # avoiding `mapfile` keeps this portable (matching the repo's bash-3.2 style).
          minted=$(sudo find "$state" -name mediator-pubkey.hex -exec cat {} + 2>/dev/null | tr -s '[:space:]' '\n')
          if [ -z "$minted" ]; then
            echo "::error::no node-side mediator-pubkey.hex anchor found — cannot node-anchor any receipt key"
            exit 1
          fi

          any_json=0
          verified_any=0
          while IFS= read -r log; do
            [ -n "$log" ] || continue
            any_json=1
            tmp=$(mktemp -d)
            sudo cp "$log" "$tmp/fc.log"; sudo chown "$(id -u)" "$tmp/fc.log"
            # The guest SERIAL console uses CRLF line endings, so strip the
            # trailing CR (\r) — otherwise the JSON carries a stray \r and, more
            # sharply, the pubkey below would be "…\r" and never whole-line-match
            # the node's clean anchor. (Substring greps elsewhere never hit this.)
            grep -aE '^NUCLEUS-MEDIATION-RECEIPT-JSON ' "$tmp/fc.log" \
              | sed -E 's/^NUCLEUS-MEDIATION-RECEIPT-JSON //; s/\r$//' > "$tmp/receipts.jsonl"
            [ -s "$tmp/receipts.jsonl" ] || continue

            guest_pk=$(grep -aE '^NUCLEUS-MEDIATION-PUBKEY ' "$tmp/fc.log" | tail -1 | awk '{print $2}' | tr -cd '0-9a-f')
            if [ -z "${guest_pk:-}" ]; then
              echo "::error::pod log $log has receipts but no NUCLEUS-MEDIATION-PUBKEY — cannot verify"
              exit 1
            fi
            # The node must have MINTED this exact pubkey. Keys are per-pod-unique,
            # so membership in the minted set is the anchor — no path parsing.
            if ! printf '%s\n' "$minted" | grep -qxF "$guest_pk"; then
              echo "::error::the guest-published mediator pubkey ${guest_pk} was never minted by the node — receipts are not node-anchored"
              echo "--- node-minted pubkeys ---"; printf '%s\n' "$minted" | head -20
              exit 1
            fi

            # Offline relying-party verification under the node-anchored key.
            # verify-mediation-receipts exits non-zero if ANY receipt fails.
            "$audit" verify-mediation-receipts --log "$tmp/receipts.jsonl" --mediator-pubkey "$guest_pk"
            echo "verified $(grep -c . "$tmp/receipts.jsonl") receipt(s) under a node-anchored mediator key ${guest_pk:0:16}…"
            verified_any=1
          done < <(sudo grep -rlaE 'NUCLEUS-MEDIATION-RECEIPT-JSON ' "$state" 2>/dev/null || true)

          if [ "$any_json" -ne 1 ]; then
            echo "::error::no pod emitted full-receipt JSON — the host cannot recover receipts to verify (NUCLEUS-MEDIATION-RECEIPT-JSON absent)"
            sudo find "$state" -name firecracker.log -exec sh -c 'echo "== $1 =="; tail -40 "$1"' _ {} \; || true
            exit 1
          fi
          if [ "$verified_any" -ne 1 ]; then
            echo "::error::no pod produced a verifiable, node-anchored receipt set"
            exit 1
          fi

      - name: Delivery conformance (observed inventory vs the extracted oracle)
        run: |
          # The probe emits its observed environment inventory
          # (NUCLEUS_WORKLOAD_ENV: <name>, names only) into the guest log. This
          # step replays every observed name through the production classifier
          # (env_key_material) and the extracted oracle (ident_may_deliver) — a
          # categorical check behind the probe's hand-enumerated variable list:
          # a NOVEL secret-classified name flunks here even though no list
          # remembers it. Fails closed on an empty inventory: the binary exits
          # non-zero when the needle never appears, so "the probe's evidence
          # never reached the log" cannot read as conformant.
          cargo build --release -p nucleus-delivery-conformance
          state=/var/lib/nucleus/state
          logs=$(sudo find "$state" -name firecracker.log)
          [ -n "$logs" ] || { echo "::error::no firecracker.log found"; exit 1; }
          # Copy root-owned logs somewhere the unprivileged binary can read them,
          # rather than running the checker under sudo.
          tmp=$(mktemp -d)
          i=0
          for f in $logs; do
            sudo cp "$f" "$tmp/log$i"; sudo chown "$(id -u)" "$tmp/log$i"; i=$((i+1))
          done
          ./target/release/nucleus-delivery-conformance "$tmp"/log*

      - name: Show the guest log on failure
        if: failure()
        run: |
          sudo find /var/lib/nucleus/state -name firecracker.log -exec tail -50 {} \; || true
          sudo journalctl -u nucleus-node --no-pager -n 50 || true

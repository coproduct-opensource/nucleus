name: Release

on:
  push:
    tags:
      # `v*.*.*`, NOT `v*`. This workflow MOVES the floating major tag `v2` as
      # its last step, and a ref update is a tag push -- so `v*` made the
      # workflow trigger ITSELF on `v2`, build every asset again, and publish a
      # second GitHub Release literally named "v2".
      #
      # That release is created after the real one, so it becomes "Latest", and
      # `/releases/latest` is exactly what scripts/install.sh resolves. The
      # one-liner would install a release named after a floating pointer instead
      # of the version, and the real v2.2.0 would stop being Latest.
      #
      # It had never happened before only because the `git push origin v2` that
      # moved the tag ALWAYS FAILED on a token permission (see the floating-tag
      # step below). Fixing that push is what made this reachable: the bug was
      # masked by a different bug. Observed 2026-09-02, cleaned up by hand.
      - "v*.*.*"
      - "nucleus-node-v*"
  # DRY RUN. Five of the last seven release attempts failed, because every job
  # below runs ONLY when a tag is pushed — so they rot between releases and the
  # rot is discovered at the worst moment. v2.2.0 alone hit three: release.yml
  # built 3 of the 7 guest binaries the rootfs needs (#2366), both macOS jobs
  # died on `dead_code` promoted by -D warnings (#2367), and the Docker images
  # pinned rust 1.88 against a 1.95 workspace (#2368). All three had been broken
  # since v2.1.0 in July.
  #
  # A daily run builds everything and publishes NOTHING (see the tag guard on
  # `release`), so the build path is exercised every day instead of every
  # release. Deliberately the SAME workflow rather than a copy: a separate
  # dry-run file would drift from the real one, which is the exact failure mode
  # being fixed.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Restrict default permissions - jobs declare what they need
concurrency:
  # Supersede a PR's older in-flight runs; NEVER cancel anything else.
  # cancel-in-progress is scoped to pull_request on purpose: cancelling a
  # merge_group run would abort a queue entry mid-flight, and cancelling a
  # push to main would drop the signal for a commit that already landed.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No cache restore here: this job publishes release binaries, so it must
      # build from scratch to avoid cache-poisoning of trust-bearing artifacts.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
      - name: Add cross-compilation target
        if: matrix.target == 'x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin
      - name: Build
        run: cargo build -p nucleus-node -p nucleus-cli -p nucleus-mcp -p nucleus-audit --release --target ${{ matrix.target }}
      - name: Package
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#nucleus-node-v}"
          VERSION="${VERSION#v}"
          RELEASE_DIR="target/${{ matrix.target }}/release"
          mkdir -p dist
          tar -C "$RELEASE_DIR" -czf "dist/nucleus-node-${VERSION}-${{ matrix.target }}.tar.gz" nucleus-node
          tar -C "$RELEASE_DIR" -czf "dist/nucleus-cli-${VERSION}-${{ matrix.target }}.tar.gz" nucleus
          tar -C "$RELEASE_DIR" -czf "dist/nucleus-mcp-${VERSION}-${{ matrix.target }}.tar.gz" nucleus-mcp
          tar -C "$RELEASE_DIR" -czf "dist/nucleus-audit-${VERSION}-${{ matrix.target }}.tar.gz" nucleus-audit
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nucleus-node-${{ matrix.target }}
          path: dist/*.tar.gz

  # Build static musl binaries for Lima VM (Linux inside macOS)
  build-musl:
    name: Build Musl (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-unknown-linux-musl
          - arch: x86_64
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No cache restore here: this job publishes release binaries/rootfs, so it
      # must build from scratch to avoid cache-poisoning of trust-bearing artifacts.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build nucleus-node (musl)
        run: cross build -p nucleus-node --release --target ${{ matrix.target }}
      - name: Build guest binaries (musl)
        run: |
          cross build -p nucleus-guest-init --release --target ${{ matrix.target }}
          cross build -p nucleus-tool-proxy --release --features remote-audit --target ${{ matrix.target }}
          cross build -p nucleus-net-probe --release --target ${{ matrix.target }}
          # The rootfs needs SEVEN guest binaries; this step built three, so
          # `build-rootfs.sh` failed on the first one it could not find:
          #
          #   Missing target/<triple>/release/nucleus-workload-probe
          #
          # These four were added to the rootfs over time and never added here.
          # Nobody noticed because the failure only surfaces when a release is
          # actually cut, and the last one was v2.1.0 in July — so the rootfs
          # job has been broken for however long that drift has existed.
          #
          # It also explains a thing found separately: `nucleus-egress-probe`
          # was absent from the shipped v2.1.0 rootfs. It was never built.
          cross build -p nucleus-workload-probe --release --target ${{ matrix.target }}
          cross build -p nucleus-egress-probe --release --target ${{ matrix.target }}
          cross build -p nucleus-adversary-probe --release --target ${{ matrix.target }}
          cross build -p nucleus-podlist-probe --release --target ${{ matrix.target }}
      - name: Build CLI + MCP + Audit + Hook (musl)
        run: |
          cross build -p nucleus-cli --release --target ${{ matrix.target }}
          cross build -p nucleus-mcp --release --target ${{ matrix.target }}
          cross build -p nucleus-audit --release --target ${{ matrix.target }}
      - name: Package all binaries
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#nucleus-node-v}"
          VERSION="${VERSION#v}"
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf "dist/nucleus-node-${VERSION}-${{ matrix.target }}.tar.gz" nucleus-node
          tar -C target/${{ matrix.target }}/release -czf "dist/nucleus-cli-${VERSION}-${{ matrix.target }}.tar.gz" nucleus
          tar -C target/${{ matrix.target }}/release -czf "dist/nucleus-mcp-${VERSION}-${{ matrix.target }}.tar.gz" nucleus-mcp
          tar -C target/${{ matrix.target }}/release -czf "dist/nucleus-audit-${VERSION}-${{ matrix.target }}.tar.gz" nucleus-audit
          tar -C target/${{ matrix.target }}/release -czf "dist/nucleus-tool-proxy-${VERSION}-${{ matrix.target }}.tar.gz" nucleus-tool-proxy
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nucleus-binaries-${{ matrix.target }}
          path: dist/*.tar.gz
      - name: Upload guest binaries for rootfs build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: guest-binaries-${{ matrix.arch }}
          # All seven the rootfs needs. Building them is not enough — the
          # rootfs job runs on a different runner and only sees what is
          # uploaded here, so this list and the `cross build` list above must
          # stay in step. `the_release_builds_every_binary_the_rootfs_needs`
          # fails if either drifts from build-rootfs.sh.
          path: |
            target/${{ matrix.target }}/release/nucleus-guest-init
            target/${{ matrix.target }}/release/nucleus-tool-proxy
            target/${{ matrix.target }}/release/nucleus-net-probe
            target/${{ matrix.target }}/release/nucleus-workload-probe
            target/${{ matrix.target }}/release/nucleus-egress-probe
            target/${{ matrix.target }}/release/nucleus-adversary-probe
            target/${{ matrix.target }}/release/nucleus-podlist-probe

  # Build pre-built rootfs images
  build-rootfs:
    name: Build Rootfs (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: build-musl
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            debian_image: arm64v8/debian:bookworm-slim
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            debian_image: debian:bookworm-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download guest binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: guest-binaries-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release
      - name: Set executable permissions
        run: |
          chmod +x target/${{ matrix.target }}/release/nucleus-guest-init
          chmod +x target/${{ matrix.target }}/release/nucleus-tool-proxy
          chmod +x target/${{ matrix.target }}/release/nucleus-net-probe
      - name: Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - name: Build rootfs
        run: |
          chmod +x ./scripts/firecracker/build-rootfs.sh
          ARCH=${{ matrix.arch }} DEBIAN_IMAGE=${{ matrix.debian_image }} ./scripts/firecracker/build-rootfs.sh
      - name: Package rootfs
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#nucleus-node-v}"
          VERSION="${VERSION#v}"
          mkdir -p dist
          gzip -9 -c build/firecracker/${{ matrix.arch }}/rootfs.ext4 > "dist/nucleus-rootfs-${VERSION}-${{ matrix.arch }}.ext4.gz"
      - name: Upload rootfs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rootfs-${{ matrix.arch }}
          path: dist/*.ext4.gz

  # Upload Lima templates
  upload-lima-templates:
    name: Upload Lima Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package Lima templates
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#nucleus-node-v}"
          VERSION="${VERSION#v}"
          mkdir -p dist
          cp scripts/lima/nucleus-aarch64.yaml "dist/nucleus-lima-${VERSION}-aarch64.yaml"
          cp scripts/lima/nucleus-x86_64.yaml "dist/nucleus-lima-${VERSION}-x86_64.yaml"
      - name: Upload Lima templates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lima-templates
          path: dist/*.yaml

  # The dry run's own non-vacuity check. A scheduled run whose jobs all SKIPPED
  # would report success while proving nothing — the same "green because it
  # never ran" shape the dry run exists to catch. So assert the artifacts a
  # real release needs were actually produced.
  #
  # It checks the rootfs images specifically because that is what broke: the
  # first v2.2.0 attempt published 16 assets with ZERO rootfs, and `setup` needs
  # exactly those.
  dry-run-assert:
    name: The dry run actually built a releasable set
    runs-on: ubuntu-latest
    needs: [build, build-musl, build-rootfs, upload-lima-templates]
    if: always() && !startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Every build job must have succeeded
        env:
          B: ${{ needs.build.result }}
          M: ${{ needs.build-musl.result }}
          R: ${{ needs.build-rootfs.result }}
          L: ${{ needs.upload-lima-templates.result }}
        run: |
          set -euo pipefail
          fail=0
          for pair in "build:$B" "build-musl:$M" "build-rootfs:$R" "upload-lima-templates:$L"; do
            name=${pair%%:*}; res=${pair#*:}
            if [ "$res" != "success" ]; then
              echo "::error::$name was '$res' — the release path is broken TODAY, not at the next tag"
              fail=1
            fi
          done
          exit $fail

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rootfs-*
          path: rootfs

      - name: A rootfs image exists for every architecture
        run: |
          set -euo pipefail
          # The pin resolves nucleus-rootfs-<version>-<arch>.ext4.gz for both
          # arches; anything less and `nucleus setup` cannot install a guest.
          n=$(find rootfs -name '*.ext4.gz' | wc -l | tr -d ' ')
          find rootfs -name '*.ext4.gz' | sed 's/^/  built: /'
          if [ "$n" -lt 2 ]; then
            echo "::error::only $n rootfs image(s) built; a release needs one per architecture."
            echo "  This is the v2.2.0 failure exactly: 16 assets published, 0 of them a rootfs."
            exit 1
          fi
          echo "ok: $n rootfs images"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, build-musl, build-rootfs, upload-lima-templates]
    # PUBLISHING IS TAG-ONLY. A scheduled or dispatched run builds everything and
    # stops here — no release object, no assets, no attestations, no crates.io,
    # no Homebrew (`publish` and `homebrew` both `needs: release`, so this one
    # condition gates all three). A dry run that published would be far worse
    # than no dry run.
    if: always() && needs.build-musl.result == 'success' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
      - name: Collect assets
        run: |
          mkdir -p release
          find dist -type f \( -name "*.tar.gz" -o -name "*.ext4.gz" -o -name "*.yaml" \) -exec mv {} release/ \;
          ls -lah release
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          files: release/*
          # A tag containing `-` is a prerelease (`v2.1.0-rc.1`). Marking it
          # matters beyond cosmetics: GitHub's `/releases/latest` EXCLUDES
          # prereleases, and `scripts/install.sh` resolves the version from
          # exactly that endpoint — so without this an RC becomes the default
          # download for every one-line installer user.
          prerelease: ${{ contains(github.ref_name, '-') }}
      # Move the floating major tag (`v2`) only for a real release.
      #
      # This repo's root `action.yml` is a composite Action, so anyone pinning
      # `coproduct-opensource/nucleus@v2` follows this tag. Pointing it at a
      # release CANDIDATE would ship unfinished code to those consumers under a
      # reference they have every reason to treat as stable. (The step was also
      # still named "v1" while computing `v2` from the tag.)
      # Moved through the refs API, NOT `git push`. GITHUB_TOKEN is a GitHub App
      # token without the `workflows` permission, and git refuses any ref push
      # whose .github/workflows/ differs from the tip of a branch. A release tag
      # is almost always a commit or two behind main by the time it builds, so
      # that condition is the normal case, not an edge case:
      #
      #   ! [remote rejected] v2 -> v2 (refusing to allow a GitHub App to create
      #     or update workflow `.github/workflows/manifest-guards.yml`)
      #
      # That is what failed the v2.2.0 release AFTER every asset had uploaded
      # successfully -- the release was complete and the run still reported
      # failure, leaving `v2` ten commits stale while `@v2` consumers kept
      # getting old code.
      #
      # The refs API only repoints an existing ref at an existing object, so it
      # is not subject to that check. Two calls keep the tag ANNOTATED, matching
      # what `git tag -fa` produced before.
      - name: Update floating major tag
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MAJOR="${GITHUB_REF_NAME%%.*}"
          TAG_OBJ=$(gh api "repos/$REPO/git/tags" \
            -f tag="$MAJOR" -f message="Release $MAJOR" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          # PATCH updates the ref; if the floating tag does not exist yet (a new
          # major), POST creates it.
          gh api -X PATCH "repos/$REPO/git/refs/tags/$MAJOR" \
            -F sha="$TAG_OBJ" -F force=true --jq .object.sha \
            || gh api -X POST "repos/$REPO/git/refs" \
                 -f ref="refs/tags/$MAJOR" -F sha="$TAG_OBJ" --jq .object.sha
          echo "floating tag $MAJOR -> $GITHUB_SHA"

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Check publish token
        id: publish_gate
        run: |
          if [ -n "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.publish_gate.outputs.enabled == 'true' }}
      # No cache restore here: this job publishes to crates.io, so it must
      # build from scratch to avoid cache-poisoning of trust-bearing artifacts.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        if: ${{ steps.publish_gate.outputs.enabled == 'true' }}
        with:
          cache: false
      # Never from a prerelease tag. A crates.io publish cannot be undone (only
      # yanked), and `nucleus-node` has not had its first publish yet — so an RC
      # tag would make a release candidate the permanent first version of the
      # crate. The token gate alone is not enough: it protects against having no
      # credentials, not against publishing the wrong thing.
      - name: Publish nucleus-node
        if: ${{ steps.publish_gate.outputs.enabled == 'true' && !contains(github.ref_name, '-') }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p nucleus-node --locked

  homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Check Homebrew secrets
        id: brew_gate
        run: |
          if [ -n "${HOMEBREW_TAP}" ] && [ -n "${HOMEBREW_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          HOMEBREW_TAP: ${{ secrets.HOMEBREW_TAP }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: ${{ steps.brew_gate.outputs.enabled == 'true' }}
        with:
          path: dist
      - name: Collect assets
        if: ${{ steps.brew_gate.outputs.enabled == 'true' }}
        run: |
          mkdir -p release
          find dist -type f -name "*.tar.gz" -exec mv {} release/ \;
          ls -lah release
      - name: Compute checksums
        id: shas
        if: ${{ steps.brew_gate.outputs.enabled == 'true' }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#nucleus-node-v}"
          VERSION="${VERSION#v}"
          LINUX="nucleus-node-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          MAC_X64="nucleus-node-${VERSION}-x86_64-apple-darwin.tar.gz"
          MAC_ARM="nucleus-node-${VERSION}-aarch64-apple-darwin.tar.gz"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "linux_sha=$(sha256sum release/${LINUX} | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "mac_x64_sha=$(sha256sum release/${MAC_X64} | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "mac_arm_sha=$(sha256sum release/${MAC_ARM} | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Checkout tap
        if: ${{ steps.brew_gate.outputs.enabled == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.HOMEBREW_TAP }}
          token: ${{ secrets.HOMEBREW_TOKEN }}
          path: tap
      - name: Write formula
        if: ${{ steps.brew_gate.outputs.enabled == 'true' }}
        env:
          VERSION: ${{ steps.shas.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${REF_NAME}"
          FORMULA_PATH="tap/Formula/nucleus-node.rb"
          cat > "${FORMULA_PATH}" <<EOF
          class NucleusNode < Formula
            desc "Node daemon (kubelet analogue) for nucleus pods"
            homepage "https://github.com/${{ github.repository }}"
            version "${VERSION}"
            license "MIT OR Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/nucleus-node-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${{ steps.shas.outputs.mac_arm_sha }}"
              else
                url "${BASE_URL}/nucleus-node-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${{ steps.shas.outputs.mac_x64_sha }}"
              end
            end

            on_linux do
              url "${BASE_URL}/nucleus-node-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${{ steps.shas.outputs.linux_sha }}"
            end

            def install
              bin.install "nucleus-node"
            end

            test do
              system "#{bin}/nucleus-node", "--help"
            end
          end
          EOF
      - name: Commit and push
        if: ${{ steps.brew_gate.outputs.enabled == 'true' }}
        env:
          VERSION: ${{ steps.shas.outputs.version }}
        run: |
          cd tap
          git add Formula/nucleus-node.rb
          git commit -m "nucleus-node ${VERSION}"
          git push

name: research-lean-build

# Verification path for the RESEARCH-tier Lean cluster (cohomology / alignment-tax).
# These libs carry `sorry`s (open conjectures, allowlisted in CONJECTURES.md), so
# they are NOT in the proven-tier sorry-ban gate. But without ANY CI build, a proof
# attempt that breaks type-checking — or a sorry that secretly multiplies — goes
# unnoticed, and the local build is too heavy to verify against (Mathlib closure
# replay times out >900s). This workflow gives the keystone effort a real
# verification path on the cloud's warm Mathlib cache:
#   1. Nightly/manual only: lake-builds the cluster libs — a proof attempt that fails to type-check
#      FAILS here (the check the keystone loop needs).
#   2. Every PR/push and nightly/manual run: counts cluster `sorry`s and RATCHETS: must not exceed the committed
#      baseline (.research-sorry-baseline). Closing a sorry lowers it (update the
#      baseline down); a regression / new hole fails.

on:
  push:
    branches: [main]
    paths:
      - 'crates/portcullis-core/lean/**'
      - '.github/workflows/research-lean-build.yml'
  pull_request:
    paths:
      - 'crates/portcullis-core/lean/**'
      - '.github/workflows/research-lean-build.yml'
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

concurrency:
  # Supersede a PR's older in-flight runs; NEVER cancel anything else.
  # cancel-in-progress is scoped to pull_request on purpose: cancelling a
  # merge_group run would abort a queue entry mid-flight, and cancelling a
  # push to main would drop the signal for a commit that already landed.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  research-lean-build:
    name: lake build (research tier)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90
    runs-on: ${{ vars.CI_BUILD_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install elan (Lean toolchain)
        # Hosted only: the runner image bakes elan + the pinned Lean toolchain.
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          # elan v4.2.4 as its release binary, checksum-verified before it runs; no downloaded
          # script is handed to an interpreter (Scorecard Pinned-Dependencies).
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  /tmp/elan.tar.gz" | sha256sum -c -
          tar -xzf /tmp/elan.tar.gz -C /tmp elan-init
          /tmp/elan-init -y --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake / Mathlib build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5 # zizmor: ignore[cache-poisoning]
        # Hosted only: the self-hosted runners keep their caches on persistent
        # mounts, and uploading a cache from them was observed pinning a runner in
        # the save step for 15+ minutes.
        if: ${{ runner.environment == 'github-hosted' }}
        with:
          path: |
            crates/portcullis-core/lean/.lake
            ~/.elan
            ~/.cache/mathlib
          key: lean-aeneas-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/portcullis-core/lean/lean-toolchain', 'crates/portcullis-core/lean/lakefile.lean', 'crates/portcullis-core/lean/lake-manifest.json') }}
          restore-keys: |
            lean-aeneas-${{ runner.os }}-${{ runner.arch }}-

      - name: Fetch Mathlib cache (prebuilt oleans)
        working-directory: crates/portcullis-core/lean
        run: lake exe cache get || true

      - name: lake build (research cluster — type-check; a broken proof FAILS here)
        working-directory: crates/portcullis-core/lean
        run: |
          LEAN_NUM_THREADS=4 lake build \
            MatrixBridge \
            RankNullity \
            AlignmentTaxBridge \
            AlignmentTaxConcrete \
            ComparisonTheorem \
            SimplexAcyclic \
            HigherObstruction \
            MultiAgentCohomology \
            CompositionalAlignment \
            PACVCBridge \
            UniversalityTheorem \
            CechCohomology

  research-sorry-ratchet:
    name: sorry-ratchet (research tier)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sorry ratchet (must not exceed baseline)
        working-directory: crates/portcullis-core/lean
        run: |
          # Proof-hole count: lines whose first non-space token is the WORD
          # `sorry`/`admit`. The `\b` is load-bearing: without it the pattern
          # matched any line starting with those letters — notably a `/- … -/`
          # docstring BODY line beginning with the word "admits" (e.g. "admits
          # ONLY WebFetch"), which is prose, not a proof hole. That false match
          # reddened this gate on main once (DeclassifySinkScopeExtracted.lean
          # counted 2 holes for two doc lines). Docstring bodies do NOT start
          # with `--`, so the old "comment lines don't match" assumption was
          # wrong for block comments.
          PAT='^[[:space:]]*(sorry|admit)\b'
          count=$(grep -rhcE "$PAT" --include='*.lean' \
                    --exclude-dir=.lake . 2>/dev/null | awk '{s+=$1} END{print s+0}')
          baseline=$(cat .research-sorry-baseline)
          echo "research-tier sorries: $count (baseline $baseline)"
          echo "per-file:"
          grep -rlE "$PAT" --include='*.lean' --exclude-dir=.lake . 2>/dev/null \
            | while read -r f; do echo "  $(basename "$f"): $(grep -cE "$PAT" "$f")"; done
          if [ "$count" -gt "$baseline" ]; then
            echo "::error::research-tier sorry count increased ($count > baseline $baseline) — a new proof hole was introduced"
            exit 1
          fi
          if [ "$count" -lt "$baseline" ]; then
            echo "::notice::sorry count dropped to $count (< $baseline) — update .research-sorry-baseline to ratchet the win in"
          fi

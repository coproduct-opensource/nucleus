name: Rubric Lean Proofs

# Builds the Mathlib-free cardinal-scoring Lean tree that `nucleus-rubric` is
# parity-pinned to (faithful inertness, total preorder, RV-grade monotonicity,
# scalarized-winner Pareto-optimality) and bans `sorry` / `native_decide`, so the
# four theorems cited by crates/nucleus-rubric/tests/rubric_lean_parity.rs cannot
# rot. Dedicated workflow (path isolation), cloned from econ-lean.yml.

on:
  push:
    branches: ["main"]
    paths:
      - "crates/nucleus-rubric/lean/**"
      - ".github/workflows/rubric-lean.yml"
  pull_request:
    paths:
      - "crates/nucleus-rubric/lean/**"
      - ".github/workflows/rubric-lean.yml"
  merge_group:
  workflow_dispatch:

concurrency:
  # Supersede a PR's older in-flight runs; NEVER cancel anything else.
  # cancel-in-progress is scoped to pull_request on purpose: cancelling a
  # merge_group run would abort a queue entry mid-flight, and cancelling a
  # push to main would drop the signal for a commit that already landed.
  group: rubric-lean-real-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rubric-lean:
    name: lake build Nucleus (rubric scoring proofs)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # WHY THIS EXISTS: `paths:` under `merge_group:` is accepted by the YAML
      # schema and then IGNORED by GitHub — path filtering is not supported for
      # merge_group events. So the scoping declared above holds on pull_request
      # and is silently dropped in the merge queue, where the queue's
      # speculative batches multiply it by the queue depth. A README-only PR
      # was running the full Lean proof suite, once per queue entry.
      #
      # This restores the declared intent for merge_group only. On every other
      # event GitHub's own `paths:` already decided, so the gate says yes and
      # changes nothing.
      - name: Is this change in scope?
        id: scope
        env:
          # Never interpolate ${{ }} into a run script (zizmor
          # template-injection hardening) — pass through env.
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
          PATTERN: '^crates/nucleus-rubric/lean/|^\.github/workflows/rubric-lean\.yml$'
        run: |
          set -euo pipefail
          if [ "$EVENT" != "merge_group" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT: GitHub's own paths: filter already applied."
            exit 0
          fi
          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ]; then
            # Fail OPEN: an unknown range must run the proofs, never skip them.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "merge_group with no base/head sha — running to be safe."
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE "$PATTERN"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "in scope — running."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "no file in this merge group matches $PATTERN — skipping the"
            echo "expensive steps. This job still reports, so it remains usable"
            echo "as a required status check."
          fi


      # Mathlib-free project: install elan directly (the repo's established
      # pattern — see econ-lean.yml / aeneas.yml) and run `lake build`. No mathlib
      # cache fetch needed; the whole tree builds in seconds.
      - name: Install elan (Lean toolchain)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake build artifacts
        if: ${{ runner.environment == 'github-hosted' && (steps.scope.outputs.relevant == 'true') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            crates/nucleus-rubric/lean/.lake
            ~/.elan
          key: lean-rubric-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/nucleus-rubric/lean/lean-toolchain', 'crates/nucleus-rubric/lean/lakefile.lean') }}
          restore-keys: |
            lean-rubric-${{ runner.os }}-${{ runner.arch }}-

      - name: lake build Nucleus (rubric scoring proofs)
        if: steps.scope.outputs.relevant == 'true'
        working-directory: crates/nucleus-rubric/lean
        run: lake build

      - name: Ban sorry / admit / native_decide / sorryAx in rubric Lean
        if: steps.scope.outputs.relevant == 'true'
        run: |
          # Match the tactic/term forms (`:= sorry`, `:= by sorry`, a lone `sorry`,
          # a lone `admit` / `:= by admit`, `native_decide`, or the `sorryAx` axiom
          # spelled out in source) — NOT the word "sorry" in "0 sorry" doc comments.
          # Non-vacuity: this gate is a grep, and a grep over a path that no longer
          # matches exits non-zero, takes the `else` branch, and prints the success
          # line having scanned NOTHING. Establish that there is something to scan
          # before letting its silence count as a pass.
          FILES=$(find crates/nucleus-rubric/lean/Nucleus -name '*.lean' | wc -l | tr -d ' ')
          if [ "$FILES" -lt 1 ]; then
            echo "::error::no .lean files under crates/nucleus-rubric/lean/Nucleus — the rubric sorry-ban scanned nothing."
            exit 1
          fi
          echo "scanning $FILES .lean file(s) under crates/nucleus-rubric/lean/Nucleus"
          if grep -rnE \
               '(:=[[:space:]]*by[[:space:]]+sorry|:=[[:space:]]*sorry|^[[:space:]]*sorry$|:=[[:space:]]*by[[:space:]]+admit|^[[:space:]]*admit$|native_decide|sorryAx)' \
               --include='*.lean' crates/nucleus-rubric/lean/Nucleus; then
            echo "ERROR: rubric Lean uses 'sorry'/'admit' (proof holes), 'native_decide', or 'sorryAx' (banned)."
            exit 1
          fi
          echo "No sorry / admit / native_decide / sorryAx across $FILES file(s) — rubric scoring proofs are complete and kernel-checked."

      - name: Assert theorems are sorryAx-free (#print axioms)
        if: steps.scope.outputs.relevant == 'true'
        working-directory: crates/nucleus-rubric/lean
        run: |
          # Ask the kernel which axioms each soundness theorem actually depends on.
          # A `sorry` (or any hole) anywhere in a proof's dependency graph surfaces
          # here as `sorryAx`, even if the source-level grep above missed it.
          cat > PrintAxioms.lean <<'EOF'
          import Nucleus.Rubric
          open Nucleus.Rubric
          #print axioms faithfulTotal_inert_under_non_rv
          #print axioms ranksAtLeast_refl
          #print axioms ranksAtLeast_trans
          #print axioms ranksAtLeast_total
          #print axioms faithfulTotal_mono_in_rv_grade
          #print axioms dominates_strengthens_total
          #print axioms scalarized_winner_undominated
          EOF
          # `lake env lean` type-checks against the already-built library.
          AXIOMS="$(lake env lean PrintAxioms.lean)"
          echo "$AXIOMS"
          rm -f PrintAxioms.lean
          if echo "$AXIOMS" | grep -q 'sorryAx'; then
            echo "ERROR: a rubric theorem depends on 'sorryAx' (an unproven hole)."
            exit 1
          fi
          echo "No theorem depends on sorryAx — proofs are kernel-complete."

name: WASM Pure Crates

# Proves the pure, integer/byte-only economic + verification crates compile to
# wasm32-unknown-unknown — the property their docs claim ("WASM-safe", no
# ring/tokio/redb/native deps). A regression (e.g. a stray std-only or native
# dependency creeping into the closure) breaks the build here instead of silently
# invalidating the in-browser / edge story. Path-isolated; mirrors rubric-lean.yml.

on:
  push:
    branches: ["main"]
    paths:
      - "crates/nucleus-rubric/**"
      - "crates/nucleus-rubric-olog/**"
      - "crates/nucleus-eval/**"
      - "crates/nucleus-oracle/**"
      - "crates/nucleus-recompute/**"
      - "crates/nucleus-creditworthiness/**"
      - "crates/nucleus-witness-olog/**"
      - "crates/nucleus-econ-kernels/**"
      - "crates/nucleus-externality/**"
      - "Cargo.lock"
      - ".github/workflows/wasm-pure-crates.yml"
  pull_request:
    paths:
      - "crates/nucleus-rubric/**"
      - "crates/nucleus-rubric-olog/**"
      - "crates/nucleus-eval/**"
      - "crates/nucleus-oracle/**"
      - "crates/nucleus-recompute/**"
      - "crates/nucleus-creditworthiness/**"
      - "crates/nucleus-witness-olog/**"
      - "crates/nucleus-econ-kernels/**"
      - "crates/nucleus-externality/**"
      - "Cargo.lock"
      - ".github/workflows/wasm-pure-crates.yml"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  wasm-build:
    name: cargo build --target wasm32-unknown-unknown (pure crates)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # `paths:` under `merge_group:` parses and is then IGNORED by GitHub, so
      # the scoping declared above holds on pull_request and is silently dropped
      # in the merge queue -- where speculative batches multiply it by the queue
      # depth. This restores the declared intent for merge_group only; the
      # PATTERN is DERIVED from the paths above and ci/merge-group-scope-parity.sh
      # fails if they ever disagree.
      - name: Is this change in scope?
        id: scope
        env:
          # Never interpolate ${{ }} into a run script (zizmor hardening).
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
          PATTERN: '^\.github/workflows/wasm\-pure\-crates\.yml$|^Cargo\.lock$|^crates/nucleus\-creditworthiness/|^crates/nucleus\-econ\-kernels/|^crates/nucleus\-eval/|^crates/nucleus\-externality/|^crates/nucleus\-oracle/|^crates/nucleus\-recompute/|^crates/nucleus\-rubric\-olog/|^crates/nucleus\-rubric/|^crates/nucleus\-witness\-olog/'
        run: |
          set -euo pipefail
          if [ "$EVENT" != "merge_group" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ]; then
            # Fail OPEN: an unknown range must run, never skip.
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE "$PATTERN"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; echo "in scope -- running."
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "nothing in this merge group matches; skipping the expensive"
            echo "steps. The job still reports, so it stays required-check safe."
          fi


      - name: Add wasm32 target
        if: steps.scope.outputs.relevant == 'true'
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo + target
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-pure-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            wasm-pure-${{ runner.os }}-

      - name: Build pure crates for wasm32
        if: steps.scope.outputs.relevant == 'true'
        run: |
          cargo build --locked --target wasm32-unknown-unknown \
            -p nucleus-rubric \
            -p nucleus-rubric-olog \
            -p nucleus-eval \
            -p nucleus-oracle \
            -p nucleus-recompute \
            -p nucleus-creditworthiness

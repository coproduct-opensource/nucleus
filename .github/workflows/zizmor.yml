name: Zizmor (workflow security)

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  # Supersede a PR's older in-flight runs; NEVER cancel a merge_group entry
  # or a push-to-main run (the house rule every other gated workflow follows).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor (high+ gate)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Run zizmor (fail on high+ findings)
        run: uvx zizmor==1.25.2 --min-severity high --no-progress .github/workflows/

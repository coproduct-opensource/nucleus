[[files]]
path = "crates/portcullis-effects/src/lib.rs"
ceiling = 2813
target = 2500
step = 0

[[files]]
path = "crates/nucleus-audit/src/main.rs"
ceiling = 2627
target = 2500
step = 0

[[files]]
path = "crates/nucleus-node/src/firecracker_config.rs"
# Added 2026-09-09 with the content-addressed pod identity work, which took this
# file 2220 -> 2629 and past the 2500 default sweep ceiling. Seeded at the
# measured value rather than a round number, the same rule the entries above
# follow: banked headroom gets spent without justification later.
#
# The overage was tests, and the note here used to say they could not move: not
# to `tests/`, which sees only the public API, and what they cover (`from_spec`,
# `snapshot_inputs`, the drive and boot-arg lowering) is `pub(crate)`. That is
# still true of `tests/` and was the wrong destination. They moved to a SIBLING
# SOURCE FILE instead — `#[path = "firecracker_config_tests.rs"] mod tests;`,
# the same shape `portcullis::certificate` already uses for
# `certificate_tests.rs`. Same crate, same module, `use super::*` still reaches
# every `pub(crate)` item, so no seam was widened to suit a test. All 29
# `firecracker_config::tests::*` cases run exactly as before.
#
# 2629 -> 1190, re-seeded at measured truth rather than left high: this file
# should not carry ~1300 lines of banked headroom just because its tests left.
# The sibling is swept against the 2500 default like any other file.
#
# `step = 0` deliberately: the production half is not being actively shrunk, and
# a non-zero step here would ratchet against test coverage, which is the one
# thing this file should not be pressured to drop. Raise it if the production
# half starts growing on its own.
ceiling = 1190
target = 2500
step = 0

[[files]]
path = "crates/nucleus-node/src/firecracker_config.rs"
# Added 2026-09-09 with the content-addressed pod identity work, which took this
# file 2220 -> 2629 and past the 2500 default sweep ceiling. Seeded at the
# measured value rather than a round number, the same rule the entries above
# follow: banked headroom gets spent without justification later.
#
# The overage was tests, and the note here used to say they could not move: not
# to `tests/`, which sees only the public API, and what they cover (`from_spec`,
# `snapshot_inputs`, the drive and boot-arg lowering) is `pub(crate)`. That is
# still true of `tests/` and was the wrong destination. They moved to a SIBLING
# SOURCE FILE instead — `#[path = "firecracker_config_tests.rs"] mod tests;`,
# the same shape `portcullis::certificate` already uses for
# `certificate_tests.rs`. Same crate, same module, `use super::*` still reaches
# every `pub(crate)` item, so no seam was widened to suit a test. All 29
# `firecracker_config::tests::*` cases run exactly as before.
#
# 2629 -> 1190, re-seeded at measured truth rather than left high: this file
# should not carry ~1300 lines of banked headroom just because its tests left.
# The sibling is swept against the 2500 default like any other file.
#
# `step = 0` deliberately: the production half is not being actively shrunk, and
# a non-zero step here would ratchet against test coverage, which is the one
# thing this file should not be pressured to drop. Raise it if the production
# half starts growing on its own.
#
# Bumped 1190 -> 1193 2026-09-11, merging main into this branch. The three lines
# are main's #2690, which annotates the OS boundary: one
# `// OS assumption: KB-VSOCK-PEER-CID` above the kernel-command-line block and a
# two-line `KB-PROCFS-STATUS` doc above `verify_seccomp_active`. None of them is
# this branch's code and none is production half growing on its own, which is the
# condition the note above says would justify a non-zero step. Re-seeded at the
# measured value, as every move of these entries is.
#
# Bumped 1193 -> 1203 2026-09-11, merging main into this branch a second time.
# The ten lines are main's #2786, all comment: the reasoning for why a writable
# rootfs must be hard-linked and why `ImageSpec::read_only` now defaults to
# true — a hard link means the guest writes through to the shared installed
# artifact, so `read_only: false` hands every later pod the previous pod's
# writes. Deleting a security rationale to fit a line ceiling is the one way
# this gate could make the tree worse, so the ceiling follows. Still not this
# branch's code, still not the production half growing on its own. The two
# tests #2786 added to this module went into the extracted sibling
# (`firecracker_config_tests.rs`), which is swept against the 2500 default.
#
# Bumped 1203 -> 1335 2026-09-11, merging main into this branch a third time.
# The 132 lines are main's #2789 scratch work and are the first move of this
# entry that IS production half growing: three new functions --
# `provision_pod_scratch`, `build_scratch_image`, `scratch_for_pod` -- plus the
# `scratch_is_node_provisioned` parameter threaded through `jail_resources` and
# `prepare_jail`. Still not this branch's code. The note above says a non-zero
# step is justified when the production half starts growing on its own; it now
# has, but raising `step` in the same commit that absorbs someone else's feature
# would ratchet this branch against work it did not write. Left at 0, and flagged
# here so the next person to touch the production half decides it deliberately.
# The five tests #2789 added to this module went into the extracted sibling.
ceiling = 1335
target = 2500
step = 0

# Line-count ratchet — soft ceiling that decreases by 1 on every merge to main.

[ratchet]
# `ceiling`, `target` and `step` used to sit here too, read by nothing. They were
# the trap: the old checker took `grep '^ceiling' | head -1`, which found THIS
# block rather than any [[files]] entry, and the numbers only ever looked right
# because they happened to equal kernel.rs's own. Removed 2026-09-09 — the parser
# in `crates/xtask/src/line_ratchet.rs` rejects unknown keys, so a field nothing
# reads can no longer sit here waiting to be mistaken for one that matters.
#
# Ceiling applied to every crates/*/src/**/*.rs file with NO [[files]] entry
# of its own — added 2026-09-03 so the gate covers the whole workspace
# instead of the three files someone happened to list. Seeded at 2500
# (matching kernel.rs's own longstanding target/ceiling) after measuring
# the current tree: exactly 3 files exceed it, and each got its own
# [[files]] entry below rather than being silently exempted. See
# `scripts/check-line-ratchet.sh`'s sweep section for the mechanism and the
# full rationale.
default_ceiling = 2500

# nucleus-claude-hook removed (moved to nucleus-code product repo)

[[files]]
path = "crates/portcullis/src/kernel.rs"
ceiling = 2479
target = 2500
step = 1

[[files]]
path = "crates/nucleus-tool-proxy/src/main.rs"
# Reset to the measured value 2026-07-31: the script only ever enforced the
# first entry, so this had drifted to 4975 while declaring 4118.
ceiling = 4975
target = 2500
step = 1

[[files]]
path = "crates/nucleus-node/src/main.rs"
# Reset to the measured value 2026-07-31 (was a fictional 3252; see above).
# Bumped 4042 -> 4045 2026-09-03: Move A step 4 (SPIFFE branch in
# auth_middleware) needed 3 lines net after extracting everything
# extractable into auth.rs (which isn't ratchet-tracked, on purpose — see
# the file-discovery change to this ratchet landing the same day). A new
# `ApiError::Authorization` variant and its one match arm cannot move out
# of this file; `ApiError` lives here.
# Bumped 4045 -> 4080 2026-09-09: API-mode boot. The lowering and the whole
# transport live in firecracker_config.rs and the new firecracker_api.rs (not
# ratchet-tracked yet, and deliberately where the testable parts went); what is
# left here is irreducibly a branch in THIS function — the three spawn arms each
# decide whether `--config-file` is in the argv, and the configure/start pair has
# to sit between the spawn and the seccomp check because it needs `child`,
# `pod_dir`, `jail_layout` and the same cleanup path as every other failure. The
# comment carrying the measurement that Firecracker installs its seccomp filter
# at InstanceStart rather than at exec is the largest single piece, and it is
# there because the obvious ordering is wrong and cost a debugging cycle.
# Bumped 4080 -> 4095 the same day: image digest verification. The measuring and
# comparing are in image_identity.rs; what is here is the call plus the same
# net-resource cleanup every other failure in this function does, and it has to
# be HERE — between `prepare_jail` and the spawn — because verifying after
# placement is what removes the measure-then-swap window, and the cleanup needs
# `net_plan`, `netns_name` and `dns_proxy` by mutable reference.
# Bumped 4095 -> 4100 the same day: two `mod` declarations, for snapshot_vmm and
# image_identity. This is the growth the ratchet WANTS — main.rs grew by two
# lines because ~400 went into new modules that are testable on their own — but
# a module declaration cannot be extracted, so it has to be paid for here.
# Bumped 4100 -> 4101 the same day: the snapshot store gets a production caller.
# Five lines were needed and four were bought back by putting the work where it
# belongs — `mod snapshot_store;`, one field on `FirecrackerPod`, one line
# assembling it (the assembly itself is `FirecrackerConfig::snapshot_inputs`, in
# firecracker_config.rs, because the fields it reads are private there anyway),
# and one `.route(...)`. The handler is ~120 lines and lives in pod_api.rs, which
# exists for exactly this. A route line and a struct field cannot be extracted;
# the router and the struct are both here.
# LOWERED 4101 -> 3992 the same day, which is the first time this entry has moved
# in the direction the ratchet exists for. `GetReceipt` assembled its receipt
# inline in the gRPC handler — 155 lines — so gRPC was the only way to get one
# and the SDKs' `GET /v1/pods/{id}/receipt` 404'd. That assembly moved to
# pod_receipt.rs, where both transports call it, and main.rs kept only the proto
# conversion plus two route lines. Set to the measured value rather than left
# slack: banked headroom is spent without justification later, which is the whole
# failure mode the ceiling is here to prevent.
# Bumped 3992 -> 3996 2026-09-09, merging main into this branch. The four lines
# are main's production-confinement hardening, not this branch's growth: `mod
# production_confinement;`, one doc comment that became two lines, and the
# two-line `admit_seccomp` guard. The mod declaration cannot be extracted — the
# module is declared here — and the guard has to sit on the pod-creation path in
# THIS file, because that is where a spec is admitted and where rejecting one
# still has the request to reject. Reseeded at the measured value again rather
# than restoring the old 4045 that main carries: this branch earned 3992 by
# moving 155 lines out, and taking main's slack back would spend that.
# Bumped 3996 -> 4007 2026-09-11, merging main into this branch a third time.
# All eleven lines are main's #2789 scratch work, none of them this branch's: a
# three-line comment, the five-line `scratch_for_pod` call that decides the
# writable `/work` BEFORE the config that declares the drive, the one-line
# `let image = &effective_image;` rebind, and the `scratch_is_node_provisioned`
# argument threaded into `prepare_jail`. The call cannot be extracted -- it sits
# on the pod-creation path in THIS file because that is where the jail layout and
# the jailer uid/gid are both in scope. Re-seeded at the measured value, as every
# move of this entry has been.
ceiling = 4007
target = 2000
step = 1


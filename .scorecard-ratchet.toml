#
# 2026-10-02 (#3119, rebased onto the above): RE-MEASURED, because the census
# was wrong. `suppressions()` searched for the next `[allow(` and fell back to
# `[expect(` only when none was left, so any `#[expect]` ahead of an `#[allow]` in

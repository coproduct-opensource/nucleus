# Scorecard ratchet — one section per defect family, two floors each.
#
# Read by `cargo xtask scorecard` (crates/xtask/src/scorecard.rs).
#
# WHY THIS FILE EXISTS
#
# A census of all 868 nucleus issues (2026-09-11) classified the 120 that are
# bug-labelled or carry an audit prefix. Four families account for ~90%:
#
#   bound  72 (60%)  a mechanism exists and nothing binds it to the live path
#   alg    15 (13%)  a law of a structure the code already claims to be
#   life   14 (12%)  unbounded carrier, no durable state, no validity interval
#   tot     7  (6%)  a function whose type says total, that panics
#
# The remaining 10% is genuinely novel and no census here will find it.
#
# Each family already had, or could have, its own gate. What did not exist was
# one card: a place where a family at zero is visible beside a family at a
# hundred, and where adding a fifth family is a section rather than a redesign.
#
# WHAT IS PINNED, AND WHY TWO THINGS
#
#   floor_bp          minimum discharged/population in basis points. May only RISE.
#   population_floor  minimum population. A shrinking surface is a decision.
#   floor_set         how the floor came to hold its value: "measurement" when it
#                     equals what the tree measures, or "waiver" with waiver_dated,
#                     waiver_by and waiver_because when it sits below by decision.
#                     Required: a bare digit cannot tell a raise from a concession.
#
# Both, because neither alone is a gate. A floor on the ratio rewards deleting
# obligations: remove one and numerator and denominator fall together while the
# ratio rises. A pin on the debt misses a ratio falling at constant debt. This
# is the trap the neighbouring repo's CCI has, where documenting a known gap
# lowers the score.
#
# THE BADGE NAMES THE WEAKEST FAMILY
#
# Not an average. Pooling numerators over pooled denominators gives a number
# dominated by whichever family has the largest population — `tot` alone
# measures in the thousands — so a family at 0% would vanish into it. The badge
# reads `alg 22%`: the lowest-scoring family AND its number, so it moves when
# the weakest improves, cannot hide a bad family behind a good one, and says
# where the next hour of work goes. ADR 0007 I-1: a gate whose green is
# indistinguishable from vacuity.
#
# 2026-09-11: seeded at the measured value with one family. `alg`, `tot` and
# `life` arrive as their own sections. Raising floor_bp is how a family's debt
# is paid; lowering either pin needs a dated note here saying what went away
# and who decided.

[family.bound]
# 171 of 172 witness-accepting parameter sites bind their witness under a name
# the body can consult. The one remaining is `trait CaClient` in
# crates/nucleus-identity/src/ca/mod.rs, which performs an act while dropping
# its witness. 32 further sites are class-N in
# scripts/inert-authority-manifest.txt — DenyAllEffects::run refuses
# unconditionally, so it performs no act and correctly consults nothing — and
# they are reported as `undeclared` rather than counted against the ratio.
# 2026-09-12: bounded artifact reads require both the decision and discharged
# authority. The additional covered boundary raises the measured ratio.
# 2026-09-16: WorkloadApiServer and its two clients were deleted -- no caller since
# #2197 -- taking 3 bound witness-accepting sites with them (174 -> 171). A
# deletion, not a regression: the one undischarged site (`trait CaClient`) is
# unchanged, so the ratio moves only because the denominator shrank. 170/171.
# 2026-09-27: the two memory cores take an Authority by value and spend it before
# mutating — two new sites, both bound. 173/174.
# 2026-09-27: NodeClient::{create_pod, list_pods, pod_logs, cancel_pod} take an
# Authority by value and spend it before building the request — four new sites,
# all bound. 177/178.
# 2026-09-29: `Sandbox::glob` joins with its DecisionToken and Authority taken by value
# and consumed before the walk — two new sites, both bound, on top of main's 177/178. 179/180.
# 2026-09-27: declassification became a sealed witness. VerifiedDeclassification
# joins the WITNESS vocabulary (bound at FlowGraph::apply_verified), and
# kernel/declassify_authority.rs names DeclassificationToken bare, so four
# existing bound sites become visible to the scan. 176/177, CaClient unchanged.
# 2026-09-29, merging main into the declassification branch: both moves on one tree. 184/185.
# 2026-10-01: the execute-on-consume guard splits the executor's synchronous
# spawn into `spawn_checked` (the guard) and `spawn_unguarded` (the effect), and
# the effect half takes the `Authority` by name and spends it -- one more bound
# site, on main's 184/185. 185/186 = 99.46%, and the floor follows it up.
# 2026-10-01: census correction, not new obligations (#2986). The census read a
# witness type by its bare spelling, so a parameter written with its path --
# `&portcullis::VerifiedPermissions`, `portcullis_effects::authority::Authority`,
# `&portcullis_core::declassify::DeclassificationToken` -- was not a site at all.
# It now reads the type's last path segment as a whole identifier. Seven bound
# sites that were always there become visible (authority-exchange from_verified,
# tool-proxy broker_client and run_gate, four in portcullis flow_graph); dropped
# is unchanged at 33, so INERT_TOTAL still agrees. 192/193 = 99.48%.
floor_bp = 9948
floor_set = "measurement"
population_floor = 193

[family.alg]
# 110 of 278 (type, law) obligations are discharged by a `lattice_laws!`
# declaration. The unit is one law of one type, not one type: a per-type census
# calls six types covered that between them check nine, six, four, four, four and
# one of the fifteen their traits oblige.
#
# 21 types across 3 traits. Lattice obliges 9 laws, BoundedLattice 4 more,
# DistributiveLattice 2 — exactly what verify_lattice_laws,
# verify_bounded_lattice_laws and verify_distributive_laws check, counted by
# reading them.
#
# MeetSemilattice and JoinSemilattice are implemented here and have NO verifier,
# so their obligations are excluded rather than counted as undischarged: mixing
# "a checker exists and is not wired" with "no checker exists" hides two
# different debts behind one number. `convergence` made the same call for its
# two unmeasurable arrows. When a semilattice verifier lands the population
# rises, which is a number going up because the measurement got honest.
#
# 9 types carry meet/join/leq with no lattice trait impl at all -- WasiGrant,
# WasiWorld, the two CRDT joins, RiskCost/WeakeningCost among them. No generic
# suite can reach them, so they are reported as `undeclared` rather than counted
# against the ratio: shape without declaration.
#
# UNDERSTATED, ON PURPOSE, FOR A STATED REASON: six types in
# crates/portcullis/tests/proptest_lattice.rs are law-checked today by hand with
# generated samples, and this gate cannot see them because it counts
# declarations, not inferred coverage. Converting them STRENGTHENS those suites
# from four laws to nine and may turn something red -- PathLattice,
# CommandLattice, BudgetLattice and TimeLattice have never had associativity or
# absorption checked -- so it is its own commit. This number rises when that
# lands.
floor_bp = 3956
floor_set = "measurement"
population_floor = 278

[family.tot]
# 13 of 80 production crates declare themselves panic-free for the shipped
# build. A function whose signature says `-> T` and panics is lying about its
# type: #1203 (FlowTracker::label(0), u64 underflow on an unguarded sentinel),
# #1184 (truncate() on multi-byte UTF-8), #481 (Ed25519 keygen .expect() in a
# hot path), #2395 (a guest_cid other than 3 panics the guest, silently).
#
# THE SITE CENSUS, recorded here rather than gated, per clippy.toml's own rule:
# "Where a mandate is not yet clean, the ADR records the measured count and the
# ratchet instead of putting a red gate on main."
#
#   2026-09-11, production region, 1787 sites:
#     arithmetic_side_effects  912
#     indexing_slicing         616
#     expect_used              155
#     unwrap_used               87
#     panic                     10
#     unreachable                7
#     todo                       0
#
#   cargo clippy --workspace --exclude nucleus-verifier-service --lib --bins \
#     --all-features --message-format=json -- \
#     -W clippy::unwrap_used -W clippy::expect_used -W clippy::indexing_slicing \
#     -W clippy::arithmetic_side_effects -W clippy::panic \
#     -W clippy::unreachable -W clippy::todo -A clippy::all
#
# That takes minutes and this gate runs in the fast Manifest Guards job, so the
# gate does not recompute it. It asks the binding question, which is a grep: how
# many crates have DECLARED themselves panic-free. A count of sites nothing
# enforces is a measurement; a crate-level deny is a gate.
#
# WHY cfg_attr(not(test), deny(...)). assert! is a panic. Of the 13 crates
# measuring zero over lib and bins, only 2 are also clean under --all-targets --
# the other 11 are clean where it matters and panic in their own test modules,
# correctly. So the declaration is scoped to the shipped build, the same line
# law_mechanisms::production_region draws when it strips the test region.
#
# ALL SEVEN LINTS OR NONE. Six of seven leaves a way to panic, and crediting it
# would make the ratio mean "mostly".
#
# UNMEASURABLE IS NOT CLEAN. Eighteen crates showed zero; five showed zero
# because clippy never looked -- four are workspace excludes (wasm, maturin,
# RISC-V) and nucleus-verifier-service needs a wasm artifact CI builds. Counting
# them as discharged is ADR 0007 A-2 exactly: "I could not look" is never "I
# looked and it was fine". They are reported as undeclared and the population is
# the 80 crates clippy can see.
#
# 2026-09-11 (second pass): nine more crates cleared and annotated, 13 -> 22.
# Each was ONE arithmetic site -- a Vec::with_capacity hint or a counter -- where
# saturating_add/mul is exactly equivalent: a capacity hint that saturates
# allocates rather than wraps, and the loop fills the real size. 24 more crates
# sit within 8 sites of clean; clearing all of them would reach 46 of 80 (57.5%).
# The remainder need judgement about a contract rather than an arithmetic
# rewrite, so they are not batched in here.
#
# 2026-09-11: seeded after annotating the 13 crates that were already clean, and
# probing one of them red -- `v[0] + 1` in nucleus-pca fires indexing_slicing and
# arithmetic_side_effects, and the crate is green again when it is removed. The
# 67 remaining crates need their sites fixed before they can declare; the two
# tractable lints there are unwrap_used (87) and panic (10), and the 1528
# arithmetic and indexing sites are a program, not a gate.
# 2026-09-12: both new CI receipt crates deny all seven totality lints; 25/83.
# 2026-09-16 (#2935): new crate nucleus-jsonl, the one atomic record append, declares
# all seven from its first commit; 26/84. Without the declaration the new crate
# alone dropped the ratio to 29.76% -- a crate that can panic while appending
# evidence is exactly what this family counts.
# 2026-09-20: new crate nucleus-authority-exchange declares all seven; 27/85. The
# gate caught it the same way: without the declaration the ratio fell to 30.58%
# and Manifest Guards went red. Declaring it found five real sites -- two
# unchecked `Decimal` multiplications converting a certificate's budget to a
# ceiling, an `expect` on a map lookup that `entry()` removes, a `Duration`
# addition, and a fixture that panicked instead of taking an infallible
# constructor. A crate that decides who may spend authority is exactly what this
# family counts.
# 2026-09-21 (#2983 into #2977): new crate nucleus-blast-radius, the bound an
# underwriter prices, declares all seven by inheriting `[lints] workspace = true`
# from its first commit; 28/86. So the ratio ROSE rather than fell, and the gate
# then refused the old floor for the opposite reason to the two notes above --
# a floor with slack under it has already stopped gating (ADR 0007 I-1). Raised
# to the measured value, which is the only direction this pin moves.
# 2026-09-26 (#3019): new crate nucleus-federation, the token validator and
# exchange client a node runs on every federated call, shipped WITHOUT the
# declaration and diluted the ratio to 32.18%; Manifest Guards went red.
# Declaring it found eight real sites -- slicing a SEC1 point by fixed offsets,
# slicing a JWS signing input by summed lengths, a hex-table index, and five
# unchecked additions or multiplications on lengths and times. With it the ratio is
# 29/87, 33.33%, and the floor follows it up.
# 2026-09-29: new crate nucleus-oci-rootfs, which parses untrusted OCI images
# (tar headers, JSON, decompression streams), declares all seven from its first
# commit; 30/88, 34.09%. The ratio rose, so the floor follows it up.
# 2026-09-29: new crate nucleus-microvm-host (the host requirements table and KVM
# probe, the scratch-image read-back, workspace seed/harvest) declares all seven
# in lib.rs and main.rs from its first commit; 31/89, 34.83%. Declaring it moved
# one site: the CAP_NET_ADMIN mask `1u64 << bit` became `checked_shl`.
# 2026-10-02 (#3119, rebased): the population pin had not followed the three
# crates above -- the tree measures 31/89 on main and here, while the pin still
# said 86. Re-pinned to the measurement; the ratio is unchanged.
# 2026-10-02 (#3002, rebased onto main): nucleus-permission-market declares all
# seven and goes integer -- the f64 λ curve became a u128 fixed-point
# exponential, every price a micro-USD u64, `deny(float_arithmetic)` on the
# shipped build. 32/89, 35.95%.
# 2026-10-02 (#2702 P7): new crate nucleus-decision-protocol, the decision
# channel's codec -- it parses every byte a guest writes on that channel --
# declares all seven from its first commit; 32/90, 35.55%. The ratio rose, so
# the floor follows it up.
# 2026-10-02 (#2981): new crate nucleus-calibration declares all seven from its
# first commit; 32/90, 35.55%. The declaration paid for itself before the first
# commit: two integer divisions behind a `.max(1)` that the type could not see
# (now `checked_div`). Note the census reads git, not the working tree -- the
# crate was invisible to this gate until `git add`. A crate that decides whether
# a probability may be trusted is exactly what this family counts.
# 2026-10-04: integer market, calibration and decision-protocol are all present.
# Combined 34 of 91 = 37.36%; retain all three lint-adoption gains.
floor_bp = 3736
floor_set = "measurement"
population_floor = 91

[family.life]
# 7 affine rights, 0 with a validity interval.
#
# Every one-shot right in nucleus is affine and enforced as such. `Authority`
# carries #[must_use = "an Authority that is never spent is an action that was
# authorised and not taken"], is consumed by value in spend_on, and has two
# compile_fail doctests proving replay (E0382) and clone (E0599) are rejected.
# DecisionToken, CheckProof, DischargedBundle, PodRuntime, ServeToken and
# VerifyToken are the same shape.
#
# NOT ONE OF THEM EXPIRES. A token minted at t=0 authorises at t=infinity, so the
# window between time-of-check and time-of-use is unbounded on every right in the
# system. The affine half of the discipline is done; the temporal half was never
# started. 14 of the 120 audit-and-bug issues are lifecycle defects.
#
# WHY THIS SUB-CENSUS AND NOT THE OTHER TWO. Unbounded carriers have a real
# defect behind them -- Kernel.trace is a Vec<Decision> appended once per allowed
# operation with no cap, and FlowTracker never compacts while its capped mirror
# FlowGraph carries four named ceilings -- but the population is "a collection in
# a LONG-LIVED struct", and long-lived is a judgement. The measurement that
# exists (902 collection fields, 328 grown and never bounded, 69 in structs whose
# NAMES suggest they persist) rests on a regex over struct names, and a
# denominator decided that way is the metric equivalent of a gate that cannot
# fail. Transition totality has almost no population: three transition functions
# in the whole repo, one of them on a mock whose trait declares no transition law
# at all. Both are ADRs, not ratchets, and both become countable once their
# design question is answered. convergence made the same call for two of its four
# arrows and named them rather than averaging them in.
#
# WHY floor_bp = 0 IS PINNED AND NOT MISSING. A zero floor normally means a gate
# that passes for every tree. Here the zero is still gated from both sides:
# population_floor keeps the denominator from shrinking, and the slack check
# fires the moment the first right gains an interval -- turning the gate red and
# forcing the pin up to meet it. measured_zero = true makes that a deliberate
# sentence rather than a value someone left out, and the parser refuses the key
# once floor_bp rises above zero, so the acknowledgement cannot go stale.
#
# 2026-09-11 (second pass): DecisionToken carries the checksum of the effective
# permissions it was decided against, and the executor refuses a token whose
# checksum is not the one it is about to run under. 0 -> 1 of 7.
#
# The measured zero did exactly what it was admitted to do. It did not sit
# quietly at zero while the work happened: the slack check turned the first
# discharge into a red -- "life is at 14.28% but the floor is pinned at 0.00%"
# -- and the pin could not be carried forward. That is the whole defence of
# admitting floor_bp = 0, and it was driven rather than argued.
#
# A STATE FINGERPRINT IS A TIGHTER BOUND THAN A CLOCK, not a weaker one. A TTL
# asks "how long has it been?"; the invariant a one-shot right needs is "has
# anything it depended on changed?". Those diverge both ways -- a thirty-second
# token is stale at one millisecond if the policy was amended, and sound an hour
# later if nothing moved -- and a TTL also imports a trusted clock and host/guest
# skew across the vsock boundary. So the family counts either form, and the
# vocabulary says which is which.
#
# Not yet bounded: Authority, CheckProof, DischargedBundle, PodRuntime,
# ServeToken, VerifyToken. The last two cross a process boundary and are
# serialized, so they need the fingerprint checked on arrival rather than a
# borrow; the first four are in-process and could take a lifetime instead, which
# would make staleness a compile error the way affinity already makes replay one
# (E0382). That is an ADR and a call-site refactor, not a ratchet.
# 2026-09-12: both verified CI result types now carry and enforce a consumption
# deadline. With their two added affine rights: 3 bounded rights out of 9.
# 2026-09-12: VerifiedArtifacts carries and enforces its consumption deadline.
# 2026-09-13: VerifiedLogs inherits the execution deadline and checks it when
# consumed. Adding the unbounded type first reddened CI at 4/11 (36.36%);
# the expiry regression refuses consumption after the deadline. Now 5/11.
# 2026-09-16 (#2936): nucleus_jsonl::Durable, the proof an acknowledgement is built
# from, entered the census as an affine right. Adding it unbounded reddened CI at
# 5/12 (41.66%), and that exposed a real hole: the proof did not say WHICH record it
# proved, so one record's proof could acknowledge another. It now carries a
# state_hash of the log and the record, checked at both acknowledgement sites. 6/12.
# 2026-09-26 (#3020): federated_credential::Refilled, the proof a federated
# credential was minted or found cached, entered as an affine right. Unbounded it
# reddened CI at 6/13 (46.15%), and it was a real gap: the proof vouched for a
# credential with an end and carried none, so only the store stood between a
# held proof and an expired token. It now carries not_after (the cache entry's
# end, or the pod certificate's on a hit) and handle_perform refuses a proof past
# it before the store is read. 7/13.
# 2026-09-27: VerifiedDeclassification, the witness FlowGraph::apply_verified
# spends, entered as an affine right. Unbounded it measured 6/13 (46.15%) and
# reddened this family; it now carries the signed token's valid_until, fixed at
# mint, and apply_verified decides expiry from that field and no other on the
# production path (refused Expired, not burned). 7/13.
# 2026-09-29, merging main into the declassification branch: both affine rights
# (Refilled from #3020, VerifiedDeclassification here) on one tree, both bounded. 8/14.
# 2026-10-01 (#3112, #2905): egress_meter::EgressCharge, the host's reservation
# for one guest send, entered as an affine right. Unbounded it reddened CI at
# 8/15 (53.33%). Chasing it found a real gap one layer down: EgressHold ids are
# per-ledger (every ledger numbers from zero), so a hold settled on a ledger
# that did not decide it released THAT ledger's same-id hold -- a NotSent
# refunded bytes in flight, and the real hold then settled against nothing and
# was never counted. EgressHold now carries its ledger's epoch and
# EgressLedger::settle refuses a foreign one (EgressSettleError::ForeignHold)
# before the id is looked up.
# Two census corrections in the same change:
# * A THIRD FORM OF BOUND. EgressCharge<'a> holds `&'a EgressMeter`, and only
#   EgressMeter::admit builds one, so it cannot outlive or be settled against
#   any meter but its issuer -- a compile error, tighter than either field.
#   life::borrows_its_issuer credits exactly that: a lifetime the struct
#   declares, a field whose type is `&'x Issuer` at the top (so
#   PhantomData<&'a ()> or Option<&'a T> does not count), and an impl of
#   Issuer that constructs the right. Copying the epoch onto the charge
#   instead would have been a second decider of one fact (ADR 0007 G).
# * THE CLONE WINDOW. is_clone read the 8 lines above a declaration AFTER
#   production_region stripped comments, so a documented type's window reached
#   the previous item: EgressHold and EgressDecision read as Clone and fell out
#   of the population. The window now stops at the previous item's boundary.
# Neither correction moves main: re-measured on main 2fc73eda with both, life is
# 8/14 (57.14%) and linearity 4 on 14 types, as before. This branch measures
# 10/17: EgressHold (epoch) and EgressCharge (issuer borrow) bounded,
# EgressDecision -- the reserve() outcome that carries a hold -- not.
# A-19: replacing EgressCharge's `meter: &'a EgressMeter` with an Arc drops the
# family to 9/17 (52.94%), below this floor, and the scorecard reds.
# 2026-10-02 (#2702 P7): nucleus-decision-protocol adds three affine rights --
# DecisionId, ApprovalId and host::Spent. Unbounded they measured 10/20 (50.00%)
# and reddened this family, and it was the EgressHold hole again: every
# DecisionLedger numbers from zero, so decision 0 from a closed channel was
# live decision 0 on the channel that replaced it -- a replay across a
# reconnect that no single ledger could see. All three now carry their
# ledger's epoch, and consume/redeem refuse a foreign one
# (LedgerError::ForeignEpoch) before the number is looked up. 13/20, 65.00%.
floor_bp = 6500
floor_set = "measurement"
population_floor = 20

[family.typed]
# 2 of 23 runtime flow kinds are distinguished at COMPILE time.
#
# portcullis_core::labeled encodes a Denning-style security lattice in the trait
# system -- Labeled<T, I: IntegTag, C: ConfTag>, with Trusted/Untrusted/
# Adversarial crossed with Public/Internal/Secret -- and its own compile_fail
# doctest proves the thing that matters: Secret data cannot reach a function
# requiring ConfAtMost<Public>. That is a compile error, not a check anyone has
# to reach. It is the construction the 2026 literature calls Denning-style IFC in
# Rust's type system, and it is already here.
#
# It is applied to TWO kinds: FileRead (Trusted, Internal) and WebContent
# (Adversarial, Public). The other twenty-one are tracked by FlowTracker at
# runtime, which is sound and is also a CHECK -- so it has to be reached.
# nucleus-observed-lint exists precisely because an ingest path can forget to
# call observe, and its doc names the defect it was built from: /v1/run returned
# arbitrary subprocess stdout and observed nothing. A kind that is LIFTED cannot
# forget. That is the whole difference, and this ratio is the fraction.
#
# A LINT AND A TYPE SYSTEM ARE NOT THE SAME TOOL, and this family is where the
# difference is visible. A dylint pass can decide ADOPTION -- does every function
# in the ingest closure return a labelled type -- which is a typeck question over
# a bounded set of paths, and nucleus-observed-lint already answers the runtime
# equivalent. It cannot decide THE INVARIANT: "no Secret value reaches a Public
# sink, through any composition anyone writes later" is not a bounded search, it
# is what parametric polymorphism gives for free once the data is inside the
# typed region. The lint guards the frontier; the types guard the interior.
#
# So this family and `observed` should move in OPPOSITE directions. Every kind
# lifted here is a path the lint no longer has to police, and .observed-ratchet
# .toml's ceiling should fall as this ratio rises. If it does not, one of the two
# is measuring something other than what it says.
#
# Custom is excluded by name: it carries a caller-supplied string and cannot take
# a fixed pair of tags, so counting it would put an undischargeable obligation in
# the denominator forever. convergence excludes its two unmeasurable arrows the
# same way.
#
# A row of LIFTED_TO_TYPES cannot over-claim: the gate checks the named type
# exists and carries a `Labeled<` field, and refuses a row naming a NodeKind that
# is not a variant. Both halves are tested.
#
# 2026-09-11: seeded at the measurement. The next lifts are the ones with an
# obvious tag pair -- McpToolResult and ToolResponse are adversarial, EnvVar and
# Secret are confidential -- and each is a struct plus a registry row.
floor_bp = 869
floor_set = "measurement"
population_floor = 23

[family.suppress]
# 5 of 134 production lint suppressions expire. The rest are forever.
#
# THIS FAMILY MEASURES THE EXEMPTION CHANNEL OF THE OTHER FIVE. bound, alg, tot,
# life and typed each report how much of what the tree declares is covered by a
# mechanism that CAN FAIL. Every one of those mechanisms can be switched off,
# silently and permanently, by one line: #[allow(clippy::whatever)].
#
# An #[allow] is forever. It outlives the reason it was written for and nothing
# says when that reason expired. An #[expect] is the same waiver with an expiry:
# when the lint stops firing there, unfulfilled_lint_expectations errors and the
# attribute has to go. It is the ONLY suppression that can itself fail, which is
# this card's definition of discharged applied to the waivers.
#
# THE ASYMMETRY IS THE CASE. Across the tree: 292 #[allow], of which ZERO carry a
# `reason =`. 48 #[expect], of which all 48 do. The tree already knows the right
# form and 86% of its suppressions are the other one.
#
# PRODUCTION ONLY, and for this family that is not merely the convention. A
# suppression inside #[cfg(test)] cannot disable a production gate, and disabling
# a production gate is the defect being measured. That is why the number is 5 of
# 134 rather than 39 of 206: most existing #[expect]s waive lints in test code,
# including nine of portcullis-effects' ten, which waive
# clippy::let_underscore_must_use at test sites.
#
# A MANDATE ONLY REACHES WHERE ITS TABLE DOES. allow_attributes and
# allow_attributes_without_reason are clippy lints, delivered through
# [workspace.lints.clippy] -- and that table reaches a crate only if the crate
# opts in with `[lints] workspace = true`. 54 of 95 crates opt in. 41 do NOT, and
# they include portcullis, portcullis-core and nucleus-flow-replay: the crates
# holding the lattice, the receipt hashing and the flow replay. Their 53
# production suppressions are reported as `undeclared` rather than counted,
# because counting them as discharged would mean a crate could LEAVE the lint
# table and have its allows become compliant. Same reading `tot` takes of the
# crates clippy cannot compile, same reason: ADR 0007 A-2.
#
# HOW IT IS PAID. Two lines into the existing [workspace.lints.clippy] table --
# allow_attributes = "deny" and allow_attributes_without_reason = "deny" -- and
# clippy::allow_attributes has a machine-applicable suggestion, so most of the
# conversion is `cargo clippy --fix`. Two real costs: a #[allow(dead_code)] that
# fires only under some feature combinations becomes an unfulfilled expectation
# under others, so those need per-site judgement under the --all-features matrix;
# and the 41 non-adopting crates need three manifest lines each before the
# mandate reaches them at all.
#
# 2026-09-11: seeded at the measurement.
# Raised 373 -> 444 and population 134 -> 135 on 2026-09-14 (#2891). The telemetry test
# that isolates the exporter's global state in a child process needs
# clippy::disallowed_methods waived. Written as #[expect(..., reason = ...)]
# rather than #[allow]: it should stop compiling the day the exporter no longer
# needs isolating, which is exactly the property this family measures. So the
# suppression RAISED the ratio rather than diluting it -- 5 of 134 became 6 of
# 135 -- and the floor follows the measurement, because a floor with slack
# under it has already stopped gating.
#
# Raised 444 -> 652 and population 135 -> 138 on 2026-09-14 (#2891), second pass:
# the three numeric casts the telemetry needs to observe integer counters as f64
# metrics. They were tripping the CLIPPY ratchet, and #[expect] is what removes
# a violation there -- so one gate's fix feeds the other, and both move the way
# they are supposed to.
#
# Meanwhile on main, 373 -> 378 and population 134 -> 132 on 2026-09-16 (#2914):
# the reputation module's removal deleted two production suppressions, which
# RAISES the discharged ratio without discharging anything -- the denominator
# shrank. The floor was raised to the measurement so that did not read as progress.
#
# 2026-09-16, merging main into #2891: both moves apply to one tree -- the telemetry's
# four suppressions added, the reputation module's two removed -- and the pins are
# set to what that tree measures (9 of 136 discharged = 6.61%), not to either
# branch's number, since neither branch's number describes the merged tree.
#
# 2026-09-16: deleting WorkloadApiServer and its clients removed 3 undischarged
# `#[allow]`s with the code they excused (136 -> 133). The ratio rises because the
# denominator shrank, not because anything was discharged; pinned at the
# measurement so it does not read as progress. 9/133 = 6.76%.
# 2026-09-16 (#2935): the clippy ban on OpenOptions::append (ADR 0007 G-1) left ten
# sites that are not record logs -- child stdout, a VMM console, dnsmasq's log, the
# agent's own append effect, a test playing a tamperer -- and each carries an
# `#[expect]` naming why. Ten new suppressions, all ten discharged (a mechanism that
# fails if the reason stops holding: an unfulfilled expectation is an error).
# 19 of 146 = 13.01%, pinned at the measurement.
#
# 2026-09-18: rebased onto the tree that deleted WorkloadApiServer, so neither
# branch's number describes the merged tree -- 19 of 143 = 13.28%, re-measured
# rather than carried over from either side.
#
# LOWERED 1388 -> 1328 on 2026-09-27, and the reason is the one this family was
# written to reward. HTTP `grep_search` carried
# `#[expect(clippy::disallowed_methods, reason = "#1216 OPEN ...")]` over a raw
# `std::fs::File::open`. The handler now reads through
# `Sandbox::read_to_string_for_search`, so the lint stopped firing and the
# expectation had to go -- the one suppression form that CAN fail, failing as
# designed. Removing a discharged waiver lowers a discharged ratio (20/144 ->
# 19/143), because the census counts waivers, not the defects under them; the
# population floor is re-pinned with it so nothing else can slip under.
#
# 2026-09-29: the tool-proxy's private `RunRequest` gives way to
# `nucleus_client::wire::RunRequest`, and its `#[allow(dead_code)]` on
# `timeout_seconds` goes with it -- a public field of a shared wire type is not
# dead. One undischarged suppression deleted with the code it excused: 19 of
# 142 = 13.38%. The ratio rises because the denominator shrank, so both pins
# follow the measurement rather than reading it as progress.
#
# 2026-10-01 (#3022, rebased onto the above): the hard-coded outside-issuer path,
# crates/nucleus-node/src/oidc.rs, is deleted in favour of a configured [[caller]]
# binding, and its four production #[allow(dead_code)]s go with it -- by deletion,

app = "nucleus-fly-runner-manager"
primary_region = "iad"
# Deployed from the repository root, so the build context holds the workspace the manager is a
# member of: `fly deploy . --config ci/fly-runner/manager.toml --remote-only --ha=false --yes`.
[build]
  dockerfile = "Dockerfile.manager"
[env]
  GITHUB_REPO = "coproduct-opensource/nucleus"
  RUNNER_APP = "nucleus-fly-build"
  FLY_REGION = "iad"
  # 30s, not 20: a pass costs 2 + LOOKBACK_RUNS + 1 calls, and 30 runs every 20s is 5940/hour
  # against a 5000/hour limit. Conditional requests only pay for themselves while nothing
  # changes, which under a backlog is never.
  POLL_SECONDS = "30"
  # Every machine is standby, so nothing is ever retired and this is inert. It is kept because
  # a pool whose standby is lowered needs it again. Why standby = size: a stopped machine is
  # billed for its root filesystem only, $0.15/GB-month — about $0.40 a month each for this
  # image — while a machine that has to be created and warmed on demand costs a job two passes
  # and an image pull. Warm capacity is the cheapest thing in this system; the volumes are what
  # cost money ($48/month for the build pool's eight), which is why the build pool's size is
  # pinned to its volume count until the compile cache is shared rather than per machine.
  IDLE_MINUTES = "30"
  LOOKBACK_RUNS = "25"
  # The pools. `build` takes every job on the CI_BUILD_RUNNER label (cargo test, clippy, hack,
  # llvm-cov, dylint: the six-to-twelve-minute jobs that hold a hosted slot for the whole
  # time); `gate` is the other 52 sites on CI_RUNNER — mostly seconds-long script gates, but the
  # Lean builds (ci-spec-lean, ck-policy-lean, econ-lean, ifc-lean, rubric-lean), `ci/test`,
  # `doctests`, `owasp-gauntlet` and `gates-can-fail` are on that label too, which is why it is
  # shared-cpu-8x with 16 GB and not the 2x/4 GB a pure script pool would want.
  #
  # POOLS LIVES HERE, WHOLE -- volume ids included -- and the Fly secret of the same name must
  # stay UNSET (`fly secrets unset POOLS -a nucleus-fly-runner-manager`). Until 2026-09-29 the
  # deployed pool was a secret that overrode this file, on the theory that volume ids are only
  # known at deploy time. It went stale: slots 2, 10, 16 and 17 named volumes that had since been
  # replaced (runner_cache_2b and runner_cache_10 were recreated 2026-09-12, after the last
  # manager deploy), so every create for those four slots failed with HTTP 400 -- a status the
  # manager logs WITHOUT its body, on purpose, because a body may carry a runner token. The same
  # request by hand against the current volume ids succeeds (slot 10: machine 82d1451fd21078).
  # Nothing could see the secret from a checkout, so ci/fly-pools-drift.txt recorded the README
  # and this file disagreeing without being able to say which was true. The ids are identifiers,
  # not credentials; a file the deploy reads is the only copy that cannot drift from itself.
  #
  # `requires_volume: true` now holds for real: every one of the 24 build indexes has its own
  # volume (index order = machine index, `volumes[i]` mounts on nucleus-fly-build-i), so the
  # manager's validator refuses any edit that leaves a compile machine on the 8 GB rootfs.
  # standby = size for both pools, for the reason under IDLE_MINUTES above.
  POOLS = '[{"label":"nucleus-fly-build","guest":{"cpu_kind":"performance","cpus":8,"memory_mb":32768},"size":24,"standby":24,"requires_volume":true,"volumes":["vol_re1kmly3gy8q3p14","vol_r7yjqnwl3zokyyyr","vol_42kez7mygx601034","vol_rkgmy36y0kgx55o4","vol_458n3d0qzll3kgx4","vol_4oj1qmk768jze69r","vol_rnzeyqww5ko7gg1r","vol_40o0gw0lqymw96p4","vol_vjyqy6dkzdo7o9ov","vol_r7yjye935pmq8knr","vol_vp265wy66epmwxw4","vol_vly0ywe255e1kqg4","vol_r7yjye9q28663dgr","vol_vgnpn5g5yklk1x14","vol_4y8q8oy5q17yom9r","vol_458n8mp7x9l253x4","vol_v3g19987k5qxolw4","vol_40o0987dy3zqddp4","vol_r68woozmxlooj2j4","vol_vly0ddozj2wzj7g4","vol_4qlnoozqy9xm8l8r","vol_vjyqzzmnqxwy9d9v","vol_4919qqgonw0qky6r","vol_vz8mgg1d9071nnev"],"env":{"CARGO_BUILD_JOBS":"8","SCCACHE_CACHE_SIZE":"20G"}},{"label":"nucleus-fly-gate","guest":{"cpu_kind":"shared","cpus":8,"memory_mb":16384},"size":40,"standby":40}]'
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"

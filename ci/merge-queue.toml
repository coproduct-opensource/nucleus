# The merge-queue ruleset constants, pinned in the tree.
#
# These are the numbers the capacity theorem (ci/lean/CiSpec/Capacity.lean)
# and the timeout invariant (ci-spec I7) reason about. They are ALSO live
# settings on GitHub, editable in the UI; `cargo xtask ci-spec live-parity`
# reports drift between this file and `GET /repos/…/rulesets/<ruleset_id>`,
# so a UI edit is a red on the schedule rather than a silent change of the
# theorem's hypotheses.
#
# History: on 2026-09-04 the check timeout was 60 minutes and build
# concurrency 2, with pull_request runs sharing the same 4–5 build runners.
# Entries were ejected by TIMEOUT, not by any red check, and roughly nothing
# merged for 15 hours. The theorem's bite (CiSpecBite.lean) is that trace.

ruleset_id = 22351600
check_response_timeout_minutes = 360
# Build concurrency. It was 1 for as long as the pool was four or five shared
# runners: a second group in flight took runners the first one needed, and the
# first was ejected by the timeout rather than by any red check.
#
# 2026-09-09: the pool is 38 Fly Machines that are warm and idle between jobs,
# and at concurrency 1 a merge group took 40 to 70 minutes with most of the pool
# doing nothing — ten queued entries is most of a day. Four groups in flight give
# each group nine machines of its own share (T12), and the group of 2026-09-04
# fits its share inside the 360-minute budget with room to spare
# (CiSpecBite.two_groups_of_twenty_three_fit_360).
#
# 2026-09-09, later the same day: lowered from 4 to 2 on measurement. Speculation only pays
# when the pool has capacity ABOVE one group's demand, and it does not — a single group's jobs
# already saturate the 47 machines. With c groups in flight the head group gets p/c of the pool
# (T12), and only the HEAD can merge, so four-way speculation was making the one group that
# matters four times slower to go green. Four hours produced one merge with nothing red.
#
# The cost of raising it: when an entry is ejected, every group after it is
# rebuilt, so a red PR wastes up to three speculative groups instead of none.
# That is the trade — cheap while entries are mostly green, and it is why this
# is 4 and not 10.
max_entries_to_build = 2
max_entries_to_merge = 1
min_entries_to_merge = 1
min_entries_to_merge_wait_minutes = 0
grouping_strategy = "ALLGREEN"
merge_method = "SQUASH"

# Classic branch protection `required_status_checks.strict`. `true` forces a
# rebase before every merge, which with a queue means a rebase cycle; the
# queue itself tests the merged result, which is what strict was for.
strict = false

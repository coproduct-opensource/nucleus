[package]
name = "ci-spec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Typed model of nucleus's CI configuration and the invariants the merge queue relies on — a decision procedure, not a linter"
# Dev/CI tooling — never published.
publish = false

[lints]
workspace = true

[dependencies]
# The scope-list parser the CI step runs, so the checker reads a list exactly as the decider does.
ci-scope = { path = "../ci-scope" }
anyhow = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# `preserve_order`: workflow YAML is read into `serde_json::Value`, and job and matrix
# declaration order is meaning here (check-run names, line recovery). Explicit, so it does
# not depend on which other crate happens to share the build.
serde_json = { workspace = true, features = ["preserve_order"] }
nucleus-yaml = { path = "../nucleus-yaml" }
toml = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

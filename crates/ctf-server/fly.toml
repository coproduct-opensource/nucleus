# Fly deployment for ctf-server (app nucleus-ctf): the native API server plus
# the pre-built "The Vault" WASM site from crates/ctf-engine/dist.
#
# The Dockerfile builds the workspace (`COPY . .`), so the build context is the
# repository root. Deploy from the root:
#
#   fly deploy . --config crates/ctf-server/fly.toml
#
# `dockerfile` below is resolved relative to this file, like the other
# per-crate fly.toml files.

app = "nucleus-ctf"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

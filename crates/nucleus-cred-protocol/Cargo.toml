[package]
name = "nucleus-cred-protocol"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Wire types shared by the credential broker's host and guest halves — no credential material"

# THIS CRATE EXISTS BECAUSE THE BAN CAUGHT A DESIGN ERROR.
#
# The guest needs the ENVELOPE shape to ask the broker for something. It must
# never link the crate that holds `Credential` and `CredentialStore`. Putting
# both in `nucleus-cred-broker` meant the guest could only get the wire types by
# taking the credential machinery with them, which `deny.toml`'s wrapper list
# correctly refused.
#
# So the protocol lives here: two plain serde structs, no secrets, safe for
# either side to depend on.
[dependencies]
serde = { workspace = true }

# The frame codec lives here so the guest that SIGNS and the host that VERIFIES
# run one implementation rather than two that agree today. These add no new
# supply-chain surface: nucleus-tool-proxy already links all three at the same
# workspace versions, so the guest's dependency graph is unchanged. That check
# was made rather than assumed — adding a dependency to a credential path
# casually is what the LiteLLM compromise punishes.
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true

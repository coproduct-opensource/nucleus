[package]
name = "nucleus-federation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Keyless federation, both directions: mint ES256 assertions for a host-observed pod identity, exchange them for short-lived upstream tokens (RFC 8693 / RFC 7523), and validate tokens from outside issuers. Vendor-neutral; every endpoint, audience and parameter is operator configuration."
repository = "https://github.com/coproduct-opensource/nucleus"  # vendor-allow: project repo URL
keywords = ["oidc", "oauth", "jwt", "federation", "spiffe"]
categories = ["authentication", "cryptography"]

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
# Signature VERIFICATION of inbound tokens only, through the workspace-pinned
# aws_lc_rs backend. Signing does not go through it: the one signing path is
# ring's fixed-length ECDSA below, so no generic "sign with any Algorithm"
# entry point exists in this crate.
jsonwebtoken = { workspace = true }
# The JWKS wire shapes (`Jwk`, `Jwks`) are reused from here rather than
# redeclared, so there is one definition of what a JWK looks like on the wire.
nucleus-oidc-core = { path = "../nucleus-oidc-core" }
# `rustls` so an https token endpoint or JWKS URI is reachable; the Client
# itself is always supplied by the caller.
reqwest = { workspace = true, features = ["rustls"] }
# ES256 signing (fixed-length r||s, the JOSE form) and the jti randomness.
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# Wipe the exchanged token, the assertion and the PKCS#8 bytes on drop. The
# same crate and version line nucleus-cred-broker uses for `Credential`.
zeroize = { version = "1", features = ["zeroize_derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
# Workspace reqwest carries no default crypto provider; a test that builds a
# Client installs ring's first (workspace convention).
rustls = { workspace = true }
# Hermetic mock token endpoint and discovery/JWKS server, same version the
# rest of the workspace uses.
wiremock = "0.6"

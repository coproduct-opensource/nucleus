[package]
name = "nucleus-guest-init"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Guest init for Firecracker images"
repository = "https://github.com/coproduct-opensource/nucleus"
readme = "README.md"

[lib]
name = "nucleus_guest_init"
path = "src/lib.rs"

[[bin]]
name = "nucleus-guest-init"
path = "src/main.rs"

[dependencies]
nix = { version = "0.31", default-features = false, features = ["mount", "fs", "net"] }
vsock = "0.5"
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
nucleus-spec = { path = "../nucleus-spec" }

[target.'cfg(target_os = "linux")'.dependencies]
# The blocking netlink socket (MIT, pure Rust; already in the lockfile via
# netdev). Linux-only: AF_NETLINK does not exist elsewhere. The messages are
# encoded in net.rs; see its module docs for why not netlink-packet-route.
netlink-sys = { version = "0.9", default-features = false }

[package]
name = "nucleus-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SPIFFE-based workload identity for Firecracker VMs"
repository = "https://github.com/coproduct-opensource/nucleus"
documentation = "https://docs.rs/nucleus-identity"
readme = "README.md"
keywords = ["spiffe", "identity", "mtls", "security", "workload"]
categories = ["cryptography", "network-programming"]

[features]
default = []
# Enable SPIRE integration for production deployments
spire = ["dep:spiffe", "dep:futures-util"]
# Enable the TPM 2.0 DevID residency verifier (pure-Rust verify path; opt-in until
# wired to issuance). Uses only in-tree crypto (ring + sha2) — no libtss2 in the TCB.
# The AK↔EK credential-activation binder (Inc 3 brick 2) additionally needs raw
# AES-128-CFB (the one primitive ring does not expose); pulled in only here.
tpm-devid = ["dep:aes", "dep:cfb-mode"]
# Expose `VerifiedAttestation::for_test`, a synthetic constructor that bypasses
# all backend verification (#2450 sealing). Meant only for another crate's
# `[dev-dependencies]` (resolver v2 keeps this out of that crate's published
# artifact) so its tests can unit-test a `VerifiedAttestation` consumer against
# controlled field combinations without standing up a real SVID chain.
test-helpers = []
# Enable HTTP-based did:web resolution (requires network)
resolver = ["dep:reqwest"]

[dependencies]
nucleus-proto = { path = "../nucleus-proto" }
tonic = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
# Crypto
# x509-parser feature: reconstructs a signing `Issuer` from a persisted root
# cert's DER (`Issuer::from_ca_cert_pem`) so the CA root can survive a process
# restart. Without it, `SelfSignedCa` can only sign with the `CertificateParams`
# it built in-memory at construction, which is why the root was ephemeral.
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { workspace = true }
x509-parser = { workspace = true }
ring = "0.17"
# AES-128-CFB for TPM credential activation (Inc 3 brick 2) — feature-gated behind
# `tpm-devid`, the one symmetric primitive not available through ring.
aes = { version = "0.9", optional = true }
cfb-mode = { version = "0.9", optional = true }

# Async
tokio = { workspace = true, features = ["sync", "time", "io-util", "net", "rt", "macros", "fs"] }
tokio-rustls = { workspace = true }
async-trait = "0.1"
# For the `mtls` module: a custom `axum::serve::Listener` doing the TLS
# handshake itself (the current idiom — axum's own `ListenerExt::handshake`
# formalizes the same pattern) so client-cert extraction lands in
# `MtlsConnectInfo` before any handler runs. Promoted from nucleus-tool-proxy
# so nucleus-node can share the SAME listener rather than a second copy that
# drifts from it.
axum = { workspace = true }

# Serialization
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Certificate validation
webpki = { package = "rustls-webpki", version = "0.103" }

# IFC label encoding for X.509 extensions
portcullis-core = { path = "../portcullis-core" }

# Utils
chrono = { workspace = true, features = ["serde"] }
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
pem = "4"
time = "0.3"
thiserror = { workspace = true }
tracing = { workspace = true }

# HTTP client for did:web resolution (optional)
reqwest = { workspace = true, features = ["rustls-no-provider", "json"], optional = true }

# SPIRE integration (optional)
spiffe = { version = "0.16", optional = true, features = ["workload-api-x509"] }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
# Cart Mandate end-to-end: AP2's Cart Mandate is an ApprovalBundle whose
# manifest_hash is a cart hash. Dev-only — nucleus-identity does not depend on
# the commerce layer, the commerce layer binds to it.
nucleus-recompute = { path = "../nucleus-recompute" }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-test = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
rand = "0.10"

[lints]
workspace = true

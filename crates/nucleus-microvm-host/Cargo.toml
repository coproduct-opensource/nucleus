[package]
name = "nucleus-microvm-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "What a host must provide to run nucleus microVMs, and moving a workspace in and out of one"
repository = "https://github.com/coproduct-opensource/nucleus"
keywords = ["firecracker", "kvm", "microvm", "ext4"]
categories = ["virtualization", "command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "nucleus-hostctl"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
hex = { workspace = true }
# `measure_artifact`: the digest the node holds `scratch_digest` to. One
# function for the fact, not a second hash here (ADR 0007 G-1).
nucleus-identity = { path = "../nucleus-identity" }
nucleus-spec = { path = "../nucleus-spec" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "fs"] }

# Safe wrappers over the KVM ioctls, from the crate the VMM itself is built on,
# so the probe adds no `unsafe` to the workspace. Linux-only by nature.
[target.'cfg(target_os = "linux")'.dependencies]
kvm-ioctls = "0.25"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "fs"] }

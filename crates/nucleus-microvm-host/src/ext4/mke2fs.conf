# The whole mke2fs configuration a nucleus ext4 image is built under.
#
# `ext4::build` hands this file to mke2fs as MKE2FS_CONFIG, so the host's
# /etc/mke2fs.conf is never read: two hosts with different distribution defaults
# (orphan_file, metadata_csum_seed, a different inode_ratio) would otherwise lay
# out the same tree as different bytes. Every feature is named here; nothing is
# inherited.
#
# `-T nucleus` selects the usage type below. Naming one explicitly stops mke2fs
# choosing "small"/"big"/"huge" by image size, which would make the feature set a
# function of how much content there is.
#
# orphan_file (the 1.47 default) is left out on purpose: it needs a 5.15+ guest
# kernel to mount read-write, and a guest kernel older than the host's mke2fs is
# the ordinary case.

[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
	default_mntopts = acl,user_xattr
	enable_periodic_fsck = 0
	blocksize = 4096
	inode_size = 256
	inode_ratio = 16384
	reserved_ratio = 0
	hash_alg = half_md4
	lazy_itable_init = false
	lazy_journal_init = false

[fs_types]
	ext4 = {
		features = has_journal,extent,huge_file,flex_bg,metadata_csum,64bit,dir_nlink,extra_isize
		inode_size = 256
	}
	nucleus = {
		blocksize = 4096
		inode_size = 256
	}

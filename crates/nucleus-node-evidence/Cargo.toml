[package]
name = "nucleus-node-evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Node attestation evidence (TPM 2.0 quote + TCG boot event log + IMA log, bound to the node's executor key) and a pure-Rust RATS verifier that appraises it to Attested / Contested / Expired / Unattested"
repository = "https://github.com/coproduct-opensource/nucleus"
keywords = ["attestation", "tpm", "rats", "measured-boot", "ima"]
categories = ["cryptography"]

[lints]
workspace = true

# The verifier is pure Rust on purpose: no libtss2, no ring, no C, so it compiles
# to wasm32. sdks/verifier-js EMBEDS it (and sdks/verifier-py links it), so ANY
# change to this crate moves the pinned wasm digest in
# crates/nucleus-verifier-service/embedded-wasm.pins: take the new digest from CI's
# build and replace the pin; never generate it locally.
#
# Two digest generations are in the lockfile: the workspace's sha2 0.11 hashes
# everything here, and the RustCrypto ECDSA crates below (p256/p384 0.13) are
# verified through their *prehash* entry points with that digest, so no
# digest-0.10 trait object ever crosses this crate's API.
#
# RSA (TPM RSASSA quotes, RSA certificates in AK chains) is verified in-crate:
# src/rsa_pkcs1.rs, verify-only RSASSA-PKCS1-v1_5 by encode-and-compare. The
# `rsa` crate is NOT used: it carries RUSTSEC-2023-0071 with no patched release,
# and the C-backed alternatives (aws-lc-rs, ring) do not build for wasm32.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
# The bignum under src/rsa_pkcs1.rs: runtime-sized `modpow`, pure Rust, no_std
# capable, already in the lockfile. Public inputs only, so it need not be
# constant time.
num-bigint = { version = "0.4", default-features = false }
# Parsing only: the workspace entry enables `verify` (ring). Signatures over the
# AK certificate chain are checked here with the RustCrypto crates above.
x509-parser = { version = "0.18", default-features = false }
# Attester only: the command layer wipes its buffers, and an unsealed secret
# (A2, the node's Ed25519 keys) is handed out in a wiping container. Pure Rust;
# not reached by the verifier, so the wasm build never links it.
zeroize = { version = "1", optional = true }

[features]
default = []
# The Attester role: raw TPM 2.0 commands over /dev/tpmrm0 (or a software
# TPM's socket in tests). Pure Rust and std-only; off by default so the
# verifier alone stays free of any I/O.
attester = ["dep:zeroize"]

[[example]]
name = "swtpm_attest"
required-features = ["attester"]

[[example]]
name = "federation_key"
required-features = ["attester"]

[dev-dependencies]
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
proptest = { workspace = true }

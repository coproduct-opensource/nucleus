[package]
name = "nucleus-oci-rootfs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Flatten a local OCI image into one verified, normalized, deterministic rootfs tar"
keywords = ["oci", "rootfs", "tar", "container", "microvm"]
categories = ["filesystem"]

[lints]
workspace = true

[dependencies]
flate2 = "1.1"
hex = { workspace = true }
oci-spec = { version = "0.10", default-features = false, features = ["image"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { version = "0.4", default-features = false }
thiserror = { workspace = true }
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }

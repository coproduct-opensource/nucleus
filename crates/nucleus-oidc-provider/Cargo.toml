[package]
name = "nucleus-oidc-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "OIDC OP that mints JWT-SVIDs / OIDC tokens for nucleus pods and exchanges externally-issued SVIDs for audience-bound tokens (RFC 8693). Peer to nucleus-verifier-service."
repository = "https://github.com/coproduct-opensource/nucleus"  # vendor-allow: project repo URL
keywords = ["oidc", "oauth", "spiffe", "svid", "identity"]
categories = ["web-programming::http-server", "cryptography"]

[[bin]]
name = "nucleus-oidc-provider"
path = "src/main.rs"

[dependencies]
# Internal — Jwks / SvidClaims / future JwtIssuer
nucleus-lineage = { path = "../nucleus-lineage" }
# Public OIDC primitives — JtiCache, federation traits, key resolution.
nucleus-oidc-core = { path = "../nucleus-oidc-core" }
# Two things, both reused rather than restated. (1) The outside-issuer
# validator (`inbound::ExternalIssuerValidator`): exact iss/aud, an algorithm
# set with no `none`/HMAC variant, key-fits-algorithm, replay by token hash —
# the same checks nucleus-node applies at its federation ingress (#3022).
# (2) The ES256 signing key and its rotation protocol (`keyring`): one P-256
# signer in the workspace, behind a trait a TPM- or KMS-held key implements.
nucleus-federation = { path = "../nucleus-federation" }
# The validator's JWKS fetches go through reqwest with `rustls-no-provider`
# (workspace convention); `main` installs ring's provider first thing.
rustls = { workspace = true }
# Certificate verification + the effect dimension, so a federated token can be
# bounded by the authority a person actually delegated rather than only by the
# operator's rule. Lean on purpose: `serde` + `crypto` gives `verify_certificate`
# and `effect_surface` without pulling Cedar or the YAML/TOML policy loader into
# the OP's TCB. `effect_surface` is built for exactly this consumer — its module
# docs note it stays independent of the catalog so an outside verifier can read
# which effects a certificate grants.
chrono = { workspace = true }
portcullis = { path = "../portcullis", default-features = false, features = ["serde", "crypto"] }

# Web framework — mirrors nucleus-verifier-service stack so the
# concurrency-limit / body-limit / timeout / CORS hardening (audit MED-5)
# can be lifted verbatim per task #43.
axum = { workspace = true }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.7", features = ["trace", "timeout", "cors", "limit"] }
tokio = { workspace = true, features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Serde
serde = { workspace = true }
serde_json = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logs
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nucleus-otel-bootstrap = { path = "../nucleus-otel-bootstrap" }

# CLI
clap = { workspace = true }

# Crypto — explicit zeroize feature (closes #31 GA-8: never rely on
# transitive default-features for key-material zeroization). Version is
# centralized in [workspace.dependencies] (the exact `=3.0.0` pin that
# forces single-version resolution across the workspace); features stay local.
ed25519-dalek = { workspace = true, features = ["zeroize", "rand_core", "pkcs8"] }

# Encoding
hex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }

# Federation rule store — TOML on disk.
toml = { workspace = true }

# File-backed keystore — age v1 format is stable and widely deployed
# (SOPS, rage). The crate version is pre-1.0 (API still stabilizing)
# but the on-disk format is fixed at age-encryption.org/v1.
age = "0.12"

# Zeroize the passphrase wrapper. `zeroize_derive` lets future types
# in this crate opt in declaratively.
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# rand for SigningKey::generate; matches nucleus-lineage's pin.
rand = { version = "0.10", features = ["std", "std_rng"] }

# UUIDv4 for the `jti` claim.
uuid = { workspace = true }

# Constant-time compare for any future verify-side KID lookup. The
# JwtIssuer in this crate doesn't compare KIDs (it only embeds the
# active KID returned by the keystore), but downstream verifiers will.
subtle = "2"

[dev-dependencies]
# Minting a real pod certificate in tests — the OP itself never signs one.
ring = { workspace = true }
tower = { version = "0.5", features = ["util", "limit"] }
http-body-util = "0.1"
tempfile = { workspace = true }
proptest = { workspace = true }
# Verifying an issued ES256 token the way a relying party's JWT library does
# (tests/outside_issuer.rs), so "an RP accepts it" is tested, not assumed.
jsonwebtoken = { workspace = true }

[lints]
workspace = true

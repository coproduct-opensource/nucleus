# Fly.io deployment for nucleus-oidc-provider.   # vendor-allow: Fly-specific deploy config by design
#
# Deploy and operate per `docs/oidc-provider-runbook.md`. Build context is the
# repository root (the image builds workspace path dependencies):
#   flyctl deploy . --config crates/nucleus-oidc-provider/fly.toml \
#     --dockerfile crates/nucleus-oidc-provider/Dockerfile
# - Service binds 0.0.0.0:8080 so 6PN can reach it via `<app>.internal`.
# - Public listener: HTTPS termination at the Fly edge.
# - Critical path: `min_machines_running = 1` (the OP is the
#   identity root; cold-start latency on token-exchange is unacceptable).
# - gRPC port reserved at 9080 (HTTP + 1000) per workspace convention,
#   to be wired when nucleus-oidc-provider grows a tonic surface.

app = "nucleus-oidc-provider"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  NUCLEUS_OIDC_BIND = "0.0.0.0:8080"
  # The coproduct.one deployment (owner decision 2026-10-08). Written into
  # every token as `iss` and compared byte for byte by relying parties and
  # outside issuers' `aud`: no trailing slash, and changing it later means
  # reconfiguring every relying party. Needs DNS (CNAME to this app) and a
  # certificate (`flyctl certs add oidc.coproduct.one`).
  NUCLEUS_OIDC_ISSUER_URL = "https://oidc.coproduct.one"
  # ES256 signing key, keyring layout, file custody, on the volume below.
  # Created on first boot; rotated with `nucleus-oidc-provider keys ...`.
  NUCLEUS_OIDC_SIGNING_KEY_DIR = "/data/keys"
  # Rules + outside-issuer bindings, baked into the image by the Dockerfile.
  NUCLEUS_OIDC_FEDERATION_CONFIG = "/app/deploy/federation.coproduct-one.toml"
  RUST_LOG = "info,nucleus_oidc_provider=info"

# Public HTTPS surface — discovery doc, JWKS, token-exchange endpoint.
[http_service]
  internal_port = 8080
  force_https = true                   # public listener: TLS terminated at edge
  auto_stop_machines = "off"           # NEVER stop the OP — critical path
  auto_start_machines = true
  min_machines_running = 1             # acceptance (b): always-on
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"                  # acceptance (d): real health probe

[[services]]
  # Reserved gRPC surface (HTTP+1000 per workspace convention). Currently
  # unbound; when we add a tonic surface (token-exchange streaming, etc.)
  # this slot is ready.
  protocol = "tcp"
  internal_port = 9080
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[services.ports]]
    port = 9080
    handlers = ["tls"]
    [services.ports.tls_options]
      alpn = ["h2"]                    # gRPC requires HTTP/2

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  # Bump to "shared-cpu-2x" / 1gb when integration tests show p99 > 200ms
  # under target traffic.

# Persistent volume for the ES256 signing key (/data/keys). The platform chowns
# the mount point to the image's user (distroless `nonroot`), which is the
# owner the keyring requires of every key file. Custody is a 0400 PKCS#8 file
# on this volume: NOT sealed — anyone with the volume or a snapshot of it holds
# the key. No passphrase is involved; see the runbook's custody section.
[mounts]
  source = "nucleus_oidc_data"
  destination = "/data"

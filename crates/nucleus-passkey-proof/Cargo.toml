[package]
name = "nucleus-passkey-proof"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Offline WebAuthn ES256 assertion verification over an exact subject digest"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.23"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

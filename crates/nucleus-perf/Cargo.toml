[package]
name = "nucleus-perf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Dev-only measurement harness — never published.
publish = false
readme = "README.md"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
ureq = { workspace = true }
nucleus-client = { path = "../nucleus-client" }
# `exchange` drives the real RoundScheduler — real windows, real closer tasks,
# real run_vcg — so the numbers describe shipped code rather than a model of it.
nucleus-authority-exchange = { path = "../nucleus-authority-exchange", features = ["test-support"] }
nucleus-econ-types = { path = "../nucleus-econ-types" }
nucleus-permission-market = { path = "../nucleus-permission-market" }
nucleus-recompute = { path = "../nucleus-recompute" }
nucleus-econ-kernels = { path = "../nucleus-econ-kernels" }
# Closes the loop the receipts exist for: recompute -> CreditEvent -> required_bond.
nucleus-creditworthiness = { path = "../nucleus-creditworthiness" }
# The scheduler is async: `exchange` is the only subcommand that needs a runtime.
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "sync"] }
portcullis = { path = "../portcullis", features = ["spec", "dlc"] }
# Approvals on a real pod are Ed25519; `pkcs8` loads the node's persisted
# approval signing key from its DER file.
ed25519-dalek = { workspace = true, features = ["pkcs8", "alloc"] }
hex = { workspace = true }
# The report is a portcullis type; the spec gives the harness the same lattice
# the pod resolved, so ρ is divided by what actually ran.
nucleus-spec = { path = "../nucleus-spec" }
chrono = { workspace = true }
uuid = { workspace = true }
# Local-mode arm: compile a goal into a grant and seal it, so the run is bounded
# by the effects it is measured against.
nucleus-task-compiler = { path = "../nucleus-task-compiler" }
nucleus-provenance-memory = { path = "../nucleus-provenance-memory" }
ring = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
# `guest-transcript` reaches the node over mTLS, which ureq cannot present a
# SPIFFE client identity for (see nucleus-cli's reqwest note).
reqwest = { workspace = true, features = ["rustls-no-provider", "json", "blocking"] }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }

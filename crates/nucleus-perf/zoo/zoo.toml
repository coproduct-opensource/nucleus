# The stress bug zoo: defects the stress harness is scored against.
#
# `cargo xtask stress-zoo` builds the proxy at HEAD. Every mode below must HOLD on
# that build: a mode red on correct code cannot score anything. Then, for each
# defect, it applies `zoo/<name>.patch`, rebuilds the proxy, and runs every mode.
# A defect is KILLED when at least one mode reports a violation (exit 1).
#
# `expect` is the claim, and a mismatch in either direction fails the run:
# - `killed`: the harness catches this defect. A survivor is a regression.
# - `survives`: a gap, named. When a mode starts killing it, move it to `killed`
#   in the same change, so the file never understates what the harness catches.
#
# A patch that no longer applies is zoo rot: exit 2, never silently skipped.
#
# Not in the battery: `--mode hyper --high files`. It is violated on correct code
# by design (a private read followed by the session's first fetch egresses; see
# #2946), so it cannot be a mode that must hold.

[[mode]]
name = "linearize-grant"
args = ["--mode", "linearize", "--policy", "grant", "--clients", "4", "--ops", "30"]

[[mode]]
name = "linearize-trifecta"
args = ["--mode", "linearize", "--policy", "trifecta", "--clients", "4", "--ops", "12"]

[[mode]]
name = "hyper-web"
args = ["--mode", "hyper", "--policy", "trifecta", "--high", "web", "--ops", "5", "--trials", "30"]

[[defect]]
name = "web-taint-skipped"
origin = "web_fetch no longer records fetched content in the flow graph, so nothing downstream is tainted (#1633's guard, silently disarmed)"
expect = "killed"

[[defect]]
name = "kernel-ifc-gate-bypassed"
origin = "the kernel's lethal-trifecta flow gate computes a Deny and returns no decision, so the outbound action proceeds"
expect = "killed"

[[defect]]
name = "path-blocklist-ignored"
origin = "the path lattice never consults its blocklist, so .ssh/ and every other blocked glob is readable. It is the one decider behind both the kernel's path check and the FsPathAllowed obligation; dropping only the kernel's call is an equivalent mutant, because the obligation still refuses"
expect = "killed"

[[defect]]
name = "approval-never-spent"
origin = "a one-shot approval is checked but never decremented: one human decision buys unlimited operations (the C-4 shape)"
expect = "survives"

[package]
name="nucleus-request-proof"
version="0.1.0"
edition="2024"
license="MIT"
[dependencies]
nucleus-identity={path="../nucleus-identity"}
olog-store={path="../../vendor/olog-store"}
olog-ledger={path="../../vendor/olog-ledger"}
base64="0.23"
serde={version="1",features=["derive"]}
serde_json="1"
sha2="0.10"
hex="0.4"
chrono="0.4"
url="2"
x509-parser="0.18"
thiserror="2"
[features]
# An in-process replay ledger for the tests of this crate's dependents, in
# place of the durable Olog ledger. It is not durable across a process restart
# and exists only in debug builds; a release build with this feature uses the
# durable ledger.
volatile-test-ledger=[]
[dev-dependencies]
tempfile="3"

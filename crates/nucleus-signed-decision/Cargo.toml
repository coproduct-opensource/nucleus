[package]
name = "nucleus-signed-decision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Owner decisions an agent can verify: the signed record, its canonical bytes, and the one verifier that mints a SignedDecision"
publish = false

# The format and the verifier of a signed owner decision (gatehouse
# docs/signed-decisions.md, sections 3 and 5). Public on purpose: nucleus must
# verify a decision without the private control plane, and the control plane pins
# THIS crate by git revision rather than restating the encoding (ADR 0007 G-1).
#
# NOT a dependency of anything sdks/verifier-js embeds: a change here must never
# move crates/nucleus-verifier-service/embedded-wasm.pins.

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
# The owner's signing key today is a P-256 Secure Enclave key (X9.62 DER ECDSA).
# `pkcs8` gives the SPKI decoder and the DER signature type; both are already in
# the lockfile through nucleus-node-evidence.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
# Ed25519 trust roots, verified with `verify_strict` only (scripts/check-verify-strict.sh).
ed25519-dalek = { workspace = true }

[package]
name = "nucleus-spec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PodSpec definitions for nucleus nodes and tool proxies"
repository = "https://github.com/coproduct-opensource/nucleus"
documentation = "https://docs.rs/nucleus-spec"
readme = "README.md"
keywords = ["ai", "security", "spec", "yaml", "agents"]
categories = ["config", "development-tools"]

[dependencies]
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = "0.3"
sha2 = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }

portcullis = { path = "../portcullis", features = ["serde", "spec"] }
# The operator's effect table for an upstream (#3229): one type, so the
# projection a pod spec carries and the classifier both sides run cannot
# drift. Serde-only without its `io` feature.
nucleus-cred-protocol = { path = "../nucleus-cred-protocol" }
# The label vocabulary a host-effect declassification records (#3255).
portcullis-core = { path = "../portcullis-core", features = ["serde"] }

[lints]
workspace = true

[package]
name = "nucleus-yaml"
version.workspace = true
edition.workspace = true
# portcullis (and so the Kani welfare-proof closure) depends on this crate;
# Kani 0.67 bundles rustc 1.93. serde-saphyr itself needs 1.89.
rust-version = "1.93"
license.workspace = true
repository = "https://github.com/coproduct-opensource/nucleus"
description = "The one YAML reader and writer for nucleus: serde-saphyr with every compatibility and safety setting pinned in one place"
keywords = ["yaml", "serde"]
categories = ["encoding"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
# Safe-Rust YAML 1.2 (de)serializer. Replaces serde_yaml 0.9, whose
# unsafe-libyaml is unmaintained (RUSTSEC-2024-0449). Default features only:
# no include, properties or robotics.
serde-saphyr = "1.3.0"

[dev-dependencies]
serde_json = { workspace = true }

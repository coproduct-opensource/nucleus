# Research Web — read local files and search/fetch web content.
#
# The agent can read files (low risk) for context and access the web
# for research. Cannot write, edit, execute, or push anything.
# Ideal for research tasks that combine local code context with
# external documentation, API references, or CVE databases.
#
#  Uninhabitable state analysis:
#   - Private data: read_files=low_risk (present)
#   - Untrusted content: web_search=low_risk, web_fetch=low_risk (present), and
#     any workspace file the principal did not write (README/AGENTS.md injection)
#   - Exfiltration: git_push=never, run_bash=never, create_pr=never, but
#     web_fetch/web_search ARE a vector: the agent chooses the URL, and a query
#     string carries whatever it has read (sink_max_conf_for admits Internal).
#   => Not safe by construction. What bounds the web vector is the host: a host
#      declared in network.dns_allow may receive workspace-derived data. With no
#      allowlist, once the session has read private data, an undeclared host
#      needs a human approval (`web_egress <host>:<port>`; web_fetch_policy::admit_host).

name: research-web
description: "Web research — read files, search/fetch web, no writes or execution"

capabilities:
  read_files: low_risk
  write_files: never
  edit_files: never
  run_bash: never
  glob_search: always
  grep_search: always
  web_search: low_risk
  web_fetch: low_risk
  git_commit: never
  git_push: never
  create_pr: never
  manage_pods: never

paths:
  blocked:
    - "**/.ssh/**"
    - "**/.aws/**"
    - "**/.env"
    - "**/.env.*"
    - "**/credentials*"
    - "/etc/shadow"
    - "/etc/passwd"

budget:
  max_cost_usd: "1.50"
  max_input_tokens: 50000
  max_output_tokens: 5000

time:
  duration_minutes: 45

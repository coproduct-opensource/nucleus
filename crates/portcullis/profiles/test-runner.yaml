# Test Runner — execute tests and report results.
#
# Can read source code and run test commands, but cannot modify source
# files or push results.
#
# write_files and edit_files are never, so the workspace is read-only to
# every child, `cargo test` included (a Landlock write layer, #2907). A
# child writes only the runtime's scratch: /tmp, /cache, /dev/null and its
# HOME. Build output goes there, not into the workspace: run
# `CARGO_TARGET_DIR=/tmp/target cargo test`. A pod whose workspace cannot be
# held read-only (no Landlock) is refused, not run with it writable.
#
#  Uninhabitable state analysis:
#   - Private data: read_files=always (present)
#   - Untrusted content: web_fetch=never (absent)
#   - Exfiltration: git_push=never, create_pr=never (absent)
#   => One of three components. Safe by construction.

name: test-runner
description: "Test runner — read source, execute tests, no source writes"

capabilities:
  read_files: always
  write_files: never
  edit_files: never
  run_bash: low_risk
  glob_search: always
  grep_search: always
  web_search: never
  web_fetch: never
  git_commit: never
  git_push: never
  create_pr: never
  manage_pods: never

# Consent is explicit: every operation above `never` is
# listed in exactly one of `obligations` (requires approval) or
# `autonomous`; an undeclared one is refused by name.
autonomous:
  - read_files
  - run_bash
  - glob_search
  - grep_search

paths:
  blocked:
    - "**/.ssh/**"
    - "**/.aws/**"
    - "**/.env"
    - "**/.env.*"
    - "**/credentials*"

budget:
  max_cost_usd: "1.00"
  max_input_tokens: 50000
  max_output_tokens: 5000

time:
  duration_minutes: 30

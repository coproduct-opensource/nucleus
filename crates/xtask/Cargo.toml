[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Dev-only task runner — never published.
publish = false
readme = "README.md"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
# Constitutional gate: run ck-kernel admission on PolicyManifest amendments.
ck-kernel = { path = "../ck-kernel" }
ck-types = { path = "../ck-types" }
# CI configuration invariants (`cargo xtask ci-spec`).
ci-spec = { path = "../ci-spec" }
# `fly-pools` validates the committed POOLS default with the MANAGER's own validator,
# rather than a second copy of the rule that could drift from it.
ci-fly-runner = { path = "../ci-fly-runner" }

# Parse the actual Rust attributes and workflow arguments for Kani coverage.
syn = { version = "3", features = ["full", "visit"] }
toml = { workspace = true }
# `schedule-liveness` compares a run timestamp against now.
chrono = { workspace = true }
# `gatehouse-pin`: the import digest is a plain SHA-256 of prelude/ci.writ.
sha2 = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
# Throwaway test trees for workspace gates.
tempfile = { workspace = true }
# `guest-layer`: the guest's binary table, and the tar writer an imported image
# is emitted with, so the layer and the image are normalized by one piece of code.
nucleus-spec = { path = "../nucleus-spec" }
nucleus-oci-rootfs = { path = "../nucleus-oci-rootfs" }
# The guest layer's CA bundle. Pinned EXACTLY: the rendered bundle's digest is
# pinned in guest_layer.rs (CA_BUNDLE_SHA256), so a bump is a reviewed diff there.
webpki-root-certs = "=1.0.9"
base64 = { workspace = true }
# `gates-can-fail` restores a perturbed file on SIGINT/SIGTERM before it exits: a
# half-perturbed tree left behind by an interrupted run is worse than no check.
signal-hook = "0.4"

[dev-dependencies]
tar = { version = "0.4", default-features = false }

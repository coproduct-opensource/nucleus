# Scope the dependency scan to the platforms nucleus actually builds and ships
# (native CLI + services). Without this, cargo-deny evaluates ALL targets,
# including wasm32 — which pulls iroh-relay's browser-only WebSocket shim
# (ws_stream_wasm/pharos/async_io_stream, licensed "Unlicense"). Those crates
# are NEVER compiled in any native nucleus artifact (they sit under
# iroh-relay's `cfg(target_family="wasm")` deps), so this is a scope correction,
# NOT a license-policy relaxation — "Unlicense" is deliberately NOT added to the
# [licenses] allow-list below. The WASM verifier (sdks/verifier-js) is a
# separate crate that does not depend on iroh.
[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[advisories]
version = 2
# See https://github.com/RustSec/advisory-db
ignore = []
# These are informational; scope to workspace dependencies.
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards = "warn"
# CB4A separation of duties, enforced in the DEPENDENCY GRAPH.
#
# "The component that decides 'yes' (PDP) MUST never touch credential material."
#
# `nucleus-cred-broker` is the Credential Delivery Point. Listing it here with
# `wrappers` means only the composition root may depend on it — so a policy
# crate (portcullis*, nucleus-policy-*, nucleus-pca) that adds a dependency
# fails this gate. A crate that is not in the dependency graph has no symbols to
# reach, which is stronger than a lint over function bodies that indirection can
# defeat.
#
# The converse MUST — the CDP must never decide policy — is enforced inside the
# crate by `the_cdp_does_not_link_against_any_policy_crate`, which reads its own
# manifest.
deny = [
  { name = "nucleus-cred-broker", wrappers = ["nucleus-node"] },
  # ONE ed25519 line, enforced rather than merely pinned.
  #
  # The workspace pins `ed25519-dalek = "=3.0.0"` precisely so first-party
  # crates, iroh and the rest converge on one implementation. That pin does not
  # hold on its own: `multiple-versions = "warn"` above means a second version
  # is a warning nobody fails on, and the lockfile has quietly carried
  # ed25519-dalek 2.2.0 alongside 3.0.0 (#1628). A signing library resolved
  # twice means two implementations of the same primitive in one binary, and the
  # version pin said otherwise.
  #
  # `multiple-versions = true` here makes THIS crate a hard failure while the
  # global setting stays a warning, so the rule does not turn every unrelated
  # duplicate in the tree into a blocker.
  { name = "ed25519-dalek", deny-multiple-versions = true },
]

# The one duplicate that exists today, listed rather than tolerated silently.
#
# ed25519-dalek 2.2.0 reaches this workspace through delegation_calc:
#
#     ed25519-dalek 2.2.0 -> dlc-crypto -> dlc-d -> portcullis -> nucleus…
#
# Nothing here can fix it: the version lives in delegation_calc's manifest.
# coproduct-opensource/delegation_calc#148 bumps it to 3 (one line; that repo's
# whole suite passes), and once it merges the fix here is to move this repo's
# `rev =` pin forward and DELETE this skip — at which point the deny rule above
# starts binding for real.
#
# Listed with an exact version so a THIRD version, or a different crate arriving
# at 2.x, is not covered by it and fails immediately.
skip = [
  { name = "ed25519-dalek", version = "=2.2.0" },
]

[licenses]
# Allow common permissive licenses.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# CI-only rootfs: guest-init is built with `ci-podlist-probe` and launches the
# trusted lineage probe beside the proxy. It queries POD_LIST over this pod's
# real vsock; the host checks A and child C are included, sibling B excluded.
# The ordinary workload stays under the default seccomp filter, which denies
# AF_VSOCK. Syscall-filter denial is measured by the separate workload probe.
# The guest-init feature is absent from production builds.
apiVersion: nucleus/v1
kind: Pod
metadata:
  name: podlist-probe-a
  labels:
    enable_pod_mgmt: "true"
spec:
  work_dir: /work
  timeout_seconds: 2700
  # Keep the pod alive while trusted instrumentation polls for child creation.
  workload:
    command: /bin/sleep
    args:
      - "60"
    uid: 65534
  policy:
    type: profile
    name: orchestrator
  # The probe talks to the host only over the workload-API vsock, never the
  # network, so the pod stays default-deny — a leaking listing must not be
  # explainable by an open egress path.
  network:
    allow: []
    deny: []
  budget_model:
    base_cost_usd: 0.000001
    cost_per_second_usd: 0.0001
  image:
    kernel_path: ./build/firecracker/vmlinux
    rootfs_path: ./build/firecracker/rootfs.ext4
    read_only: true
    scratch_path: ./build/firecracker/scratch.ext4
  vsock:
    guest_cid: 3
    port: 5005
  seccomp:
    mode: default

[package]
name = "nucleus-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.portcullis]
path = "../crates/portcullis"
features = ["serde"]

[[bin]]
name = "command_can_execute"
path = "fuzz_targets/command_can_execute.rs"
test = false
doc = false

[[bin]]
name = "path_can_access"
path = "fuzz_targets/path_can_access.rs"
test = false
doc = false

[[bin]]
name = "permission_serde"
path = "fuzz_targets/permission_serde.rs"
test = false
doc = false

# Host-side Workload API vsock command parser — the trusted guest->host edge.
# Pulls in crates/nucleus-node/src/workload_api_protocol.rs via `#[path]`; no
# crate dependency needed because that module is std-only.
[[bin]]
name = "workload_api_command"
path = "fuzz_targets/workload_api_command.rs"
test = false
doc = false

# `cargo fuzz run <target>` takes these names verbatim, and cargo-fuzz generates
# snake_case targets by convention, so the binary names are externally
# controlled. Cargo's own lint documentation gives that as the reason this lint
# is allowable: "a binary may need to conform to externally controlled
# conventions which can include a different naming convention."
#
# Surfaced by actions-rust-lang/setup-rust-toolchain v2, which denies warnings
# through `build.warnings` instead of `RUSTFLAGS=-D warnings`. RUSTFLAGS only
# reaches rustc, so cargo's manifest lints were never denied before; this job is
# also the only one on a toolchain new enough to implement the config at all.
[lints.cargo]
non_kebab_case_bins = "allow"

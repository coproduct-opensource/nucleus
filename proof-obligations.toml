# Proof obligations (#2585): which function is held to which proof artifact.
#
# Checked by `cargo xtask proof-obligations` (crates/xtask/src/proof_obligations). Each row:
#
#   function     the Rust function, `crate::module::fn` or `crate::module::Type::fn`, resolved
#                by a `syn` walk of the crate's module tree. Renamed or deleted = red.
#   kind         lean-extracted | lean-mirror | kani | parity | typestate-fault-injection | missing
#   artifact     `<file>::<name>`: a Kani harness, a Lean theorem, or a #[test].
#   status       proved | allowlisted (allowlisted is for `missing` rows, with `tracking`)
#   source_hash  optional: SHA-256 of the function's signature + body tokens; a code edit
#                without re-pinning is red.
#   constant     lean-mirror only: the hand-written Lean constant the theorem is about.
#   tracking     on a missing row, the issue that will discharge it; on an artifact row, the gap
#                it discharged (kept, so the missing ratchet still counts the gap).
#
# Non-vacuity, per kind: a Kani harness must be run by a workflow lane, name the function,
# and END with a satisfiable `kani::cover!`; a Lean theorem must be in a module a workflow's
# Lean-action build elaborates (lean_tier), and its STATEMENT must name the constant Aeneas
# extracted the function to (read from the generated doc comment, never listed here).
#
# Seeded 2026-10-07. The lean-extracted rows are the output of
# `cargo xtask proof-obligations --derive`: every extracted, shipping function of every
# Lean-action tier paired with the first theorem (by file, then position) whose statement names
# its constant. The kani rows are the three scheduled harnesses that end in `kani::cover!`,
# each paired with the call its assertions are about; `--derive` prints every function those
# harnesses name as commented candidates, because which call is the subject is a reading.


# Lima VM template for Nucleus on Apple Silicon (aarch64).
#
# WHAT THIS FILE OWNS, AND WHAT IT DOES NOT
#
# It owns the SHAPE of the VM: image, resources, mounts, ports, and the OS
# packages Firecracker needs. It deliberately owns NO artifact versions, URLs or
# digests. Those live in one place, `nucleus_spec::guest_artifacts`, and
# `nucleus setup` installs them into the VM after it boots.
#
# That split is not tidiness. Until 2026-07-29 this file pinned Firecracker
# v1.14.0 and a kernel URL that returns HTTP 404, while the pin the node
# actually enforces (`vmm_version::PINNED`) was 1.16.1 and `nucleus setup`
# generated a third answer inline. Three provisioners, three versions, and
# nothing in CI booted a microVM to notice. A file that names no version cannot
# drift from one.
#
# Usage — resources are overridden by `nucleus setup`, so this is the standalone
# path:
#   limactl create --name nucleus scripts/lima/nucleus-aarch64.yaml
#   limactl start nucleus
#   nucleus setup            # installs Firecracker, kernel, rootfs, node
#
# Requires an Apple M3 or newer on macOS 15+. On earlier silicon there is no
# nested virtualisation, so there is no /dev/kvm, and Firecracker does not run
# slowly — it does not run at all.

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# Defaults for standalone use. `nucleus setup` overrides these with `--set`
# rather than rewriting the file, so the template stays valid on its own.
cpus: 4
memory: "8GiB"
disk: "50GiB"

# Apple Virtualization.framework. QEMU would work but cannot expose nested
# virtualisation on Apple Silicon, and without /dev/kvm there is no Tier 2.
vmType: "vz"

# The whole point: exposes /dev/kvm inside the guest for Firecracker.
nestedVirtualization: true

# Mount the host home at the SAME path, read-only. Same path matters: with the
# home mounted elsewhere, every `limactl shell` opens with
# `cd: /Users/...: No such file or directory` before running anything.
mounts:
  - location: "~"
    writable: false
  - location: "/tmp/lima"
    writable: true

portForwards:
  # nucleus-node HTTP API
  - guestPort: 8080
    hostPort: 8080
  # nucleus-node metrics
  - guestPort: 9080
    hostPort: 9080
  # nucleus-node gRPC (HTTP port + 1000, matching config.toml's grpc_url)
  - guestPort: 9180
    hostPort: 9180

# Lima installs rootless containerd + BuildKit by default. A Firecracker host
# needs neither, and installing them is not free: on a fresh VM it pushed first
# boot past `limactl start`'s timeout, so setup failed with "Lima VM failed to
# start" while the VM was in fact running and finishing provisioning. Measured
# 2026-07-29 — a 10-minute failure caused entirely by software nothing here uses.
#
# The config this template replaced disabled containerd; dropping the block was a
# regression, and `the_templates_disable_containerd` now pins it.
containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail

      apt-get update

      # ca-certificates is load-bearing, not hygiene: the guest rootfs is built
      # with a CA bundle copied from a host that has one, and drand's client
      # fails without a trust store. A rootfs with no CA store is what made the
      # tool-proxy panic as PID 1 on every pod (#2110).
      apt-get install -y \
        ca-certificates \
        curl \
        iptables \
        iproute2 \
        dnsmasq \
        e2fsprogs

      mkdir -p /var/lib/nucleus/artifacts /var/lib/nucleus/pods /var/log/nucleus

      # Firecracker, the kernel, the rootfs and nucleus-node are installed by
      # `nucleus setup` from the digests pinned in nucleus_spec::guest_artifacts.
      # Downloading them here would recreate the divergence described above.

message: |
  Nucleus Lima VM created.

  This VM has the OS packages and /dev/kvm. It does NOT yet have Firecracker,
  a kernel, a rootfs or nucleus-node — run `nucleus setup` to install them from
  their pinned digests, and `nucleus verify --tier2` to boot a real pod.

  Check nested virtualisation reached the guest:
    limactl shell nucleus -- ls -l /dev/kvm

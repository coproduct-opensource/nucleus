# Version pins are a LOCKSTEP TRIPLE, identical to the sibling `nucleus-guarantee-lint`:
#   - nightly-2026-04-16          (rust-toolchain.toml)
#   - clippy_utils rev f6d3106…   (matched to that nightly)
#   - dylint_linting / dylint_testing 6.0.1
# Do NOT bump any single pin in isolation.
[package]
name = "nucleus_cb4a_lint"
version = "0.1.0"
authors = ["Nucleus Platform"]
description = "cb4a_separation: nothing reachable from the PDP touches credential material, and nothing reachable from the CDP touches policy. Closed under the call graph."
edition = "2024"
publish = false

[lib]
# Dylint loads a dynamic library; a crate linking rustc_driver via
# `#![feature(rustc_private)]` cannot also emit an rlib/bin.
crate-type = ["cdylib"]

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "f6d310692116e9a527ce6d0b3526c965d9c5d7b9" }
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "6.0.1"

# Self-contained workspace, explicitly NOT part of the parent.
[workspace]

[package.metadata.rust-analyzer]
rustc_private = true

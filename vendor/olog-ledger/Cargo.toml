[package]
name = "olog-ledger"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Who wrote what to an olog-store, as a hash chain recorded inside the store itself."

[dependencies]
olog-store = { path = "../olog-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RFC 8785 canonical JSON: the encoding nucleus-receipt signs, so a later
# signing layer signs exactly the bytes hashed here.
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

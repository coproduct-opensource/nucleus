[package]
name = "olog-ledger"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Who wrote what to an olog-store, as a hash chain recorded inside the store itself."

[dependencies]
olog-store = { path = "../olog-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RFC 8785 canonical JSON: the encoding nucleus-receipt signs, so a later
# signing layer signs exactly the bytes hashed here.
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

# Clippy in this vendored crate only (owner decision, 2026-10-31). The source is kept byte for
# byte as vendored (vendor/OLOG-PROVENANCE.md pins its hashes), so the allow lives here rather
# than as `#![allow]` in src/lib.rs. Measured with clippy 0.1.96 on 2026-10-31: one
# `type_complexity` in src/lib.rs. The workspace, and every crate outside vendor/, keeps clippy
# at `-D warnings`.
[lints.clippy]
type_complexity = "allow"
